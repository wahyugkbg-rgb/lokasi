<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔥 Dashboard Pemantauan Kebakaran Nasional - Real Time</title>

    <!-- Leaflet CSS -->
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #1a1f2b, #0f131c);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e25822;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 span {
            color: #e25822;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1e2635;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #2d3748;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
        .last-update {
            color: #94a3b8;
        }
        .btn-refresh {
            background: #e25822;
            border: none;
            color: #fff;
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-refresh:hover {
            background: #c94a1a;
        }
        .btn-refresh:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== MAIN LAYOUT ===== */
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* ===== MAP ===== */
        .map-container {
            flex: 1;
            position: relative;
            background: #141a24;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #141a24;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 400px;
            min-width: 320px;
            max-width: 45vw;
            background: #11161f;
            border-left: 1px solid #25303f;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-tabs {
            display: flex;
            background: #0d121b;
            border-bottom: 1px solid #25303f;
            flex-shrink: 0;
        }
        .sidebar-tabs button {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .sidebar-tabs button.active {
            color: #e8edf5;
            border-bottom-color: #e25822;
            background: #1a212e;
        }
        .sidebar-tabs button:hover {
            background: #1a212e;
            color: #e8edf5;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
        }
        .sidebar-content::-webkit-scrollbar {
            width: 5px;
        }
        .sidebar-content::-webkit-scrollbar-track {
            background: #0d121b;
        }
        .sidebar-content::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 10px;
        }

        /* ===== LIST ITEMS ===== */
        .event-item {
            background: #1a212e;
            border-left: 4px solid #e25822;
            border-radius: 4px;
            padding: 12px 14px;
            margin-bottom: 10px;
            transition: background 0.15s;
            cursor: default;
        }
        .event-item:hover {
            background: #212b3c;
        }
        .event-item .title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #f1f5f9;
        }
        .event-item .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }
        .event-item .meta .loc {
            color: #60a5fa;
        }
        .event-item .meta .time {
            color: #a78bfa;
        }
        .event-item .meta .source {
            color: #34d399;
        }
        .event-item .desc {
            font-size: 13px;
            color: #cbd5e1;
            margin-top: 6px;
            line-height: 1.4;
        }
        .event-item .badge-provinsi {
            display: inline-block;
            background: #2d3748;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #e2e8f0;
            margin-right: 6px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }
        .empty-state .emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== LOG ===== */
        .log-container {
            background: #0d121b;
            border-top: 1px solid #1e2635;
            max-height: 120px;
            overflow-y: auto;
            padding: 6px 14px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .log-container::-webkit-scrollbar {
            width: 4px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 10px;
        }
        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #161e2b;
        }
        .log-entry .log-time {
            color: #64748b;
            margin-right: 12px;
        }
        .log-entry .log-ok {
            color: #4ade80;
        }
        .log-entry .log-err {
            color: #f87171;
        }
        .log-entry .log-info {
            color: #60a5fa;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .sidebar {
                width: 100%;
                min-width: unset;
                max-width: 100%;
                border-left: none;
                border-top: 1px solid #25303f;
                max-height: 45vh;
            }
            .main {
                flex-direction: column-reverse;
            }
            .header h1 {
                font-size: 16px;
            }
            .header-right {
                font-size: 12px;
            }
        }
        @media (max-width: 480px) {
            .header {
                padding: 8px 12px;
            }
            .header h1 {
                font-size: 14px;
            }
            .btn-refresh {
                padding: 4px 12px;
                font-size: 11px;
            }
            .sidebar-content {
                padding: 8px 10px;
            }
            .event-item {
                padding: 10px 12px;
            }
        }

        /* leaflet overrides */
        .leaflet-control-attribution {
            background: rgba(11, 14, 20, 0.85) !important;
            color: #94a3b8 !important;
            font-size: 10px !important;
        }
        .leaflet-popup-content {
            color: #0b0e14;
            font-size: 13px;
        }
        .leaflet-popup-content strong {
            color: #b91c1c;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <h1>🔥 <span>Pantau</span> Kebakaran Nasional</h1>
        <div class="header-right">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText">Aktif</span>
            </div>
            <span class="last-update" id="lastUpdateLabel">⏱️ --:--:--</span>
            <button class="btn-refresh" id="refreshBtn">⟳ Refresh</button>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="main">
        <!-- MAP -->
        <div class="map-container">
            <div id="map"></div>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-tabs">
                <button class="active" data-tab="list">📋 Daftar Kejadian</button>
                <button data-tab="stats">📊 Statistik</button>
            </div>
            <div class="sidebar-content" id="sidebarContent">
                <!-- diisi oleh JS -->
            </div>
        </div>
    </div>

    <!-- ===== LOG ===== -->
    <div class="log-container" id="logContainer">
        <div class="log-entry"><span class="log-time">[INIT]</span> <span class="log-info">Dashboard siap. Mengambil data dari berbagai sumber...</span></div>
    </div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const mapElement = document.getElementById('map');
            const sidebarContent = document.getElementById('sidebarContent');
            const logContainer = document.getElementById('logContainer');
            const statusText = document.getElementById('statusText');
            const lastUpdateLabel = document.getElementById('lastUpdateLabel');
            const refreshBtn = document.getElementById('refreshBtn');

            // ---------- Leaflet map ----------
            const map = L.map(mapElement, {
                center: [-2.5, 118.0],
                zoom: 5,
                zoomControl: true,
                fadeAnimation: true,
                attributionControl: true
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
                subdomains: 'abcd',
                maxZoom: 19,
                minZoom: 3
            }).addTo(map);

            // marker cluster group
            const markerGroup = L.layerGroup().addTo(map);

            // ---------- state ----------
            let allEvents = [];
            let currentTab = 'list';
            let isRefreshing = false;

            // ---------- log ----------
            function logMessage(msg, type = 'info') {
                const time = new Date().toLocaleTimeString('id-ID');
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                let cls = 'log-info';
                if (type === 'ok') cls = 'log-ok';
                else if (type === 'err') cls = 'log-err';
                entry.innerHTML =
                    `<span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span>`;
                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
                // keep last 80 lines
                while (logContainer.children.length > 80) {
                    logContainer.removeChild(logContainer.firstChild);
                }
            }

            // ---------- update status ----------
            function setStatus(online, msg) {
                const dot = document.querySelector('.status-dot');
                if (online) {
                    dot.style.background = '#4ade80';
                    statusText.textContent = msg || 'Aktif';
                } else {
                    dot.style.background = '#f87171';
                    statusText.textContent = msg || 'Gangguan';
                }
            }

            function updateTimestamp() {
                const now = new Date();
                lastUpdateLabel.textContent = '⏱️ ' + now.toLocaleTimeString('id-ID');
            }

            // ---------- render list ----------
            function renderList(events) {
                if (!events || events.length === 0) {
                    sidebarContent.innerHTML = `
                        <div class="empty-state">
                            <span class="emoji">🔍</span>
                            <p>Belum ada data kebakaran yang terpantau.</p>
                            <p style="font-size:12px;margin-top:6px;">Coba refresh atau periksa koneksi.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                // sort by date descending (newest first)
                const sorted = [...events].sort((a, b) => {
                    const da = a.timestamp ? new Date(a.timestamp).getTime() : 0;
                    const db = b.timestamp ? new Date(b.timestamp).getTime() : 0;
                    return db - da;
                });

                for (const ev of sorted) {
                    const title = ev.title || 'Kejadian kebakaran';
                    const loc = ev.location || 'Lokasi tidak diketahui';
                    const prov = ev.province || '';
                    const time = ev.timestamp ? new Date(ev.timestamp).toLocaleString('id-ID') : '--';
                    const source = ev.source || 'tidak diketahui';
                    const desc = ev.description || '';

                    html += `
                        <div class="event-item">
                            <div class="title">${escHtml(title)}</div>
                            <div class="meta">
                                <span class="loc">📍 ${escHtml(loc)}</span>
                                ${prov ? `<span class="badge-provinsi">${escHtml(prov)}</span>` : ''}
                                <span class="time">🕒 ${escHtml(time)}</span>
                                <span class="source">📡 ${escHtml(source)}</span>
                            </div>
                            ${desc ? `<div class="desc">${escHtml(desc)}</div>` : ''}
                        </div>
                    `;
                }

                sidebarContent.innerHTML = html;
            }

            // ---------- render stats ----------
            function renderStats(events) {
                if (!events || events.length === 0) {
                    sidebarContent.innerHTML = `
                        <div class="empty-state">
                            <span class="emoji">📊</span>
                            <p>Belum ada data untuk ditampilkan.</p>
                        </div>
                    `;
                    return;
                }

                // count by province
                const provCount = {};
                let total = 0;
                for (const ev of events) {
                    total++;
                    const p = ev.province || 'Lainnya';
                    provCount[p] = (provCount[p] || 0) + 1;
                }

                const sortedProv = Object.entries(provCount).sort((a, b) => b[1] - a[1]);

                let html = `
                    <div style="margin-bottom:16px;">
                        <div style="font-size:20px;font-weight:700;color:#f1f5f9;">${total}</div>
                        <div style="color:#94a3b8;font-size:13px;">Total kejadian terpantau</div>
                    </div>
                    <div style="font-weight:600;margin-bottom:10px;font-size:14px;">📍 Berdasarkan Provinsi</div>
                `;

                for (const [prov, count] of sortedProv) {
                    const pct = Math.round((count / total) * 100);
                    html += `
                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
                            <span style="width:100px;font-size:13px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(prov)}</span>
                            <div style="flex:1;background:#1e2635;height:8px;border-radius:4px;overflow:hidden;">
                                <div style="background:#e25822;height:100%;width:${pct}%;border-radius:4px;"></div>
                            </div>
                            <span style="font-size:13px;color:#94a3b8;min-width:36px;text-align:right;">${count}</span>
                        </div>
                    `;
                }

                // source breakdown
                const srcCount = {};
                for (const ev of events) {
                    const s = ev.source || 'tidak diketahui';
                    srcCount[s] = (srcCount[s] || 0) + 1;
                }
                const sortedSrc = Object.entries(srcCount).sort((a, b) => b[1] - a[1]);

                html += `<div style="font-weight:600;margin:18px 0 10px;font-size:14px;">📡 Sumber Data</div>`;
                for (const [src, count] of sortedSrc) {
                    html += `
                        <div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0;border-bottom:1px solid #1a212e;">
                            <span style="color:#cbd5e1;">${escHtml(src)}</span>
                            <span style="color:#94a3b8;">${count}</span>
                        </div>
                    `;
                }

                sidebarContent.innerHTML = html;
            }

            // ---------- helper: escape html ----------
            function escHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ---------- update map markers ----------
            function updateMap(events) {
                markerGroup.clearLayers();

                if (!events || events.length === 0) return;

                for (const ev of events) {
                    if (!ev.lat || !ev.lng) continue;
                    const lat = parseFloat(ev.lat);
                    const lng = parseFloat(ev.lng);
                    if (isNaN(lat) || isNaN(lng)) continue;

                    const popupContent = `
                        <strong>${escHtml(ev.title || 'Kebakaran')}</strong><br>
                        📍 ${escHtml(ev.location || '')}<br>
                        ${ev.province ? `🏛️ ${escHtml(ev.province)}<br>` : ''}
                        🕒 ${ev.timestamp ? new Date(ev.timestamp).toLocaleString('id-ID') : '--'}<br>
                        📡 ${escHtml(ev.source || '')}
                        ${ev.description ? `<br><span style="font-size:12px;">${escHtml(ev.description)}</span>` : ''}
                    `;

                    const marker = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: '#e25822',
                        color: '#facc15',
                        weight: 2,
                        opacity: 0.9,
                        fillOpacity: 0.75,
                    }).bindPopup(popupContent);

                    markerGroup.addLayer(marker);
                }
            }

            // ---------- switch tab ----------
            function switchTab(tab) {
                currentTab = tab;
                document.querySelectorAll('.sidebar-tabs button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tab);
                });
                if (tab === 'list') {
                    renderList(allEvents);
                } else if (tab === 'stats') {
                    renderStats(allEvents);
                }
            }

            // ---------- CORE: fetch data from multiple sources ----------
            async function fetchAllData() {
                if (isRefreshing) return;
                isRefreshing = true;
                refreshBtn.disabled = true;
                setStatus(true, 'Mengambil data...');
                logMessage('🔄 Memulai pengambilan data dari berbagai sumber...', 'info');

                const combined = [];
                const errors = [];

                // -------- 1. BNPB Open Data API (datastore) --------
                try {
                    logMessage('📡 Mencoba BNPB API (data.bnpb.go.id)...', 'info');
                    const url =
                        'https://data.bnpb.go.id/ne/api/3/action/datastore_search?resource_id=353da3aa-9ada-42aa-a5c2-e653d52ffd9c&limit=100';
                    const resp = await fetch(url, {
                        headers: { 'Accept': 'application/json' }
                    });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.success && json.result && json.result.records) {
                            const records = json.result.records;
                            logMessage(`✅ BNPB API: ${records.length} record ditemukan.`, 'ok');
                            for (const rec of records) {
                                // Kolom: Nama Kabupaten/Kota, Latitude, Longitude, KEBAKARAN HUTAN DAN LAHAN
                                const kab = rec['Nama Kabupaten/Kota'] || '';
                                const lat = rec['Latitude'];
                                const lng = rec['Longitude'];
                                const fire = rec['KEBAKARAN HUTAN DAN LAHAN'];
                                // hanya jika ada data kebakaran
                                if (fire && fire !== '0' && fire !== '-') {
                                    combined.push({
                                        title: `Kebakaran Hutan/Lahan - ${kab}`,
                                        location: kab || 'Indonesia',
                                        province: '',
                                        lat: lat,
                                        lng: lng,
                                        timestamp: new Date().toISOString(),
                                        source: 'BNPB Open Data',
                                        description: `Data BNPB: ${fire}`
                                    });
                                }
                            }
                        } else {
                            logMessage('⚠️ BNPB API: response sukses tapi tidak ada records.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ BNPB API: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ BNPB API error: ${e.message}`, 'err');
                    errors.push('BNPB');
                }

                // -------- 2. RapidAPI - Indonesia Disaster Data (proxy via corsproxy) --------
                try {
                    logMessage('📡 Mencoba RapidAPI (Indonesia Disaster Data)...', 'info');
                    // Gunakan CORS proxy untuk menghindari CORS block
                    const proxy = 'https://corsproxy.io/?';
                    const target =
                        'https://indonesia-disaster-data.p.rapidapi.com/api/v1/disaster?type=fire&limit=50';
                    const resp = await fetch(proxy + encodeURIComponent(target), {
                        headers: {
                            'x-rapidapi-key': 'dummy-key-for-demo',
                            'x-rapidapi-host': 'indonesia-disaster-data.p.rapidapi.com'
                        }
                    });
                    // Karena RapidAPI butuh API key, kemungkinan besar gagal, tapi kita coba.
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.data && Array.isArray(json.data)) {
                            for (const item of json.data) {
                                combined.push({
                                    title: item.event_name || 'Kebakaran',
                                    location: item.location || item.area || 'Indonesia',
                                    province: item.province || '',
                                    lat: item.latitude || item.lat,
                                    lng: item.longitude || item.lng,
                                    timestamp: item.event_date || new Date().toISOString(),
                                    source: 'RapidAPI (BNPB)',
                                    description: item.description || ''
                                });
                            }
                            logMessage(`✅ RapidAPI: ${json.data.length} data.`, 'ok');
                        } else {
                            logMessage('⚠️ RapidAPI: data tidak sesuai format.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ RapidAPI: HTTP ${resp.status} (mungkin butuh API key)`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ RapidAPI error: ${e.message}`, 'err');
                    errors.push('RapidAPI');
                }

                // -------- 3. NASA FIRMS via proxy (modis hotspot) --------
                try {
                    logMessage('📡 Mencoba NASA FIRMS (hotspot) via proxy...', 'info');
                    // FIRMS API: https://firms.modaps.eosdis.nasa.gov/api/country/
                    // Butuh API key, kita coba dengan dummy + proxy
                    const proxy = 'https://corsproxy.io/?';
                    const url =
                        'https://firms.modaps.eosdis.nasa.gov/api/country/csv/7daea73d6a1e3eba1f1089e3018b1c0e/VIIRS_NOAA20_NRT/IDN/1';
                    const resp = await fetch(proxy + encodeURIComponent(url));
                    if (resp.ok) {
                        const text = await resp.text();
                        const lines = text.split('\n').filter(line => line.trim() !== '');
                        if (lines.length > 1) {
                            // parse csv header
                            const header = lines[0].split(',');
                            const latIdx = header.indexOf('latitude');
                            const lngIdx = header.indexOf('longitude');
                            const dateIdx = header.indexOf('acq_date');
                            const timeIdx = header.indexOf('acq_time');
                            const confIdx = header.indexOf('confidence');
                            let count = 0;
                            for (let i = 1; i < lines.length && i < 100; i++) {
                                const cols = lines[i].split(',');
                                const lat = parseFloat(cols[latIdx]);
                                const lng = parseFloat(cols[lngIdx]);
                                if (isNaN(lat) || isNaN(lng)) continue;
                                const date = cols[dateIdx] || '';
                                const time = cols[timeIdx] || '';
                                const conf = cols[confIdx] || '';
                                const timestamp = date ? new Date(date).toISOString() : new Date().toISOString();
                                combined.push({
                                    title: `Hotspot ${conf} confidence`,
                                    location: `${lat.toFixed(4)}, ${lng.toFixed(4)}`,
                                    province: '',
                                    lat: lat,
                                    lng: lng,
                                    timestamp: timestamp,

                                });
                                count++;
                            }

                    } else {

                } catch (e) {

                    }
                }

                if (combined.length === 0) {
                    logMessage('⚠️ Tidak ada data dari semua sumber. Coba periksa koneksi atau API key.', 'err');

                // update state
                allEvents = combined;
                updateMap(allEvents);
                updateTimestamp();

                // render current tab
                if (currentTab === 'list') {
                    renderList(allEvents);
                } else {
                    renderStats(allEvents);

            }

            // ---------- init ----------
            function init() {
                // tab switching
                document.querySelectorAll('.sidebar-tabs button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        switchTab(this.dataset.tab);
                    });
                });

                // refresh button
                refreshBtn.addEventListener('click', function() {
                    fetchAllData();
                });

                // auto refresh setiap 60 detik
                setInterval(() => {
                    fetchAllData();
                }, 60000);

                // first load
                fetchAllData();
            }

            // jalankan setelah DOM ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
