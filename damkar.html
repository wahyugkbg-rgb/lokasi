<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔥 Dashboard Pemantauan Kebakaran Nasional - Real Time</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <style>
        /* ===== SAME STYLE (tidak diubah banyak) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1a1f2b, #0f131c);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e25822;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 span {
            color: #e25822;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1e2635;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #2d3748;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
        .last-update {
            color: #94a3b8;
        }
        .btn-refresh {
            background: #e25822;
            border: none;
            color: #fff;
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-refresh:hover {
            background: #c94a1a;
        }
        .btn-refresh:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .map-container {
            flex: 1;
            position: relative;
            background: #141a24;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #141a24;
        }
        .sidebar {
            width: 400px;
            min-width: 320px;
            max-width: 45vw;
            background: #11161f;
            border-left: 1px solid #25303f;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-tabs {
            display: flex;
            background: #0d121b;
            border-bottom: 1px solid #25303f;
            flex-shrink: 0;
        }
        .sidebar-tabs button {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .sidebar-tabs button.active {
            color: #e8edf5;
            border-bottom-color: #e25822;
            background: #1a212e;
        }
        .sidebar-tabs button:hover {
            background: #1a212e;
            color: #e8edf5;
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
        }
        .sidebar-content::-webkit-scrollbar {
            width: 5px;
        }
        .sidebar-content::-webkit-scrollbar-track {
            background: #0d121b;
        }
        .sidebar-content::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 10px;
        }
        .event-item {
            background: #1a212e;
            border-left: 4px solid #e25822;
            border-radius: 4px;
            padding: 12px 14px;
            margin-bottom: 10px;
            transition: background 0.15s;
            cursor: default;
        }
        .event-item:hover {
            background: #212b3c;
        }
        .event-item .title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #f1f5f9;
        }
        .event-item .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }
        .event-item .meta .loc {
            color: #60a5fa;
        }
        .event-item .meta .time {
            color: #a78bfa;
        }
        .event-item .meta .source {
            color: #34d399;
        }
        .event-item .desc {
            font-size: 13px;
            color: #cbd5e1;
            margin-top: 6px;
            line-height: 1.4;
        }
        /* Badge provinsi yang lebih menonjol */
        .event-item .badge-provinsi {
            display: inline-block;
            background: #e25822;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-right: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }
        .empty-state .emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }
        .log-container {
            background: #0d121b;
            border-top: 1px solid #1e2635;
            max-height: 120px;
            overflow-y: auto;
            padding: 6px 14px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .log-container::-webkit-scrollbar {
            width: 4px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 10px;
        }
        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #161e2b;
        }
        .log-entry .log-time {
            color: #64748b;
            margin-right: 12px;
        }
        .log-entry .log-ok {
            color: #4ade80;
        }
        .log-entry .log-err {
            color: #f87171;
        }
        .log-entry .log-info {
            color: #60a5fa;
        }
        @media (max-width: 820px) {
            .sidebar {
                width: 100%;
                min-width: unset;
                max-width: 100%;
                border-left: none;
                border-top: 1px solid #25303f;
                max-height: 45vh;
            }
            .main {
                flex-direction: column-reverse;
            }
            .header h1 {
                font-size: 16px;
            }
            .header-right {
                font-size: 12px;
            }
        }
        @media (max-width: 480px) {
            .header {
                padding: 8px 12px;
            }
            .header h1 {
                font-size: 14px;
            }
            .btn-refresh {
                padding: 4px 12px;
                font-size: 11px;
            }
            .sidebar-content {
                padding: 8px 10px;
            }
            .event-item {
                padding: 10px 12px;
            }
        }
        .leaflet-control-attribution {
            background: rgba(11, 14, 20, 0.85) !important;
            color: #94a3b8 !important;
            font-size: 10px !important;
        }
        .leaflet-popup-content {
            color: #0b0e14;
            font-size: 13px;
        }
        .leaflet-popup-content strong {
            color: #b91c1c;
        }
        .leaflet-popup-content .provinsi-popup {
            font-weight: 700;
            color: #1a56db;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>🔥 <span>Pantau</span> Kebakaran Nasional</h1>
        <div class="header-right">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText">Aktif</span>
            </div>
            <span class="last-update" id="lastUpdateLabel">⏱️ --:--:--</span>
            <button class="btn-refresh" id="refreshBtn">⟳ Refresh</button>
        </div>
    </header>

    <div class="main">
        <div class="map-container">
            <div id="map"></div>
        </div>
        <div class="sidebar">
            <div class="sidebar-tabs">
                <button class="active" data-tab="list">📋 Daftar Kejadian</button>
                <button data-tab="stats">📊 Statistik</button>
            </div>
            <div class="sidebar-content" id="sidebarContent"></div>
        </div>
    </div>

    <div class="log-container" id="logContainer">
        <div class="log-entry"><span class="log-time">[INIT]</span> <span class="log-info">Dashboard siap. Mengambil data dari berbagai sumber online...</span></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const mapElement = document.getElementById('map');
            const sidebarContent = document.getElementById('sidebarContent');
            const logContainer = document.getElementById('logContainer');
            const statusText = document.getElementById('statusText');
            const lastUpdateLabel = document.getElementById('lastUpdateLabel');
            const refreshBtn = document.getElementById('refreshBtn');

            // ---------- Leaflet map ----------
            const map = L.map(mapElement, {
                center: [-2.5, 118.0],
                zoom: 5,
                zoomControl: true,
                fadeAnimation: true,
                attributionControl: true
            });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
                subdomains: 'abcd',
                maxZoom: 19,
                minZoom: 3
            }).addTo(map);
            const markerGroup = L.layerGroup().addTo(map);

            // ---------- state ----------
            let allEvents = [];
            let currentTab = 'list';
            let isRefreshing = false;
            const provinceCache = new Map();

            // ---------- helpers ----------
            function logMessage(msg, type = 'info') {
                const time = new Date().toLocaleTimeString('id-ID');
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                let cls = 'log-info';
                if (type === 'ok') cls = 'log-ok';
                else if (type === 'err') cls = 'log-err';
                entry.innerHTML =
                    `<span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span>`;
                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
                while (logContainer.children.length > 80) logContainer.removeChild(logContainer.firstChild);
            }

            function setStatus(online, msg) {
                const dot = document.querySelector('.status-dot');
                if (online) { dot.style.background = '#4ade80';
                    statusText.textContent = msg || 'Aktif'; } else { dot.style.background = '#f87171';
                    statusText.textContent = msg || 'Gangguan'; }
            }

            function updateTimestamp() {
                lastUpdateLabel.textContent = '⏱️ ' + new Date().toLocaleTimeString('id-ID');
            }

            function escHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ---------- Reverse geocoding ----------
            async function getProvinceFromCoords(lat, lng) {
                const key = `${lat},${lng}`;
                if (provinceCache.has(key)) return provinceCache.get(key);
                try {
                    const url =
                        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=5&accept-language=id`;
                    const proxy = 'https://corsproxy.io/?';
                    const resp = await fetchWithTimeout(proxy + encodeURIComponent(url), {}, 8000, 1);
                    if (resp.ok) {
                        const data = await resp.json();
                        const address = data.address || {};
                        const prov = address.state || address.province || address.region || '';
                        if (prov) {
                            provinceCache.set(key, prov);
                            return prov;
                        }
                    }
                } catch (e) { /* ignore */ }
                provinceCache.set(key, '');
                return '';
            }

            // ---------- Utility: fetch with timeout and retry ----------
            async function fetchWithTimeout(url, options = {}, timeout = 15000, retries = 2) {
                let lastError;
                for (let attempt = 0; attempt <= retries; attempt++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), timeout);
                        const response = await fetch(url, { ...options, signal: controller.signal });
                        clearTimeout(timeoutId);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response;
                    } catch (err) {
                        lastError = err;
                        if (attempt < retries) {
                            await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
                        }
                    }
                }
                throw lastError;
            }

            const PROXIES = [
                'https://corsproxy.io/?',
                'https://api.allorigins.win/raw?url=',
                'https://thingproxy.freeboard.io/fetch/',
                'https://cors-anywhere.herokuapp.com/'
            ];

            async function fetchWithProxy(url, options = {}) {
                for (const proxy of PROXIES) {
                    try {
                        const proxiedUrl = proxy + encodeURIComponent(url);
                        const resp = await fetchWithTimeout(proxiedUrl, options, 12000, 1);
                        if (resp.ok) return resp;
                    } catch (e) { /* continue */ }
                }
                return await fetchWithTimeout(url, options, 10000, 1);
            }

            // ---------- RENDER FUNGSI (dengan provinsi grafis & deskripsi maksimal) ----------
            function renderList(events) {
                if (!events || events.length === 0) {
                    sidebarContent.innerHTML =
                        `<div class="empty-state"><span class="emoji">🔍</span><p>Belum ada data kebakaran yang terpantau dari sumber online.</p><p style="font-size:12px;margin-top:6px;">Coba refresh atau periksa koneksi.</p></div>`;
                    return;
                }
                const sorted = [...events].sort((a, b) => (b.timestamp ? new Date(b.timestamp).getTime() : 0) - (a
                    .timestamp ? new Date(a.timestamp).getTime() : 0));
                let html = '';
                for (const ev of sorted) {
                    // Buat deskripsi maksimal dari semua field yang ada
                    let descParts = [];
                    if (ev.description) descParts.push(ev.description);
                    if (ev.detail) descParts.push(ev.detail);
                    if (ev.confidence) descParts.push(`Confidence: ${ev.confidence}`);
                    if (ev.kecamatan) descParts.push(`Kecamatan: ${ev.kecamatan}`);
                    if (ev.kabupaten) descParts.push(`Kabupaten: ${ev.kabupaten}`);
                    if (ev.province && !descParts.some(p => p.includes(ev.province))) {
                        descParts.push(`Provinsi: ${ev.province}`);
                    }
                    const fullDesc = descParts.join(' | ');

                    html += `
                        <div class="event-item">
                            <div class="title">${escHtml(ev.title || 'Kejadian kebakaran')}</div>
                            <div class="meta">
                                <span class="loc">📍 ${escHtml(ev.location || 'Lokasi tidak diketahui')}</span>
                                ${ev.province ? `<span class="badge-provinsi">${escHtml(ev.province)}</span>` : ''}
                                <span class="time">🕒 ${ev.timestamp ? new Date(ev.timestamp).toLocaleString('id-ID') : '--'}</span>
                                <span class="source">📡 ${escHtml(ev.source || 'tidak diketahui')}</span>
                            </div>
                            ${fullDesc ? `<div class="desc">${escHtml(fullDesc)}</div>` : ''}
                        </div>
                    `;
                }
                sidebarContent.innerHTML = html;
            }

            function renderStats(events) {
                if (!events || events.length === 0) {
                    sidebarContent.innerHTML =
                        `<div class="empty-state"><span class="emoji">📊</span><p>Belum ada data untuk ditampilkan.</p></div>`;
                    return;
                }
                const provCount = {};
                let total = 0;
                let unknown = 0;
                for (const ev of events) {
                    total++;
                    let p = ev.province ? ev.province.trim() : '';
                    if (!p) p = 'Tidak diketahui';
                    if (p === 'Tidak diketahui') unknown++;
                    provCount[p] = (provCount[p] || 0) + 1;
                }
                const sortedProv = Object.entries(provCount).sort((a, b) => b[1] - a[1]);

                let html = `
                    <div style="margin-bottom:16px;">
                        <div style="font-size:20px;font-weight:700;color:#f1f5f9;">${total}</div>
                        <div style="color:#94a3b8;font-size:13px;">Total kejadian terpantau</div>
                        ${unknown > 0 ? `<div style="color:#facc15;font-size:12px;margin-top:4px;">⚠️ ${unknown} data tanpa provinsi (dikategorikan "Tidak diketahui")</div>` : ''}
                    </div>
                    <div style="font-weight:600;margin-bottom:10px;font-size:14px;">📍 Berdasarkan Provinsi</div>
                `;
                for (const [prov, count] of sortedProv) {
                    const pct = Math.round((count / total) * 100);
                    html += `
                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
                            <span style="width:120px;font-size:13px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escHtml(prov)}">${escHtml(prov)}</span>
                            <div style="flex:1;background:#1e2635;height:8px;border-radius:4px;overflow:hidden;">
                                <div style="background:#e25822;height:100%;width:${pct}%;border-radius:4px;"></div>
                            </div>
                            <span style="font-size:13px;color:#94a3b8;min-width:36px;text-align:right;">${count}</span>
                        </div>
                    `;
                }
                const srcCount = {};
                for (const ev of events) {
                    const s = ev.source || 'tidak diketahui';
                    srcCount[s] = (srcCount[s] || 0) + 1;
                }
                const sortedSrc = Object.entries(srcCount).sort((a, b) => b[1] - a[1]);
                html += `<div style="font-weight:600;margin:18px 0 10px;font-size:14px;">📡 Sumber Data</div>`;
                for (const [src, count] of sortedSrc) {
                    html += `
                        <div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0;border-bottom:1px solid #1a212e;">
                            <span style="color:#cbd5e1;">${escHtml(src)}</span>
                            <span style="color:#94a3b8;">${count}</span>
                        </div>
                    `;
                }
                sidebarContent.innerHTML = html;
            }

            function updateMap(events) {
                markerGroup.clearLayers();
                if (!events || events.length === 0) return;
                for (const ev of events) {
                    if (!ev.lat || !ev.lng) continue;
                    const lat = parseFloat(ev.lat);
                    const lng = parseFloat(ev.lng);
                    if (isNaN(lat) || isNaN(lng)) continue;
                    // Popup dengan provinsi yang jelas
                    const popupContent = `
                        <strong>${escHtml(ev.title || 'Kebakaran')}</strong><br>
                        📍 ${escHtml(ev.location || '')}<br>
                        ${ev.province ? `<span class="provinsi-popup">🏛️ ${escHtml(ev.province)}</span><br>` : ''}
                        🕒 ${ev.timestamp ? new Date(ev.timestamp).toLocaleString('id-ID') : '--'}<br>
                        📡 ${escHtml(ev.source || '')}
                        ${ev.description ? `<br><span style="font-size:12px;">${escHtml(ev.description)}</span>` : ''}
                    `;
                    const marker = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: '#e25822',
                        color: '#facc15',
                        weight: 2,
                        opacity: 0.9,
                        fillOpacity: 0.75,
                    }).bindPopup(popupContent);
                    markerGroup.addLayer(marker);
                }
            }

            function switchTab(tab) {
                currentTab = tab;
                document.querySelectorAll('.sidebar-tabs button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tab);
                });
                if (tab === 'list') renderList(allEvents);
                else renderStats(allEvents);
            }

            // ---------- FETCH DATA (tetap agresif, tanpa hardcoded) ----------
            async function fetchAllData() {
                if (isRefreshing) return;
                isRefreshing = true;
                refreshBtn.disabled = true;
                setStatus(true, 'Mengambil data...');
                logMessage('🔄 Memulai pengambilan data dari berbagai sumber online...', 'info');

                const combined = [];
                const errors = [];

                // 1. BNPB Karhutla
                try {
                    logMessage('📡 BNPB Karhutla...', 'info');
                    const url =
                        'https://data.bnpb.go.id/ne/api/3/action/datastore_search?resource_id=353da3aa-9ada-42aa-a5c2-e653d52ffd9c&limit=200';
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.success && json.result && json.result.records) {
                            const records = json.result.records;
                            logMessage(`✅ BNPB Karhutla: ${records.length} record.`, 'ok');
                            for (const rec of records) {
                                const kab = rec['Nama Kabupaten/Kota'] || '';
                                const prov = rec['Provinsi'] || '';
                                const lat = rec['Latitude'];
                                const lng = rec['Longitude'];
                                const fire = rec['KEBAKARAN HUTAN DAN LAHAN'];
                                if (fire && fire !== '0' && fire !== '-' && fire !== '') {
                                    combined.push({
                                        title: `Karhutla - ${kab}`,
                                        location: kab || 'Indonesia',
                                        province: prov,
                                        lat: lat,
                                        lng: lng,
                                        timestamp: new Date().toISOString(),
                                        source: 'BNPB Open Data',
                                        description: `Data BNPB: ${fire}`,
                                        detail: `Kabupaten: ${kab} | Provinsi: ${prov} | Luas: ${fire}`
                                    });
                                }
                            }
                        } else {
                            logMessage('⚠️ BNPB Karhutla: tidak ada records.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ BNPB Karhutla: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ BNPB Karhutla error: ${e.message}`, 'err');
                    errors.push('BNPB-Karhutla');
                }

                // 2. BMKG Hotspot
                try {
                    logMessage('📡 BMKG Hotspot...', 'info');
                    const url = 'https://data.bmkg.go.id/DataMKG/MEWS/hotspot/hotspot.json';
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.data && Array.isArray(json.data)) {
                            logMessage(`✅ BMKG Hotspot: ${json.data.length} titik.`, 'ok');
                            for (const item of json.data) {
                                const lat = parseFloat(item.lat);
                                const lng = parseFloat(item.lon);
                                if (isNaN(lat) || isNaN(lng)) continue;
                                const prov = item.provinsi || '';
                                combined.push({
                                    title: `Hotspot (BMKG) - ${item.kecamatan || ''}`,
                                    location: `${item.kabupaten || ''}, ${item.provinsi || ''}`,
                                    province: prov,
                                    lat: lat,
                                    lng: lng,
                                    timestamp: item.tanggal ? new Date(item.tanggal).toISOString() : new Date()
                                        .toISOString(),
                                    source: 'BMKG Hotspot',
                                    description: `Confidence: ${item.confidence || '-'} | Kecamatan: ${item.kecamatan || ''}`,
                                    detail: `Kabupaten: ${item.kabupaten || ''} | Provinsi: ${item.provinsi || ''} | Confidence: ${item.confidence || '-'}`,
                                    confidence: item.confidence,
                                    kecamatan: item.kecamatan,
                                    kabupaten: item.kabupaten
                                });
                            }
                        } else {
                            logMessage('⚠️ BMKG Hotspot: data tidak sesuai format.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ BMKG Hotspot: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ BMKG Hotspot error: ${e.message}`, 'err');
                    errors.push('BMKG');
                }

                // 3. NASA FIRMS (MODIS)
                try {
                    logMessage('📡 NASA FIRMS (MODIS)...', 'info');
                    const url =
                        'https://firms.modaps.eosdis.nasa.gov/api/country/csv/7daea73d6a1e3eba1f1089e3018b1c0e/MODIS_NRT/IDN/1';
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'text/csv' } });
                    if (resp.ok) {
                        const text = await resp.text();
                        const lines = text.split('\n').filter(line => line.trim() !== '');
                        if (lines.length > 1) {
                            const header = lines[0].split(',');
                            const latIdx = header.indexOf('latitude');
                            const lngIdx = header.indexOf('longitude');
                            const dateIdx = header.indexOf('acq_date');
                            const timeIdx = header.indexOf('acq_time');
                            const confIdx = header.indexOf('confidence');
                            let count = 0;
                            for (let i = 1; i < lines.length && i < 150; i++) {
                                const cols = lines[i].split(',');
                                const lat = parseFloat(cols[latIdx]);
                                const lng = parseFloat(cols[lngIdx]);
                                if (isNaN(lat) || isNaN(lng)) continue;
                                const date = cols[dateIdx] || '';
                                const time = cols[timeIdx] || '';
                                const conf = cols[confIdx] || '';
                                const timestamp = date ? new Date(date).toISOString() : new Date().toISOString();
                                let prov = '';
                                try { prov = await getProvinceFromCoords(lat, lng); } catch (e) { /* ignore */ }
                                combined.push({
                                    title: `Hotspot (NASA MODIS) - ${conf} confidence`,
                                    location: `${lat.toFixed(4)}, ${lng.toFixed(4)}`,
                                    province: prov,
                                    lat: lat,
                                    lng: lng,
                                    timestamp: timestamp,
                                    source: 'NASA FIRMS (MODIS)',
                                    description: `Confidence: ${conf} | Waktu: ${time} | Tanggal: ${date}`,
                                    detail: `Lat: ${lat} | Lng: ${lng} | Confidence: ${conf}`,
                                    confidence: conf
                                });
                                count++;
                            }
                            logMessage(`✅ NASA FIRMS: ${count} hotspot.`, 'ok');
                        } else {
                            logMessage('⚠️ NASA FIRMS: data kosong.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ NASA FIRMS: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ NASA FIRMS error: ${e.message}`, 'err');
                    errors.push('NASA-FIRMS');
                }

                // 4. Global Forest Watch (GLAD)
                try {
                    logMessage('📡 Global Forest Watch (GLAD)...', 'info');
                    const url = 'https://api.globalforestwatch.org/v1/glad-alerts/latest?limit=100';
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.data && Array.isArray(json.data)) {
                            logMessage(`✅ GFW: ${json.data.length} alert.`, 'ok');
                            for (const item of json.data) {
                                const lat = parseFloat(item.latitude);
                                const lng = parseFloat(item.longitude);
                                if (isNaN(lat) || isNaN(lng)) continue;
                                let prov = '';
                                try { prov = await getProvinceFromCoords(lat, lng); } catch (e) { /* ignore */ }
                                combined.push({
                                    title: `GLAD Alert (GFW) - ${item.confidence || ''}`,
                                    location: `${lat.toFixed(4)}, ${lng.toFixed(4)}`,
                                    province: prov,
                                    lat: lat,
                                    lng: lng,
                                    timestamp: item.alert_date ? new Date(item.alert_date).toISOString() : new Date()
                                        .toISOString(),
                                    source: 'Global Forest Watch',
                                    description: `Confidence: ${item.confidence || '-'}`,
                                    detail: `Lat: ${lat} | Lng: ${lng} | Confidence: ${item.confidence || '-'}`,
                                    confidence: item.confidence
                                });
                            }
                        } else {
                            logMessage('⚠️ GFW: data tidak sesuai format.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ GFW: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ GFW error: ${e.message}`, 'err');
                    errors.push('GFW');
                }

                // 5. BNPB Data Kejadian
                try {
                    logMessage('📡 BNPB Data Kejadian...', 'info');
                    const url =
                        'https://data.bnpb.go.id/ne/api/3/action/datastore_search?resource_id=3c76f12f-30e6-465c-b7e7-81b13a5f2950&limit=100';
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.success && json.result && json.result.records) {
                            const records = json.result.records;
                            logMessage(`✅ BNPB Kejadian: ${records.length} record.`, 'ok');
                            for (const rec of records) {
                                const jenis = rec['Jenis Bencana'] || '';
                                if (jenis.toLowerCase().includes('kebakaran') || jenis.toLowerCase().includes('karhutla')) {
                                    const kab = rec['Kabupaten/Kota'] || '';
                                    const prov = rec['Provinsi'] || '';
                                    const lat = rec['Latitude'];
                                    const lng = rec['Longitude'];
                                    if (lat && lng) {
                                        combined.push({
                                            title: `Kejadian: ${jenis}`,
                                            location: kab || 'Indonesia',
                                            province: prov,
                                            lat: lat,
                                            lng: lng,
                                            timestamp: rec['Tanggal'] || new Date().toISOString(),
                                            source: 'BNPB Data Kejadian',
                                            description: `Keterangan: ${rec['Keterangan'] || ''}`,
                                            detail: `Kabupaten: ${kab} | Provinsi: ${prov} | Tanggal: ${rec['Tanggal'] || ''}`
                                        });
                                    }
                                }
                            }
                        } else {
                            logMessage('⚠️ BNPB Kejadian: tidak ada records.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ BNPB Kejadian: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ BNPB Kejadian error: ${e.message}`, 'err');
                    errors.push('BNPB-Kejadian');
                }

                // ---------- Deduplikasi ----------
                const unique = [];
                const seen = new Set();
                for (const ev of combined) {
                    if (!ev.province) ev.province = '';
                    const key = `${ev.lat},${ev.lng},${ev.timestamp}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(ev);
                    }
                }

                if (unique.length === 0) {
                    logMessage('⚠️ Tidak ada data dari semua sumber.', 'err');
                    setStatus(false, 'Tidak ada data');
                } else {
                    logMessage(`✅ Total ${unique.length} kejadian berhasil dikumpulkan.`, 'ok');
                    setStatus(true, `${unique.length} kejadian`);
                }

                allEvents = unique;
                updateMap(allEvents);
                updateTimestamp();
                if (currentTab === 'list') renderList(allEvents);
                else renderStats(allEvents);

                isRefreshing = false;
                refreshBtn.disabled = false;
            }

            // ---------- init ----------
            function init() {
                document.querySelectorAll('.sidebar-tabs button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        switchTab(this.dataset.tab);
                    });
                });
                refreshBtn.addEventListener('click', function() {
                    fetchAllData();
                });
                setInterval(fetchAllData, 60000);
                fetchAllData();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
