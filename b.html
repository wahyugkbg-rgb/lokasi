<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Live Data Bencana BNPB - One Data API</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f4f7; }
        h2 { margin-top: 0; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; }
        button:hover { background: #c0392b; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 10px 12px; text-align: left; font-size: 14px; }
        th { background: #2c3e50; color: white; }
        #status { color: green; font-weight: bold; }
        #lastUpdate { font-weight: bold; }
    </style>
</head>
<body>
    <div class="info-bar">
        <h2>🌊 Data Bencana Indonesia (Live dari BNPB One Data)</h2>
        <button onclick="fetchData()">🔄 Refresh Manual</button>
    </div>
    <p>
        <strong>Total Kejadian:</strong> <span id="total">0</span> | 
        <strong>Update Terakhir:</strong> <span id="lastUpdate">-</span> | 
        <span id="status">Memuat data...</span>
    </p>
    <table id="tabelBencana">
        <thead><tr id="headerRow"></tr></thead>
        <tbody id="dataBody"></tbody>
    </table>

    <script>
        // API terbuka BNPB – ganti dengan endpoint yang sesuai jika berbeda
        const API_URL = "https://onedata.bnpb.go.id/api/v1/bencana";

        // Proxy CORS sebagai fallback (biasanya API BNPB tidak butuh ini)
        const CORS_PROXIES = [
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];

        async function fetchData() {
            const statusEl = document.getElementById("status");
            statusEl.textContent = "Mengambil data...";

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 30000);

            try {
                let json;
                // Coba fetch langsung (umumnya berhasil)
                try {
                    const resp = await fetch(API_URL, { signal: controller.signal, mode: 'cors' });
                    if (resp.ok) json = await resp.json();
                    else throw new Error("Direct failed");
                } catch (e) {
                    // Fallback proxy
                    for (let proxy of CORS_PROXIES) {
                        try {
                            const resp = await fetch(proxy(API_URL), { signal: controller.signal });
                            if (resp.ok) { json = await resp.json(); break; }
                        } catch (_) {}
                    }
                    if (!json) throw new Error("Gagal mengambil data (semua metode).");
                }

                clearTimeout(timeout);
                renderData(json);
            } catch (err) {
                clearTimeout(timeout);
                statusEl.textContent = `Error: ${err.message}`;
                console.error(err);
            }
        }

        function renderData(json) {
            // Struktur API BNPB One Data biasanya berupa array langsung, atau { data: [...] }
            let records = [];
            if (Array.isArray(json)) {
                records = json;
            } else if (json.data && Array.isArray(json.data)) {
                records = json.data;
            } else if (json.result && Array.isArray(json.result)) {
                records = json.result;
            } else {
                // Coba ambil array pertama yang ditemukan
                const arrayKey = Object.keys(json).find(k => Array.isArray(json[k]));
                if (arrayKey) records = json[arrayKey];
                else records = [json]; // fallback
            }

            const head = document.getElementById("headerRow");
            const body = document.getElementById("dataBody");
            head.innerHTML = "";
            body.innerHTML = "";

            if (!records.length) {
                document.getElementById("status").textContent = "Tidak ada data.";
                document.getElementById("total").textContent = 0;
                return;
            }

            // Ambil kolom dari record pertama
            const cols = Object.keys(records[0]);
            cols.forEach(col => {
                const th = document.createElement("th");
                th.textContent = col;
                head.appendChild(th);
            });

            records.forEach(row => {
                const tr = document.createElement("tr");
                cols.forEach(col => {
                    const td = document.createElement("td");
                    let val = row[col];
                    if (val !== null && typeof val === 'object') val = JSON.stringify(val);
                    td.textContent = val ?? "";
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });

            document.getElementById("total").textContent = records.length;
            document.getElementById("lastUpdate").textContent = new Date().toLocaleTimeString("id-ID");
            document.getElementById("status").textContent = `Berhasil memuat ${records.length} kejadian bencana.`;
        }

        // Jalankan saat halaman dibuka, lalu setiap 5 menit
        window.onload = () => {
            fetchData();
            setInterval(fetchData, 300000);
        };
    </script>
</body>
</html>
