<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔥 Dashboard Pemantauan Kebakaran Nasional - Real Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-body-1: #fff9ef;
            --bg-body-2: #fef3e0;
            --surface: #ffffff;
            --surface-alt: #fff8ec;
            --border: #ecdfc3;
            --border-soft: #f4ead2;
            --ink: #241c10;
            --ink-soft: #5b5240;
            --ink-muted: #8a806c;
            --gold: #b4720f;
            --gold-light: #e8a53b;
            --gold-deep: #8a560a;
            --fire: #d6421f;
            --fire-2: #f2761f;
            --success: #17874a;
            --success-bg: #e8f8ef;
            --danger: #c22626;
            --danger-bg: #fdecec;
            --info: #1d5fbf;
            --info-bg: #eaf2fd;
            --shadow-sm: 0 1px 3px rgba(120, 72, 8, 0.08);
            --shadow-md: 0 6px 20px rgba(120, 72, 8, 0.10);
            --shadow-lg: 0 14px 38px rgba(120, 72, 8, 0.16);
            --radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, var(--bg-body-1) 0%, var(--bg-body-2) 45%, #fff 100%);
            color: var(--ink);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: appFadeIn 0.5s ease both;
        }
        @keyframes appFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        ::selection { background: var(--gold-light); color: #241c10; }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(120deg, #2a1608 0%, #4a2210 35%, #7a3510 70%, #a8480f 100%);
            background-size: 220% 220%;
            animation: headerShimmer 12s ease infinite;
            padding: 14px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold-light);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 20;
        }
        @keyframes headerShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff8ec;
        }
        .header h1 .flame {
            display: inline-block;
            animation: flameFlicker 2.4s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 160, 60, 0.8));
        }
        @keyframes flameFlicker {
            0%, 100% { transform: scale(1) rotate(-2deg); }
            25% { transform: scale(1.08) rotate(2deg); }
            50% { transform: scale(0.96) rotate(-1deg); }
            75% { transform: scale(1.05) rotate(1deg); }
        }
        .header h1 span.brand {
            background: linear-gradient(90deg, #ffd489, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 13px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(6px);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff3e0;
            font-weight: 600;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        .last-update { color: #f1dcbf; font-weight: 500; }
        .btn-refresh {
            background: linear-gradient(120deg, var(--fire-2), var(--gold));
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 12px rgba(180, 80, 10, 0.35);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }
        .btn-refresh:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(180, 80, 10, 0.45);
            filter: brightness(1.06);
        }
        .btn-refresh:active:not(:disabled) { transform: translateY(0); }
        .btn-refresh:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-refresh.spinning::before {
            content: '⟳ ';
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ===== LIMIT CONTROL (jumlah kejadian, editable / ALL) ===== */
        .limit-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(6px);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .limit-label { color: #f1dcbf; font-weight: 600; font-size: 12px; }
        .limit-control input[type="number"] {
            width: 62px;
            background: rgba(255, 255, 255, 0.92);
            border: none;
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--ink);
            font-family: 'Inter', sans-serif;
        }
        .limit-control input[type="number"]:disabled { opacity: 0.5; }
        .limit-control button#limitAllBtn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff3e0;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.4px;
            padding: 4px 9px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .limit-control button#limitAllBtn:hover { background: rgba(255, 255, 255, 0.15); }
        .limit-control button#limitAllBtn.active {
            background: linear-gradient(120deg, var(--fire-2), var(--gold));
            border-color: transparent;
            color: #fff;
        }

        /* ===== MAP LEGEND (sumber data) ===== */
        .map-legend {
            background: rgba(255, 251, 240, 0.95);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            box-shadow: var(--shadow-md);
            font-size: 11.5px;
            color: var(--ink-soft);
            line-height: 1.7;
            max-width: 220px;
        }
        .map-legend-title {
            font-weight: 800;
            font-size: 12px;
            color: var(--ink);
            margin-bottom: 4px;
            font-family: 'Poppins', sans-serif;
        }
        .map-legend-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .map-legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1.5px solid #fff;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        /* ===== MAIN LAYOUT ===== */
        .main { display: flex; flex: 1; min-height: 0; }
        .map-container { flex: 1; position: relative; background: var(--surface-alt); }
        #map { width: 100%; height: 100%; background: var(--surface-alt); }
        .map-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            box-shadow: inset 0 0 40px rgba(120, 72, 8, 0.08);
            z-index: 5;
        }
        .sidebar {
            width: 420px;
            min-width: 340px;
            max-width: 45vw;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: -8px 0 24px rgba(120, 72, 8, 0.06);
        }
        .sidebar-tabs {
            display: flex;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-tabs button {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--ink-muted);
            padding: 12px 6px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .sidebar-tabs button.active {
            color: var(--gold-deep);
            border-bottom-color: var(--fire-2);
            background: var(--surface);
        }
        .sidebar-tabs button:hover { background: #fff2da; color: var(--gold-deep); }

        /* ===== FILTER BAR (Provinsi / Kabupaten-Kota) ===== */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .filter-bar select {
            flex: 1;
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-soft);
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }
        .filter-bar select:focus { outline: none; border-color: var(--gold-light); }
        .filter-bar button#filterResetBtn {
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--ink-muted);
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.18s ease;
        }
        .filter-bar button#filterResetBtn:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
        .filter-info {
            padding: 8px 16px 0;
            font-size: 11.5px;
            color: var(--ink-muted);
            font-weight: 600;
            flex-shrink: 0;
        }
        .filter-info.hidden { display: none; }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
        }
        .sidebar-content::-webkit-scrollbar { width: 6px; }
        .sidebar-content::-webkit-scrollbar-track { background: var(--surface-alt); }
        .sidebar-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .sidebar-content::-webkit-scrollbar-thumb:hover { background: var(--gold-light); }

        /* ===== EVENT CARD ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .event-item {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-left: 4px solid var(--fire-2);
            border-radius: 10px;
            padding: 13px 15px;
            margin-bottom: 12px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
            cursor: default;
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.4s ease both;
        }
        .event-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-left-color: var(--gold);
        }
        .event-item .title {
            font-weight: 700;
            font-size: 14.5px;
            margin-bottom: 6px;
            color: var(--ink);
            font-family: 'Poppins', sans-serif;
        }
        .event-item .meta {
            font-size: 12px;
            color: var(--ink-muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .event-item .meta .loc { color: var(--info); font-weight: 600; }
        .event-item .meta .time { color: #7c4fbf; font-weight: 500; }
        .event-item .meta .source {
            color: var(--success);
            font-weight: 600;
            background: var(--success-bg);
            padding: 2px 8px;
            border-radius: 10px;
        }
        .event-item .desc {
            font-size: 12.5px;
            color: var(--ink-soft);
            margin-top: 8px;
            line-height: 1.5;
            background: var(--surface-alt);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-soft);
        }
        .event-item .catatan {
            font-size: 12.5px;
            color: var(--ink-soft);
            margin-top: 8px;
            line-height: 1.5;
        }
        .event-item .catatan b { color: var(--gold-deep); }
        .badge-provinsi {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(120deg, var(--fire), var(--fire-2));
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            box-shadow: 0 2px 6px rgba(214, 66, 31, 0.3);
        }
        .badge-provinsi.estimated {
            background: var(--surface-alt);
            color: var(--ink-soft);
            border: 1.5px dashed var(--gold-light);
            box-shadow: none;
        }
        .badge-kabkota {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--info-bg);
            color: var(--info);
            padding: 3px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-conf {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-unknown {
            display: inline-flex;
            align-items: center;
            font-style: italic;
            color: var(--ink-muted);
            font-size: 11px;
        }
        .empty-state { text-align: center; padding: 46px 20px; color: var(--ink-muted); }
        .empty-state .emoji { font-size: 42px; display: block; margin-bottom: 14px; animation: flameFlicker 2.4s ease-in-out infinite; }
        .empty-state p { font-weight: 500; }

        /* ===== REKAP WILAYAH ===== */
        .rekap-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.4s ease both;
            transition: box-shadow 0.18s ease, transform 0.18s ease;
        }
        .rekap-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
        .rekap-card .rekap-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .rekap-card .rekap-prov {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 14.5px;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rekap-card .rekap-total {
            font-weight: 800;
            font-size: 15px;
            color: #fff;
            background: linear-gradient(120deg, var(--fire), var(--gold));
            padding: 2px 12px;
            border-radius: 14px;
        }
        .rekap-bar-track {
            background: var(--surface-alt);
            height: 9px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--border-soft);
            margin-bottom: 10px;
        }
        .rekap-bar-fill {
            height: 100%;
            border-radius: 5px;
            background: linear-gradient(90deg, var(--gold-light), var(--fire-2));
            width: 0%;
            transition: width 0.9s cubic-bezier(.22,.9,.3,1.4);
        }
        .rekap-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .rekap-chip {
            background: var(--surface-alt);
            border: 1px solid var(--border-soft);
            color: var(--ink-soft);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 8px;
        }
        .rekap-src-row {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--ink-muted);
            padding: 2px 0;
        }
        .rekap-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin: 10px 0 4px;
        }

        /* ===== LOG ===== */
        .log-container {
            background: #221709;
            border-top: 2px solid var(--gold-light);
            max-height: 116px;
            overflow-y: auto;
            padding: 7px 16px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: #d8c9a8;
            flex-shrink: 0;
        }
        .log-container::-webkit-scrollbar { width: 4px; }
        .log-container::-webkit-scrollbar-thumb { background: #4a3210; border-radius: 10px; }
        .log-entry { padding: 2px 0; border-bottom: 1px solid #33240e; animation: fadeInUp 0.25s ease both; }
        .log-entry .log-time { color: #a08757; margin-right: 12px; }
        .log-entry .log-ok { color: #6ee79a; }
        .log-entry .log-err { color: #ff8a7a; }
        .log-entry .log-info { color: #7cb8ff; }

        @media (max-width: 820px) {
            .sidebar { width: 100%; min-width: unset; max-width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 48vh; }
            .main { flex-direction: column-reverse; }
            .header h1 { font-size: 17px; }
            .header-right { font-size: 12px; }
        }
        @media (max-width: 480px) {
            .header { padding: 9px 12px; }
            .header h1 { font-size: 15px; }
            .btn-refresh { padding: 5px 13px; font-size: 11px; }
            .sidebar-content { padding: 9px 10px; }
            .event-item { padding: 11px 12px; }
        }

        .leaflet-control-attribution {
            background: rgba(255, 251, 240, 0.9) !important;
            color: var(--ink-muted) !important;
            font-size: 10px !important;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px !important;
            box-shadow: var(--shadow-lg) !important;
        }
        .leaflet-popup-content {
            color: var(--ink);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            line-height: 1.55;
            min-width: 220px;
        }
        .leaflet-popup-content strong {
            color: var(--fire);
            font-family: 'Poppins', sans-serif;
        }
        .leaflet-popup-content .provinsi-popup {
            font-weight: 700;
            color: var(--gold-deep);
        }
        .leaflet-popup-content .catatan-popup {
            display: block;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            color: var(--ink-soft);
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1><span class="flame">🔥</span> <span class="brand">Pantau</span>&nbsp;Kebakaran Nasional</h1>
        <div class="header-right">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText">Aktif</span>
            </div>
            <span class="last-update" id="lastUpdateLabel">⏱️ --:--:--</span>
            <div class="limit-control" title="Batas jumlah kejadian yang diambil &amp; ditampilkan">
                <span class="limit-label">Jumlah</span>
                <input type="number" id="limitInput" min="10" max="5000" step="10" value="200" disabled />
                <button type="button" id="limitAllBtn" class="active" title="Tampilkan semua data yang tersedia (tanpa batas)">ALL</button>
            </div>
            <button class="btn-refresh" id="refreshBtn">⟳ Refresh</button>
        </div>
    </header>

    <div class="main">
        <div class="map-container">
            <div id="map"></div>
        </div>
        <div class="sidebar">
            <div class="sidebar-tabs">
                <button class="active" data-tab="list">📋 Daftar Kejadian</button>
                <button data-tab="rekap">🗂️ Rekap Wilayah</button>
                <button data-tab="stats">📊 Statistik</button>
            </div>
            <div class="filter-bar">
                <select id="filterProvinsi">
                    <option value="">Semua Provinsi</option>
                </select>
                <select id="filterKabkota">
                    <option value="">Semua Kab/Kota</option>
                </select>
                <button type="button" id="filterResetBtn" title="Hapus filter">✕</button>
            </div>
            <div class="filter-info" id="filterInfo"></div>
            <div class="sidebar-content" id="sidebarContent"></div>
        </div>
    </div>

    <div class="log-container" id="logContainer">
        <div class="log-entry"><span class="log-time">[INIT]</span> <span class="log-info">Dashboard siap. Mengambil data dari berbagai sumber online...</span></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const mapElement = document.getElementById('map');
            const sidebarContent = document.getElementById('sidebarContent');
            const logContainer = document.getElementById('logContainer');
            const statusText = document.getElementById('statusText');
            const lastUpdateLabel = document.getElementById('lastUpdateLabel');
            const refreshBtn = document.getElementById('refreshBtn');
            const limitInput = document.getElementById('limitInput');
            const limitAllBtn = document.getElementById('limitAllBtn');
            const filterProvinsiEl = document.getElementById('filterProvinsi');
            const filterKabkotaEl = document.getElementById('filterKabkota');
            const filterResetBtn = document.getElementById('filterResetBtn');
            const filterInfo = document.getElementById('filterInfo');

            // ---------- Leaflet map (basemap terang & elegan) ----------
            const map = L.map(mapElement, {
                center: [-2.5, 118.0],
                zoom: 5,
                zoomControl: true,
                fadeAnimation: true,
                attributionControl: true
            });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
                subdomains: 'abcd',
                maxZoom: 19,
                minZoom: 3
            }).addTo(map);
            const markerGroup = L.layerGroup().addTo(map);

            // ---------- state ----------
            let allEvents = [];
            let currentTab = 'list';
            let isRefreshing = false;
            let currentLimit = 200;   // dipakai hanya jika ALL dinonaktifkan
            let limitIsAll = true;    // default: tampilkan SEMUA data yang tersedia
            let filterProvinsi = '';  // filter aktif: nama provinsi ('' = semua)
            let filterKabkota = '';   // filter aktif: nama kab/kota ('' = semua)

            // Jumlah yang diminta ke masing-masing API sumber (dibuat cukup besar saat
            // "ALL" aktif agar seluruh data nasional yang tersedia benar-benar diambil).
            function getApiLimit() {
                return limitIsAll ? 5000 : Math.max(50, currentLimit);
            }

            // ---------- Watchdog anti-macet ----------
            // Membungkus sebuah Promise dengan batas waktu keras: jika sumber data tidak
            // merespons dalam waktu `ms`, jangan menunggu terus -> anggap gagal & lanjutkan
            // ke sumber lain, supaya dashboard TIDAK PERNAH terkunci menunggu satu sumber saja.
            function withHardTimeout(promise, ms, label) {
                return new Promise((resolve) => {
                    let done = false;
                    const timer = setTimeout(() => {
                        if (done) return;
                        done = true;
                        logMessage(`⏱️ ${label}: melebihi batas waktu (${Math.round(ms / 1000)}s), dilewati.`, 'err');
                        resolve([]);
                    }, ms);
                    promise.then((val) => {
                        if (done) return;
                        done = true;
                        clearTimeout(timer);
                        resolve(Array.isArray(val) ? val : []);
                    }).catch((e) => {
                        if (done) return;
                        done = true;
                        clearTimeout(timer);
                        logMessage(`❌ ${label}: ${e.message}`, 'err');
                        resolve([]);
                    });
                });
            }

            // ---------- helpers ----------
            function logMessage(msg, type = 'info') {
                const time = new Date().toLocaleTimeString('id-ID');
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                let cls = 'log-info';
                if (type === 'ok') cls = 'log-ok';
                else if (type === 'err') cls = 'log-err';
                entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span>`;
                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
                while (logContainer.children.length > 80) logContainer.removeChild(logContainer.firstChild);
            }

            function setStatus(online, msg) {
                const dot = document.querySelector('.status-dot');
                if (online) { dot.style.background = '#4ade80'; statusText.textContent = msg || 'Aktif'; }
                else { dot.style.background = '#f87171'; statusText.textContent = msg || 'Gangguan'; }
            }

            function updateTimestamp() {
                lastUpdateLabel.textContent = '⏱️ ' + new Date().toLocaleTimeString('id-ID');
            }

            function escHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;

            }

            // ---------- Estimasi Provinsi OFFLINE (bounding box) ----------
            // Menggantikan reverse-geocoding via Nominatim (yang lambat & berurutan per titik)
            // dengan pencarian bounding box instan tanpa koneksi jaringan tambahan.
            // Wilayah kecil/khusus diletakkan lebih dulu agar tidak tertimpa wilayah besar di sekitarnya.
            const PROVINCE_BBOX = [

                { name: 'Sulawesi Tenggara', latMin: -6.20, latMax: -2.80, lngMin: 120.50, lngMax: 124.00 },
                { name: 'Maluku Utara', latMin: -1.00, latMax: 3.50, lngMin: 124.00, lngMax: 129.50 },
                { name: 'Maluku', latMin: -8.50, latMax: -2.00, lngMin: 125.50, lngMax: 135.00 },
                { name: 'Papua Barat', latMin: -4.50, latMax: 0.50, lngMin: 130.00, lngMax: 135.50 },
                { name: 'Papua', latMin: -9.50, latMax: -1.50, lngMin: 134.00, lngMax: 141.50 }
            ];
            function estimateProvinceFromCoords(lat, lng) {
                if (isNaN(lat) || isNaN(lng)) return '';
                for (const p of PROVINCE_BBOX) {
                    if (lat >= p.latMin && lat <= p.latMax && lng >= p.lngMin && lng <= p.lngMax) return p.name;
                }
                return '';
            }

            // ---------- Waktu kejadian: JANGAN PERNAH memakai waktu "sekarang" sebagai ----------
            // pengganti tanggal kejadian asli (itu adalah data semu/menyesatkan). Jika sumber
            // data tidak menyertakan tanggal valid, kembalikan null -> UI akan menyembunyikan
            // badge waktu, bukan menampilkan tanggal palsu.
            function toISOOrNull(v) {
                if (v === undefined || v === null || v === '') return null;
                const d = new Date(v);
                if (isNaN(d.getTime())) return null;
                return d.toISOString();
            }
            // Mencoba menemukan field tanggal apa pun di dalam record mentah (nama field
            // berbeda-beda antar sumber), dipakai untuk sumber yang tidak punya field tanggal
            // yang sudah diketahui pasti (mis. BNPB Karhutla Open Data).
            function findDateField(rec) {
                if (!rec || typeof rec !== 'object') return null;
                const pattern = /tanggal|periode|tgl|date|waktu|created|updated/i;
                for (const [k, v] of Object.entries(rec)) {
                    if (!pattern.test(k)) continue;
                    const iso = toISOOrNull(v);
                    if (iso) return iso;
                }
                return null;
            }
            function sortByRecency(events) {
                return [...events].sort((a, b) => {
                    const ta = a.timestamp ? new Date(a.timestamp).getTime() : -Infinity;
                    const tb = b.timestamp ? new Date(b.timestamp).getTime() : -Infinity;
                    return tb - ta;
                });
            }

            // ---------- Filter: Provinsi / Kabupaten-Kota ----------
            function getFilteredEvents() {
                let out = allEvents;
                if (filterProvinsi) {
                    out = out.filter(ev => (ev.province || '').trim().toUpperCase() === filterProvinsi.toUpperCase());
                }
                if (filterKabkota) {
                    out = out.filter(ev => (ev.kabkota || '').trim().toUpperCase() === filterKabkota.toUpperCase());
                }
                return out;
            }
            function populateFilterOptions() {
                // Provinsi: daftar unik dari seluruh data yang sedang termuat
                const provSet = new Set();
                allEvents.forEach(ev => { if (ev.province && ev.province.trim()) provSet.add(ev.province.trim()); });
                const provList = [...provSet].sort((a, b) => a.localeCompare(b));
                const prevProv = filterProvinsiEl.value;
                filterProvinsiEl.innerHTML = '<option value="">Semua Provinsi</option>' +
                    provList.map(p => `<option value="${escHtml(p)}">${escHtml(p)}</option>`).join('');
                if (provList.includes(prevProv)) filterProvinsiEl.value = prevProv;
                else filterProvinsi = '';

                // Kab/Kota: dibatasi oleh provinsi terpilih (jika ada) supaya pencarian lebih cepat
                const kabSet = new Set();
                allEvents.forEach(ev => {
                    if (!ev.kabkota || !ev.kabkota.trim()) return;
                    if (filterProvinsi && (ev.province || '').trim().toUpperCase() !== filterProvinsi.toUpperCase()) return;
                    kabSet.add(ev.kabkota.trim());
                });
                const kabList = [...kabSet].sort((a, b) => a.localeCompare(b));
                const prevKab = filterKabkotaEl.value;
                filterKabkotaEl.innerHTML = '<option value="">Semua Kab/Kota</option>' +
                    kabList.map(k => `<option value="${escHtml(k)}">${escHtml(k)}</option>`).join('');
                if (kabList.includes(prevKab)) filterKabkotaEl.value = prevKab;
                else filterKabkota = '';
            }
            function updateFilterInfo(filtered) {
                if (!filterProvinsi && !filterKabkota) {
                    filterInfo.classList.add('hidden');
                    filterInfo.textContent = '';
                    return;
                }
                filterInfo.classList.remove('hidden');
                filterInfo.textContent = `🔎 Menampilkan ${filtered.length} dari ${allEvents.length} kejadian` +
                    (filterKabkota ? ` · ${filterKabkota}` : '') +
                    (filterProvinsi ? ` · ${filterProvinsi}` : '');
            }
            function renderCurrentTab() {
                const filtered = getFilteredEvents();
                updateFilterInfo(filtered);
                updateMap(filtered);
                if (currentTab === 'list') renderList(filtered);
                else if (currentTab === 'rekap') renderRekap(filtered);
                else renderStats(filtered);
            }

            // ---------- Gaya visual per sumber data (untuk legend, marker & badge) ----------
            const SOURCE_STYLE = {
                'BNPB Open Data': { color: '#d6421f', icon: '🔥', label: 'Karhutla (BNPB Open Data)' },
                'BNPB Data Kejadian': { color: '#b4720f', icon: '🚨', label: 'Kejadian Bencana (BNPB)' },
                'BMKG Hotspot': { color: '#1d5fbf', icon: '🛰️', label: 'Hotspot Satelit (BMKG)' },
                'NASA FIRMS (MODIS)': { color: '#7c3aed', icon: '🛰️', label: 'Hotspot Satelit (NASA FIRMS)' },
                'Global Forest Watch': { color: '#17874a', icon: '🌳', label: 'GLAD Alert (Global Forest Watch)' }
            };
            function getSourceStyle(source) {
                const s = source || '';
                for (const key in SOURCE_STYLE) {
                    if (s.includes(key)) return SOURCE_STYLE[key];
                }
                return { color: '#8a806c', icon: '❔', label: s || 'Tidak diketahui' };
            }

            // ---------- Format angka kejadian per jenis bencana (tanpa desimal, "-" jika nihil) ----------
            function formatDisasterCount(v) {
                const n = parseFloat(v);
                if (isNaN(n) || n <= 0) return '-';
                return String(Math.round(n));
            }
            const ID_SMALL_WORDS = new Set(['dan', 'atau', 'di', 'ke', 'dari', 'yang', 'untuk', 'pada']);
            function titleCaseID(str) {
                return String(str).toLowerCase().split(' ').map((w, i) => {
                    if (!w) return w;
                    if (i > 0 && ID_SMALL_WORDS.has(w)) return w;
                    return w.charAt(0).toUpperCase() + w.slice(1);
                }).join(' ');
            }
            // Menyusun rincian jenis bencana dari record BNPB (field seperti "KEBAKARAN HUTAN
            // DAN LAHAN", "KEKERINGAN", dst) menjadi daftar {label, value, raw} yang rapi &
            // informatif -> menggantikan tampilan mentah "No / Kode Wilayah / 0.0" yang membingungkan.
            function buildDisasterBreakdown(rec, excludeKeys = []) {
                if (!rec || typeof rec !== 'object') return [];
                const excl = new Set(['no', 'id', '_id', 'latitude', 'longitude', 'lat', 'lng', 'lon']
                    .concat(excludeKeys.map(k => k.toLowerCase())));
                const items = [];
                for (const [k, v] of Object.entries(rec)) {
                    const kl = String(k).toLowerCase().trim();
                    if (excl.has(kl)) continue;
                    if (kl.includes('kode wilayah')) continue;
                    const raw = String(v).trim();
                    if (!/^-?\d+(\.\d+)?$/.test(raw)) continue; // hanya field angka (jenis bencana)
                    const num = Math.round(parseFloat(raw));
                    items.push({ label: titleCaseID(prettifyKey(k)), value: num > 0 ? String(num) : '-', raw: num });
                }
                return items;
            }

            // ---------- Provinsi berdasarkan Kabupaten/Kota (API wilayah-indonesia) ----------
            // Sumber: https://github.com/ihsaninh/wilayah-indonesia (static JSON, hosted di GitHub Pages)
            // Tujuan: provinsi setiap kejadian ditentukan berdasarkan NAMA KABUPATEN/KOTA tempat
            // peristiwa terjadi (bukan hanya field provinsi mentah dari sumber data, yang kadang
            // kosong / tidak konsisten formatnya). Bounding-box (estimateProvinceFromCoords) dan
            // field provinsi mentah dari sumber tetap dipertahankan sebagai CADANGAN jika kab/kota
            // tidak tersedia atau API wilayah gagal dimuat, sehingga aplikasi tidak pernah gagal
            // total hanya karena masalah jaringan pada API tambahan ini.
            const WILAYAH_API_BASE = 'https://ihsaninh.github.io/wilayah-indonesia';
            let regencyProvinceMap = {};
            let regencyMapReady = false;
            let regencyMapPromise = null;

            function normalizeRegencyName(str) {
                if (!str) return '';
                return String(str)
                    .toUpperCase()
                    .replace(/^KABUPATEN\s+ADM\.?\s+/, '')
                    .replace(/^KAB\.?\s+ADM\.?\s+/, '')
                    .replace(/^KOTA\s+ADM\.?\s+/, '')
                    .replace(/^KABUPATEN\s+/, '')
                    .replace(/^KAB\.?\s+/, '')
                    .replace(/^KOTA\s+/, '')
                    .replace(/^ADMINISTRASI\s+/, '')
                    .replace(/[^A-Z\s]/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            async function loadRegencyProvinceMap() {
                if (regencyMapPromise) return regencyMapPromise;
                regencyMapPromise = (async () => {
                    try {
                        logMessage('📡 Memuat basis data wilayah (ihsaninh/wilayah-indonesia)...', 'info');
                        const provResp = await fetchWithProxy(`${WILAYAH_API_BASE}/provinces.json`, { headers: { 'Accept': 'application/json' } });
                        if (!provResp.ok) throw new Error(`HTTP ${provResp.status}`);
                        const provinces = await provResp.json();
                        if (!Array.isArray(provinces) || provinces.length === 0) throw new Error('Format provinces.json tidak sesuai / kosong');

                        const regencyResults = await Promise.allSettled(
                            provinces.map(async (p) => {
                                const pid = p.id;
                                const pname = (p.value || p.name || '').toString().trim();
                                const url = `${WILAYAH_API_BASE}/${pid}/regencies.json`;
                                const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                                const regs = await resp.json();
                                return { pname, regs: Array.isArray(regs) ? regs : [] };
                            })
                        );

                        const newMap = {};
                        let totalRegency = 0;
                        let provinceOk = 0;
                        for (const r of regencyResults) {
                            if (r.status === 'fulfilled') {
                                provinceOk++;
                                const { pname, regs } = r.value;
                                if (!pname) continue;
                                for (const reg of regs) {
                                    const rawName = (reg.value || reg.name || '').toString().trim();
                                    if (!rawName) continue;
                                    const type = (reg.type || '').toString().trim();
                                    const keyBare = normalizeRegencyName(rawName);
                                    const keyWithType = normalizeRegencyName(`${type} ${rawName}`);
                                    if (keyBare) newMap[keyBare] = pname;
                                    if (keyWithType) newMap[keyWithType] = pname;
                                    totalRegency++;
                                }
                            }
                        }

                        if (totalRegency > 0) {
                            regencyProvinceMap = newMap;
                            regencyMapReady = true;
                            logMessage(`✅ Basis data wilayah dimuat: ${provinceOk}/${provinces.length} provinsi, ${totalRegency} kab/kota.`, 'ok');
                        } else {
                            throw new Error('Tidak ada data kab/kota yang berhasil dimuat');
                        }
                    } catch (e) {
                        regencyMapReady = false;
                        logMessage(`⚠️ Gagal memuat API wilayah-indonesia (${e.message}). Provinsi akan memakai data sumber asli / estimasi koordinat sebagai cadangan.`, 'err');
                    }
                })();
                return regencyMapPromise;
            }

            // Cocokkan nama kab/kota dari sumber data (mis. "Kab. Bogor", "KOTA BOGOR", "Bogor")
            // terhadap basis data wilayah, lalu kembalikan nama provinsi resminya.
            function resolveProvinceFromKabkota(kabkota) {
                if (!kabkota || !regencyMapReady) return '';
                const key = normalizeRegencyName(kabkota);
                if (!key) return '';
                if (regencyProvinceMap[key]) return regencyProvinceMap[key];
                // Pencocokan longgar (mis. sumber menyertakan imbuhan/kependekan berbeda)
                let best = '';
                let bestLen = 0;
                for (const k in regencyProvinceMap) {
                    if (k.length < 4) continue;
                    if (key.includes(k) && k.length > bestLen) { best = regencyProvinceMap[k]; bestLen = k.length; }
                    else if (k.includes(key) && key.length > bestLen) { best = regencyProvinceMap[k]; bestLen = key.length; }
                }
                return best;
            }

            // ---------- Deskripsi peristiwa DINAMIS (bukan hardcode) ----------
            // Membangun teks deskripsi langsung dari field-field mentah yang benar-benar
            // dikirim oleh masing-masing API sumber, apa pun nama/isinya, alih-alih hanya
            // menampilkan 1-2 field tetap yang sudah ditentukan sebelumnya. Field teknis
            // (id, koordinat) dan field yang sudah ditampilkan lewat badge lain dikecualikan
            // lewat parameter excludeKeys agar tidak duplikat.
            function isMeaningfulValue(v) {
                if (v === null || v === undefined) return false;
                const s = String(v).trim();
                if (s === '' || s === '-' || s === '0' || s.toLowerCase() === 'null' || s.toLowerCase() === 'nan' || s.toLowerCase() === 'undefined') return false;
                return true;
            }
            function prettifyKey(key) {
                return String(key)
                    .replace(/_/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim()
                    .replace(/\b\w/g, c => c.toUpperCase());
            }
            function buildDynamicDescription(rec, excludeKeys = []) {
                if (!rec || typeof rec !== 'object') return '';
                const excl = new Set(['_id', 'id', 'latitude', 'longitude', 'lat', 'lon', 'lng']
                    .concat(excludeKeys.map(k => k.toLowerCase())));
                const parts = [];
                for (const [k, v] of Object.entries(rec)) {
                    if (excl.has(String(k).toLowerCase())) continue;
                    if (!isMeaningfulValue(v)) continue;
                    parts.push(`${prettifyKey(k)}: ${v}`);
                }
                return parts.join(' | ');
            }

            // ---------- Penjelasan tingkat keyakinan (confidence) ----------
            function getConfidenceInfo(conf) {
                if (conf === undefined || conf === null || conf === '' || conf === '-') return null;
                const num = parseFloat(conf);
                if (!isNaN(num) && String(conf).match(/^-?\d+(\.\d+)?$/)) {
                    if (num >= 80) return { label: 'Tinggi', cls: 'high', desc: 'Tingkat keyakinan deteksi tinggi — kemungkinan besar merupakan titik api aktif.' };
                    if (num >= 50) return { label: 'Sedang', cls: 'mid', desc: 'Tingkat keyakinan deteksi sedang — disarankan verifikasi lebih lanjut.' };
                    return { label: 'Rendah', cls: 'low', desc: 'Tingkat keyakinan deteksi rendah — berpotensi bukan titik api aktif (mis. panas dari objek lain).' };
                }
                const str = String(conf).toLowerCase();
                if (str.includes('high') || str === 'h') return { label: 'Tinggi', cls: 'high', desc: 'Tingkat keyakinan deteksi tinggi.' };
                if (str.includes('nominal') || str.includes('medium') || str === 'n') return { label: 'Sedang', cls: 'mid', desc: 'Tingkat keyakinan deteksi sedang.' };
                if (str.includes('low') || str === 'l') return { label: 'Rendah', cls: 'low', desc: 'Tingkat keyakinan deteksi rendah.' };
                return { label: String(conf), cls: 'mid', desc: '' };
            }
            function confColor(cls) {
                if (cls === 'high') return { bg: 'var(--danger-bg)', fg: 'var(--danger)' };
                if (cls === 'low') return { bg: 'var(--info-bg)', fg: 'var(--info)' };
                return { bg: '#fff3d6', fg: 'var(--gold-deep)' };
            }

            // ---------- Catatan / penjelasan peristiwa ----------
            function buildCatatan(ev) {
                const src = ev.source || '';
                if (src.includes('BNPB Open Data')) {
                    return 'Data resmi BNPB mencatat indikasi Kebakaran Hutan dan Lahan (Karhutla) di wilayah ini berdasarkan rekapitulasi bencana nasional.';
                }
                if (src.includes('BNPB Data Kejadian')) {
                    return 'Kejadian bencana tercatat langsung dalam basis data resmi Badan Nasional Penanggulangan Bencana (BNPB).';
                }
                if (src.includes('BMKG')) {
                    return 'Titik panas (hotspot) terdeteksi oleh satelit pemantau BMKG. Hotspot menandakan area dengan suhu permukaan tinggi yang berpotensi sebagai titik kebakaran hutan/lahan aktif, bukan kepastian mutlak.';
                }
                if (src.includes('NASA FIRMS')) {
                    return 'Titik panas terdeteksi oleh satelit MODIS (NASA FIRMS) melalui sensor termal. Data bersifat near real-time dan digunakan secara global untuk pemantauan kebakaran.';
                }
                if (src.includes('Global Forest Watch')) {
                    return 'Peringatan GLAD Alert dari Global Forest Watch mengindikasikan potensi hilangnya tutupan hutan, yang dapat disebabkan oleh kebakaran maupun pembukaan lahan.';
                }
                return 'Kejadian kebakaran terpantau dari sumber data terbuka.';
            }

            // ---------- Utility: fetch dengan timeout (dipercepat, tanpa retry berlapis) ----------
            async function fetchWithTimeout(url, options = {}, timeout = 9000, retries = 0) {
                let lastError;
                for (let attempt = 0; attempt <= retries; attempt++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), timeout);
                        const response = await fetch(url, { ...options, signal: controller.signal });
                        clearTimeout(timeoutId);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response;
                    } catch (err) {
                        lastError = err;
                        if (attempt < retries) await new Promise(r => setTimeout(r, 500));
                    }
                }
                throw lastError;
            }

            // Daftar proxy CORS diringkas ke yang paling responsif; gagal cepat -> lanjut ke proxy berikutnya
            const PROXIES = [
                'https://corsproxy.io/?',
                'https://api.allorigins.win/raw?url=',
                'https://api.codetabs.com/v1/proxy?quest='
            ];

            // Timeout per percobaan diperpendek (6s) supaya total waktu tunggu satu sumber
            // (3 proxy + 1 percobaan langsung) tetap terbatas dan TIDAK menggantung lama,
            // meski salah satu/semua proxy sedang lambat atau tidak merespons.
            async function fetchWithProxy(url, options = {}) {
                for (const proxy of PROXIES) {
                    try {
                        const proxiedUrl = proxy + encodeURIComponent(url);
                        const resp = await fetchWithTimeout(proxiedUrl, options, 6000, 0);
                        if (resp.ok) return resp;
                    } catch (e) { /* lanjut ke proxy berikutnya */ }
                }
                // Percobaan langsung terakhir (barangkali CORS sumber sudah terbuka)
                return await fetchWithTimeout(url, options, 5000, 0);
            }

            // ---------- RENDER: Rekap Wilayah per Provinsi ----------
            function renderRekap(events) {
                if (!events || events.length === 0) {

                }
                const grouped = {};
                for (const ev of events) {
                    const prov = ev.province && ev.province.trim() ? ev.province.trim() : 'Provinsi belum teridentifikasi';
                    if (!grouped[prov]) grouped[prov] = { total: 0, kabkota: new Set(), sources: {}, latest: 0 };
                    grouped[prov].total++;
                    if (ev.kabkota) grouped[prov].kabkota.add(ev.kabkota);
                    const src = ev.source || 'Tidak diketahui';
                    grouped[prov].sources[src] = (grouped[prov].sources[src] || 0) + 1;
                    const ts = ev.timestamp ? new Date(ev.timestamp).getTime() : 0;
                    if (ts > grouped[prov].latest) grouped[prov].latest = ts;

                const entries = Object.entries(grouped).sort((a, b) => b[1].total - a[1].total);

            // ---------- SUMBER DATA (masing-masing independen -> dijalankan PARALEL) ----------
            // Catatan: endpoint & logika parsing SAMA seperti versi sebelumnya, tidak diubah.
            // Perbedaan utama: (1) berjalan bersamaan lewat Promise.allSettled, bukan berurutan;
            // (2) provinsi untuk sumber yang tidak menyertakannya (NASA FIRMS, GFW) memakai
            //     estimasi bounding-box offline, bukan reverse-geocoding jaringan yang lambat.

            async function fetchBNPBKarhutla() {
                const out = [];
                try {
                    logMessage('📡 BNPB Karhutla...', 'info');
                    const url = `https://data.bnpb.go.id/ne/api/3/action/datastore_search?resource_id=353da3aa-9ada-42aa-a5c2-e653d52ffd9c&limit=${getApiLimit()}`;
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.success && json.result && json.result.records) {
                            const records = json.result.records;
                            for (const rec of records) {
                                const kab = rec['Nama Kabupaten/Kota'] || '';
                                const prov = rec['Provinsi'] || '';
                                const lat = rec['Latitude'];
                                const lng = rec['Longitude'];
                                const fire = rec['KEBAKARAN HUTAN DAN LAHAN'];
                                const fireNum = parseFloat(fire);
                                // Hanya masukkan baris yang BENAR-BENAR mencatat kejadian karhutla
                                // (angka > 0). Sebelumnya perbandingan string "!== '0'" gagal
                                // menyaring nilai seperti "0.0", sehingga banyak baris kosong
                                // (bukan kejadian nyata) ikut terhitung sebagai "kejadian".
                                if (!isNaN(fireNum) && fireNum > 0) {
                                    const breakdown = buildDisasterBreakdown(rec, ['nama kabupaten/kota', 'provinsi']);
                                    const descText = breakdown.filter(b => b.raw > 0).map(b => `${b.label}: ${b.value}`).join(' | ')
                                        || `Kebakaran Hutan dan Lahan: ${formatDisasterCount(fire)}`;
                                    // Tanggal kejadian: pakai field tanggal ASLI dari sumber jika ada;
                                    // jika tidak ditemukan, JANGAN memakai waktu "sekarang" sebagai
                                    // pengganti (itu data semu) -> biarkan null, UI menyembunyikannya.
                                    const realDate = findDateField(rec);
                                    out.push({
                                        uid: 'karhutla:' + (rec['_id'] !== undefined ? rec['_id'] : `${kab}|${prov}|${descText}`),
                                        title: 'Karhutla (Hutan dan Lahan)',
                                        location: kab || '',
                                        province: prov,
                                        kabkota: kab,
                                        lat: lat, lng: lng,
                                        timestamp: realDate,
                                        source: 'BNPB Open Data',
                                        description: descText,
                                        breakdown: breakdown,
                                        detail: `Kabupaten: ${kab} | Provinsi: ${prov} | ${descText}`
                                    });
                                }
                            }
                            logMessage(`✅ BNPB Karhutla: ${records.length} record diperiksa, ${out.length} kejadian nyata.`, 'ok');
                        } else {
                            logMessage('⚠️ BNPB Karhutla: tidak ada records.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ BNPB Karhutla: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ BNPB Karhutla error: ${e.message}`, 'err');
                }
                return out;
            }

            async function fetchBMKGHotspot() {
                const out = [];
                try {
                    logMessage('📡 BMKG Hotspot...', 'info');
                    const url = 'https://data.bmkg.go.id/DataMKG/MEWS/hotspot/hotspot.json';
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.data && Array.isArray(json.data)) {
                            for (const item of json.data) {
                                const lat = parseFloat(item.lat);
                                const lng = parseFloat(item.lon);
                                if (isNaN(lat) || isNaN(lng)) continue;
                                const provOfficial = item.provinsi || '';
                                const prov = provOfficial || estimateProvinceFromCoords(lat, lng);
                                const dynamicDesc = buildDynamicDescription(item, ['provinsi', 'kabupaten']);
                                out.push({
                                    uid: `bmkg:${lat}|${lng}|${item.kecamatan || ''}|${item.kabupaten || ''}|${item.tanggal || ''}|${item.confidence || ''}`,
                                    title: `Hotspot (BMKG) - ${item.kecamatan || ''}`,
                                    location: `${item.kabupaten || ''}, ${item.provinsi || ''}`,
                                    province: prov,
                                    provinceEstimated: !provOfficial && !!prov,
                                    kabkota: item.kabupaten || '',
                                    lat: lat, lng: lng,
                                    timestamp: toISOOrNull(item.tanggal),
                                    source: 'BMKG Hotspot',
                                    description: dynamicDesc || `Confidence: ${item.confidence || '-'} | Kecamatan: ${item.kecamatan || ''}`,
                                    detail: `Kabupaten: ${item.kabupaten || ''} | Provinsi: ${item.provinsi || ''} | Confidence: ${item.confidence || '-'}` + (dynamicDesc ? ` | ${dynamicDesc}` : ''),
                                    confidence: item.confidence
                                });
                            }
                            logMessage(`✅ BMKG Hotspot: ${json.data.length} titik.`, 'ok');
                        } else {
                            logMessage('⚠️ BMKG Hotspot: data tidak sesuai format.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ BMKG Hotspot: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ BMKG Hotspot error: ${e.message}`, 'err');

                return out;
            }

            async function fetchNASAFirms() {
                const out = [];
                try {
                    logMessage('📡 NASA FIRMS (MODIS)...', 'info');
                    const url = 'https://firms.modaps.eosdis.nasa.gov/api/country/csv/7daea73d6a1e3eba1f1089e3018b1c0e/MODIS_NRT/IDN/1';
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'text/csv' } });
                    if (resp.ok) {
                        const text = await resp.text();
                        const lines = text.split('\n').filter(line => line.trim() !== '');
                        if (lines.length > 1) {
                            const header = lines[0].split(',');
                            const latIdx = header.indexOf('latitude');
                            const lngIdx = header.indexOf('longitude');
                            const dateIdx = header.indexOf('acq_date');
                            const timeIdx = header.indexOf('acq_time');
                            const confIdx = header.indexOf('confidence');
                            let count = 0;
                            const maxRows = limitIsAll ? (lines.length - 1) : Math.max(50, currentLimit);
                            for (let i = 1; i < lines.length && count < maxRows; i++) {
                                const cols = lines[i].split(',');
                                const lat = parseFloat(cols[latIdx]);
                                const lng = parseFloat(cols[lngIdx]);
                                if (isNaN(lat) || isNaN(lng)) continue;
                                const date = cols[dateIdx] || '';
                                const time = cols[timeIdx] || '';
                                const conf = cols[confIdx] || '';
                                const timestamp = toISOOrNull(date);
                                const prov = estimateProvinceFromCoords(lat, lng);
                                // Bangun objek baris secara dinamis dari SELURUH kolom CSV (bukan hanya
                                // kolom yang dipilih manual), sehingga field seperti brightness, frp,
                                // satellite, instrument, daynight, dll ikut tersaji jika tersedia.
                                const rowObj = {};
                                header.forEach((h, idx) => { if (h) rowObj[h] = cols[idx]; });
                                const dynamicDesc = buildDynamicDescription(rowObj, ['latitude', 'longitude']);
                                out.push({
                                    uid: `nasa:${lat}|${lng}|${date}|${time}|${conf}`,
                                    title: `Hotspot (NASA MODIS) - ${conf} confidence`,
                                    location: `${lat.toFixed(4)}, ${lng.toFixed(4)}`,
                                    province: prov,
                                    provinceEstimated: !!prov,
                                    kabkota: '',
                                    lat: lat, lng: lng,
                                    timestamp: timestamp,
                                    source: 'NASA FIRMS (MODIS)',
                                    description: dynamicDesc || `Confidence: ${conf} | Waktu: ${time} | Tanggal: ${date}`,
                                    detail: `Lat: ${lat} | Lng: ${lng} | Confidence: ${conf}` + (dynamicDesc ? ` | ${dynamicDesc}` : ''),
                                    confidence: conf
                                });
                                count++;
                            }
                            logMessage(`✅ NASA FIRMS: ${count} hotspot.`, 'ok');
                        } else {
                            logMessage('⚠️ NASA FIRMS: data kosong.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ NASA FIRMS: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ NASA FIRMS error: ${e.message}`, 'err');
                }
                return out;
            }

            async function fetchGFW() {
                const out = [];
                try {
                    logMessage('📡 Global Forest Watch (GLAD)...', 'info');
                    const url = `https://api.globalforestwatch.org/v1/glad-alerts/latest?limit=${getApiLimit()}`;
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.data && Array.isArray(json.data)) {
                            for (const item of json.data) {
                                const lat = parseFloat(item.latitude);
                                const lng = parseFloat(item.longitude);
                                if (isNaN(lat) || isNaN(lng)) continue;
                                const prov = estimateProvinceFromCoords(lat, lng);
                                const dynamicDesc = buildDynamicDescription(item, ['latitude', 'longitude']);
                                out.push({
                                    uid: `gfw:${lat}|${lng}|${item.alert_date || ''}|${item.confidence || ''}`,
                                    title: `GLAD Alert (GFW) - ${item.confidence || ''}`,
                                    location: `${lat.toFixed(4)}, ${lng.toFixed(4)}`,
                                    province: prov,
                                    provinceEstimated: !!prov,
                                    kabkota: '',
                                    lat: lat, lng: lng,
                                    timestamp: toISOOrNull(item.alert_date),
                                    source: 'Global Forest Watch',
                                    description: dynamicDesc || `Confidence: ${item.confidence || '-'}`,
                                    detail: `Lat: ${lat} | Lng: ${lng} | Confidence: ${item.confidence || '-'}` + (dynamicDesc ? ` | ${dynamicDesc}` : ''),
                                    confidence: item.confidence
                                });
                            }
                            logMessage(`✅ GFW: ${json.data.length} alert.`, 'ok');
                        } else {
                            logMessage('⚠️ GFW: data tidak sesuai format.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ GFW: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ GFW error: ${e.message}`, 'err');
                }
                return out;
            }

            async function fetchBNPBKejadian() {
                const out = [];
                try {
                    logMessage('📡 BNPB Data Kejadian...', 'info');
                    const url = `https://data.bnpb.go.id/ne/api/3/action/datastore_search?resource_id=3c76f12f-30e6-465c-b7e7-81b13a5f2950&limit=${getApiLimit()}`;
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.success && json.result && json.result.records) {
                            const records = json.result.records;
                            for (const rec of records) {
                                const jenis = rec['Jenis Bencana'] || '';
                                if (jenis.toLowerCase().includes('kebakaran') || jenis.toLowerCase().includes('karhutla')) {
                                    const kab = rec['Kabupaten/Kota'] || '';
                                    const prov = rec['Provinsi'] || '';
                                    const lat = rec['Latitude'];
                                    const lng = rec['Longitude'];
                                    if (lat && lng) {
                                        const dynamicDesc = buildDynamicDescription(rec, ['kabupaten/kota', 'provinsi', 'jenis bencana', 'tanggal']);
                                        out.push({
                                            uid: 'kejadian:' + (rec['_id'] !== undefined ? rec['_id'] : `${jenis}|${kab}|${rec['Tanggal'] || ''}`),
                                            title: `Kejadian: ${jenis}`,
                                            location: kab || '',
                                            province: prov,
                                            kabkota: kab,
                                            lat: lat, lng: lng,
                                            timestamp: toISOOrNull(rec['Tanggal']),
                                            source: 'BNPB Data Kejadian',
                                            description: dynamicDesc || `Keterangan: ${rec['Keterangan'] || ''}`,
                                            detail: `Kabupaten: ${kab} | Provinsi: ${prov} | Tanggal: ${rec['Tanggal'] || ''}` + (dynamicDesc ? ` | ${dynamicDesc}` : '')
                                        });
                                    }
                                }
                            }
                            logMessage(`✅ BNPB Kejadian: ${records.length} record.`, 'ok');
                        } else {
                            logMessage('⚠️ BNPB Kejadian: tidak ada records.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ BNPB Kejadian: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ BNPB Kejadian error: ${e.message}`, 'err');
                }
                return out;
            }

            // ---------- FETCH DATA (kelima sumber dijalankan PARALEL) ----------
            async function fetchAllData() {
                if (isRefreshing) return;
                isRefreshing = true;
                refreshBtn.disabled = true;
                refreshBtn.classList.add('spinning');
                setStatus(true, 'Mengambil data...');
                logMessage('🔄 Memulai pengambilan data dari berbagai sumber online (paralel)...', 'info');

                // Setiap sumber dibungkus watchdog (withHardTimeout) supaya satu sumber yang
                // lambat/gagal TIDAK PERNAH mengunci dashboard menunggu tanpa batas -> jika
                // melewati batas waktu, sumber itu dianggap kosong dan proses tetap lanjut.
                const results = await Promise.allSettled([
                    withHardTimeout(fetchBNPBKarhutla(), 20000, 'BNPB Karhutla'),
                    withHardTimeout(fetchBMKGHotspot(), 20000, 'BMKG Hotspot'),
                    withHardTimeout(fetchNASAFirms(), 20000, 'NASA FIRMS'),
                    withHardTimeout(fetchGFW(), 20000, 'Global Forest Watch'),
                    withHardTimeout(fetchBNPBKejadian(), 20000, 'BNPB Data Kejadian'),
                    withHardTimeout(loadRegencyProvinceMap(), 20000, 'Basis Data Wilayah')
                ]);

                let combined = [];
                for (const r of results) {
                    if (r.status === 'fulfilled' && Array.isArray(r.value)) combined = combined.concat(r.value);
                }

                // ---------- Koreksi Provinsi berdasarkan Kabupaten/Kota ----------
                // Setelah basis data wilayah (ihsaninh/wilayah-indonesia) siap, provinsi setiap
                // kejadian yang memiliki kab/kota DITENTUKAN ULANG berdasarkan pemetaan resmi ini
                // (lebih akurat & konsisten dibanding field provinsi mentah dari sumber, yang kadang
                // kosong/typo). Jika tidak ditemukan kecocokan, provinsi asli dari sumber / estimasi
                // koordinat tetap dipakai sebagai cadangan -> tidak ada data yang hilang.
                if (regencyMapReady) {
                    for (const ev of combined) {
                        if (ev.kabkota) {
                            const resolved = resolveProvinceFromKabkota(ev.kabkota);
                            if (resolved) {
                                ev.province = resolved;
                                ev.provinceEstimated = false; // sudah dikonfirmasi via basis data resmi
                            }
                        }
                    }
                    logMessage('🗺️ Provinsi disesuaikan berdasarkan kabupaten/kota via API wilayah-indonesia.', 'ok');
                }

                // ---------- Deduplikasi ----------
                // PENTING: kunci deduplikasi TIDAK BOLEH hanya mengandalkan lat/lng/timestamp,
                // karena banyak record valid (terutama BNPB Karhutla) tidak selalu punya
                // koordinat, dan timestamp kini bisa null (tidak lagi dipalsukan dengan waktu
                // "sekarang" - lihat toISOOrNull). Jika lat/lng/timestamp kosong di banyak
                // record sekaligus, kunci lama akan SAMA untuk semuanya -> record-record nyata
                // yang berbeda saling menimpa dan "hilang" dari daftar walau sudah tercatat di
                // log. Maka: pakai uid unik dari sumber (mis. _id resmi CKAN) jika tersedia,
                // dan fallback ke kombinasi field yang jauh lebih spesifik (sumber+judul+lokasi+
                // deskripsi) supaya kemungkinan tabrakan antar record berbeda sangat kecil.
                const unique = [];
                const seen = new Set();
                for (const ev of combined) {
                    if (!ev.province) ev.province = '';
                    if (!ev.kabkota) ev.kabkota = '';
                    const key = ev.uid || `${ev.source}|${ev.lat}|${ev.lng}|${ev.timestamp}|${ev.location}|${ev.kabkota}|${ev.description}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(ev);
                    }
                }

                // ---------- Urutkan berdasarkan waktu terbaru, lalu terapkan batas jumlah ----------
                // (default 200, editable dari header, atau ALL jika tombol ALL aktif)
                let finalEvents = sortByRecency(unique);
                if (!limitIsAll && finalEvents.length > currentLimit) {
                    finalEvents = finalEvents.slice(0, currentLimit);
                }

                if (finalEvents.length === 0) {
                    logMessage('⚠️ Tidak ada data dari semua sumber.', 'err');
                    setStatus(false, 'Tidak ada data');
                } else {
                    logMessage(`✅ Total ${unique.length} kejadian terkumpul, ditampilkan ${finalEvents.length}${limitIsAll ? ' (ALL)' : ' (batas: ' + currentLimit + ')'}.`, 'ok');
                    setStatus(true, `${finalEvents.length} kejadian`);
                }

                allEvents = finalEvents;
                updateTimestamp();
                populateFilterOptions();
                renderCurrentTab();

                isRefreshing = false;
                refreshBtn.disabled = false;
                refreshBtn.classList.remove('spinning');
            }

            // ---------- init ----------
            function init() {
                document.querySelectorAll('.sidebar-tabs button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        switchTab(this.dataset.tab);
                    });
                });
                refreshBtn.addEventListener('click', function() {
                    fetchAllData();
                });
                limitInput.addEventListener('change', function() {
                    const v = parseInt(limitInput.value, 10);
                    if (!isNaN(v) && v > 0) {
                        currentLimit = v;
                        if (!limitIsAll) fetchAllData();
                    }
                });
                limitAllBtn.addEventListener('click', function() {
                    limitIsAll = !limitIsAll;
                    limitAllBtn.classList.toggle('active', limitIsAll);
                    limitInput.disabled = limitIsAll;
                    fetchAllData();
                });
                filterProvinsiEl.addEventListener('change', function() {
                    filterProvinsi = filterProvinsiEl.value;
                    filterKabkota = '';
                    populateFilterOptions();
                    renderCurrentTab();
                });
                filterKabkotaEl.addEventListener('change', function() {
                    filterKabkota = filterKabkotaEl.value;
                    renderCurrentTab();
                });
                filterResetBtn.addEventListener('click', function() {
                    filterProvinsi = '';
                    filterKabkota = '';
                    filterProvinsiEl.value = '';
                    populateFilterOptions();
                    renderCurrentTab();
                });
                setInterval(fetchAllData, 60000);
                fetchAllData();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
