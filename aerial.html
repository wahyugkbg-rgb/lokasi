<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peta Interaktif - GPS & Pencarian</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        header {
            background: #1f1f1f;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 1000;
            flex-shrink: 0;
        }
        header h1 { font-size: 1.1rem; font-weight:600; color:#4db8ff; }
        .header-controls { display:flex; gap:8px; }
        .header-controls button {
            background:#333; color:#fff; border:1px solid #555;
            padding:6px 10px; border-radius:6px; font-size:0.8rem;
            cursor:pointer; transition:background 0.2s;
        }
        .header-controls button:active { background:#555; }
        main {
            flex:1; position:relative; display:flex; flex-direction:column;
        }
        #map {
            flex:1; width:100%; background:#0a0a0a; z-index:1;
        }

        /* Kontrol di atas peta */
        .map-controls {
            position:absolute; top:10px; left:10px; right:10px;
            z-index:500; display:flex; flex-wrap:wrap; gap:8px;
            pointer-events:none;
        }
        .map-controls > * { pointer-events:auto; }
        .search-box {
            background:rgba(20,20,20,0.85); backdrop-filter:blur(6px);
            border:1px solid #444; border-radius:8px;
            padding:6px 10px; display:flex; gap:6px; align-items:center;
            flex:1 1 200px; min-width:160px;
            position:relative;
        }
        .search-box input {
            background:transparent; border:none; color:#fff;
            padding:4px 0; font-size:0.9rem; outline:none; width:100%;
        }
        .search-box input::placeholder { color:#888; }
        .search-box button {
            background:#4db8ff; border:none; border-radius:4px;
            color:#111; padding:4px 10px; font-weight:bold;
            cursor:pointer; font-size:0.8rem; flex-shrink:0;
        }
        /* Dropdown daftar hasil pencarian (jika lebih dari 1 kandidat) */
        .search-results {
            position:absolute; top:calc(100% + 6px); left:0; right:0;
            background:rgba(20,20,20,0.97); backdrop-filter:blur(6px);
            border:1px solid #444; border-radius:8px;
            max-height:280px; overflow-y:auto;
            display:none; z-index:900;
            box-shadow:0 6px 18px rgba(0,0,0,0.5);
        }
        .search-results.show { display:block; }
        .search-results .result-item {
            padding:8px 10px; border-bottom:1px solid #333;
            cursor:pointer; font-size:0.8rem; line-height:1.4;
        }
        .search-results .result-item:last-child { border-bottom:none; }
        .search-results .result-item:active,
        .search-results .result-item.hover { background:#2a2a2a; }
        .search-results .result-item .r-title { color:#e0e0e0; font-weight:600; }
        .search-results .result-item .r-type { color:#4db8ff; font-size:0.68rem; margin-left:4px; }
        .search-results .result-item .r-sub { color:#888; font-size:0.72rem; margin-top:2px; }
        .search-results .result-empty { padding:10px; color:#888; font-size:0.8rem; text-align:center; }
        .layer-control {
            display:flex; gap:4px;
            background:rgba(20,20,20,0.85); backdrop-filter:blur(6px);
            border:1px solid #444; border-radius:8px; padding:4px;
            max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;
            scrollbar-width:none;
        }
        .layer-control::-webkit-scrollbar { display:none; }
        .layer-control button {
            background:transparent; border:1px solid transparent;
            color:#ccc; padding:4px 10px; border-radius:4px;
            font-size:0.75rem; cursor:pointer; transition:all 0.2s;
            white-space:nowrap; flex-shrink:0;
        }
        .layer-control button.active {
            background:#4db8ff; color:#111; border-color:#4db8ff; font-weight:600;
        }
        .layer-control button:active { opacity:0.7; }
        .loc-btn {
            background:rgba(20,20,20,0.85); backdrop-filter:blur(6px);
            border:1px solid #444; border-radius:8px;
            color:#fff; padding:6px 12px; font-size:0.8rem;
            cursor:pointer; display:flex; align-items:center; gap:4px;
            flex-shrink:0;
        }
        .loc-btn.active { border-color:#4db8ff; color:#4db8ff; background:rgba(77,184,255,0.12); }

        /* Info panel */
        .info-panel {
            position:absolute; bottom:20px; left:20px; right:20px;
            background:rgba(20,20,20,0.9); backdrop-filter:blur(6px);
            border:1px solid #444; border-radius:8px;
            padding:8px 12px; z-index:600;
            font-size:0.8rem; color:#aaa; max-width:340px;
            line-height:1.5;
        }
        .info-panel .label { color:#888; }
        .info-panel .value { color:#4db8ff; font-weight:bold; }
        .info-panel .addr-row {
            margin-top:4px; padding-top:4px; border-top:1px solid #333;
            display:none;
        }
        .info-panel .addr-row.show { display:flex; align-items:flex-start; gap:6px; }
        .info-panel .addr-text {
            color:#e0e0e0; font-size:0.78rem; flex:1;
            display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
            overflow:hidden;
        }
        .info-panel .copy-btn {
            background:#333; border:1px solid #555; color:#ccc;
            border-radius:5px; padding:3px 6px; font-size:0.7rem;
            cursor:pointer; flex-shrink:0;
        }
        .info-panel .copy-btn:active { background:#4db8ff; color:#111; }

        /* Loader */
        .loader {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            z-index:2000; text-align:center; display:none;
        }
        .spinner {
            border:4px solid rgba(255,255,255,0.1);
            border-left-color:#4db8ff; border-radius:50%;
            width:40px; height:40px; animation:spin 1s linear infinite;
            margin:0 auto 10px;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

        @media (min-width:768px) {
            .map-controls { flex-wrap:nowrap; }
            .search-box { flex:0 1 280px; }
        }
        @media (max-width:480px) {
            .map-controls .layer-control button { padding:3px 7px; font-size:0.68rem; }
        }

        /* ================= PENANDA LOKASI SAYA (jelas & menonjol) ================= */
        .my-loc-wrap {
            position:relative; width:34px; height:34px;
            display:flex; align-items:center; justify-content:center;
        }
        .my-loc-pulse {
            position:absolute; width:34px; height:34px; border-radius:50%;
            background:rgba(77,184,255,0.45);
            animation:locPulse 1.8s ease-out infinite;
        }
        .my-loc-ring {
            position:absolute; width:20px; height:20px; border-radius:50%;
            background:#1e88ff; border:3px solid #fff;
            box-shadow:0 0 10px rgba(30,136,255,0.9), 0 2px 4px rgba(0,0,0,0.5);
            z-index:2;
        }
        @keyframes locPulse {
            0% { transform:scale(0.4); opacity:1; }
            100% { transform:scale(2.4); opacity:0; }
        }
        /* Penanda hasil pencarian */
        .search-loc-wrap {
            position:relative; width:30px; height:40px;
        }
        .search-pin {
            position:absolute; top:0; left:0; width:30px; height:30px;
            display:flex; align-items:center; justify-content:center;
            font-size:26px; filter:drop-shadow(0 3px 3px rgba(0,0,0,0.6));
        }
        .addr-popup { font-size:0.82rem; line-height:1.5; max-width:260px; }
        .addr-popup b { color:#1e88ff; }
        .addr-popup .full { color:#555; font-size:0.75rem; margin-top:4px; display:block; }
        .addr-popup .row { margin:1px 0; }
        .addr-popup .loading { color:#888; font-style:italic; }
    </style>
</head>
<body>

<header>
    <h1>🗺️ Peta Interaktif</h1>
    <div class="header-controls">
        <button id="btnFullscreen">⛶ Layar Penuh</button>
    </div>
</header>

<main>
    <div id="map"></div>

    <!-- Kontrol peta -->
    <div class="map-controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari desa, kelurahan, gang, perumahan..." autocomplete="off" />
            <button id="searchBtn">Cari</button>
            <div class="search-results" id="searchResults"></div>
        </div>
        <div class="layer-control" id="layerControl">
            <button data-layer="osm" class="active">🗺️ Peta</button>
            <button data-layer="sat">🛰️ Satelit</button>
            <button data-layer="aerial">✈️ Udara</button>
            <button data-layer="terrain">⛰️ Medan</button>
            <button data-layer="hot">🏘️ Detail</button>
            <button data-layer="dark">🌙 Gelap</button>
        </div>
        <button class="loc-btn" id="locBtn">📍 Lokasi Saya</button>
    </div>

    <!-- Info panel -->
    <div class="info-panel" id="infoPanel">
        <span class="label">Status GPS: </span><span class="value" id="gpsStatus">Tidak aktif</span><br>
        <span class="label">Koordinat: </span><span class="value" id="gpsCoords">-</span>
        <div class="addr-row" id="addrRow">
            <span class="addr-text" id="addrText">-</span>
            <button class="copy-btn" id="copyAddrBtn">📋</button>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p id="loaderText">Memuat...</p>
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ======================================================================
    // KONFIGURASI
    // ======================================================================
    const MY_LAT = -6.2;
    const MY_LNG = 106.8;
    const FETCH_TIMEOUT_MS = 7000; // per percobaan koneksi (diturunkan agar pencarian tidak lama)
    const ADDRESS_REFRESH_MS = 20000; // perbarui alamat tiap 20 detik selama tracking
    const ADDRESS_MOVE_THRESHOLD_M = 25; // hanya geocode ulang jika bergeser > 25m

    // Proxy pribadi (kosongkan jika tidak punya)
    const CUSTOM_PROXY_URL = 'https://odd-dew-de57.endangbogorkota.workers.dev/?url=';

    // ======================================================================
    // INISIALISASI PETA
    // ======================================================================
    const map = L.map('map', { zoomControl: false }).setView([MY_LAT, MY_LNG], 4);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ======================================================================
    // REGISTRY LAYER (mudah ditambah: osm, satelit, udara, medan, dll)
    // ======================================================================
    const layerOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    });

    const layerSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics'
    });

    // "Udara" = citra satelit/udara ESRI + overlay label jalan/batas wilayah agar tetap terbaca sampai gang
    const layerAerialImg = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics'
    });
    const layerAerialLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Labels © Esri'
    });
    const layerAerial = L.layerGroup([layerAerialImg, layerAerialLabels]);

    const layerTerrain = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        maxZoom: 17,
        attribution: '© OpenTopoMap (CC-BY-SA), © OpenStreetMap contributors'
    });

    // Peta detail humanitarian (biasanya lebih lengkap untuk jalan kecil/gang di Indonesia)
    const layerHOT = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors, Tiles style by HOT'
    });

    const layerDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors, © CARTO'
    });

    const layers = {
        osm: layerOSM,
        sat: layerSat,
        aerial: layerAerial,
        terrain: layerTerrain,
        hot: layerHOT,
        dark: layerDark
    };

    let currentLayerKey = 'osm';
    let currentLayer = layers[currentLayerKey];
    currentLayer.addTo(map);

    // ======================================================================
    // KONTROL LAYER (perbaikan bug: selector sebelumnya #layerControl tidak
    // pernah cocok dengan class-nya sehingga tombol jenis peta tidak berfungsi)
    // ======================================================================
    const layerControlEl = document.getElementById('layerControl');
    const layerButtons = layerControlEl.querySelectorAll('button');

    function switchLayer(key) {
        if (!layers[key] || key === currentLayerKey && map.hasLayer(currentLayer)) {
            if (key === currentLayerKey) return; // sudah aktif
        }
        if (map.hasLayer(currentLayer)) {
            map.removeLayer(currentLayer);
        }
        currentLayerKey = layers[key] ? key : 'osm';
        currentLayer = layers[currentLayerKey];
        currentLayer.addTo(map);

        // pastikan marker (lokasi saya & hasil pencarian) tetap tampil di atas layer baru
        if (myMarker) myMarker.bringToFront();
        if (searchMarker) searchMarker.bringToFront();
    }

    layerButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            layerButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            switchLayer(this.dataset.layer);
        });
    });

    // ======================================================================
    // FUNGSI FETCH DENGAN PROXY (multi-strategy)
    // ======================================================================
    const proxyStrategies = [
        {
            name: 'Langsung (tanpa proxy)',
            build: (url) => url,
            parse: (res) => res.json()
        },
        ...(CUSTOM_PROXY_URL ? [{
            name: 'Proxy Pribadi',
            build: (url) => `${CUSTOM_PROXY_URL}${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        }] : []),
        {
            name: 'Corsfix',
            build: (url) => `https://proxy.corsfix.com/?${url}`,
            parse: (res) => res.json()
        },
        {
            name: 'CodeTabs',
            build: (url) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        },
        {
            name: 'AllOrigins (get)',
            build: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
            parse: async (res) => {
                const wrapper = await res.json();
                return JSON.parse(wrapper.contents);
            }
        },
        {
            name: 'AllOrigins (raw)',
            build: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        },
        {
            name: 'CorsProxy.io',
            build: (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        },
        {
            name: 'x2u CORS',
            build: (url) => `https://cors.x2u.in/${url}`,
            parse: (res) => res.json()
        }
    ];

    function fetchWithTimeout(url, signal, timeoutMs = FETCH_TIMEOUT_MS) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        // gabungkan sinyal luar (untuk membatalkan strategi lain saat salah satu sudah menang) dengan timeout internal
        if (signal) {
            signal.addEventListener('abort', () => controller.abort());
        }
        return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
    }

    // ======================================================================
    // fetchWithProxy: SEMUA strategi koneksi dijalankan BERSAMAAN (paralel),
    // hasil tercepat & valid yang dipakai, sisanya langsung dibatalkan.
    // Ini jauh lebih cepat dibanding mencoba satu-per-satu (sequential) yang
    // sebelumnya bisa memakan waktu sangat lama jika beberapa proxy lambat/mati.
    // ======================================================================
    async function fetchWithProxy(targetUrl) {
        const errors = [];
        const attempts = proxyStrategies.map(strategy => {
            const controller = new AbortController();
            const proxyUrl = strategy.build(targetUrl);
            const task = (async () => {
                const response = await fetchWithTimeout(proxyUrl, controller.signal);
                if (response.status === 429) throw new Error('Dibatasi sementara (429)');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await strategy.parse(response);
                if (Array.isArray(data)) return data;
                if (data && data.error) throw new Error(`API error: ${data.error}`);
                if (data == null) throw new Error('Respons kosong');
                return data;
            })().catch(e => {
                errors.push(`${strategy.name}: ${e.message}`);
                throw e;
            });
            task._controller = controller;
            return task;
        });

        try {
            const result = await Promise.any(attempts);
            // hentikan semua request lain yang masih berjalan, tidak perlu ditunggu
            attempts.forEach(t => { try { t._controller.abort(); } catch (_) {} });
            return result;
        } catch (aggregateError) {
            throw new Error('Semua metode koneksi gagal! ' + errors.slice(0, 3).join(' | '));
        }
    }

    // ======================================================================
    // UTIL: susun alamat lengkap hingga desa/dusun/gang dari hasil Nominatim
    // ======================================================================
    function buildDetailedAddress(addr) {
        if (!addr) return null;
        const parts = [];
        // Jalan / gang (Nominatim sering menaruh "Gang ..." di road)
        const jalan = addr.road || addr.pedestrian || addr.path || addr.footway;
        if (jalan) parts.push(jalan);
        if (addr.house_number) parts[parts.length - 1] = `${parts[parts.length - 1] || ''} No. ${addr.house_number}`.trim();

        // RT/RW kadang muncul di quarter/neighbourhood
        if (addr.neighbourhood) parts.push(addr.neighbourhood);
        if (addr.quarter && addr.quarter !== addr.neighbourhood) parts.push(addr.quarter);

        // Dusun / hamlet
        if (addr.hamlet) parts.push(`Dusun ${addr.hamlet}`);

        // Desa / Kelurahan
        const desa = addr.village || addr.suburb;
        if (desa) parts.push(desa);

        // Kecamatan
        const kecamatan = addr.city_district || addr.subdistrict || addr.municipality;
        if (kecamatan) parts.push(`Kec. ${kecamatan}`);

        // Kabupaten / Kota
        const kabkota = addr.county || addr.city || addr.town;
        if (kabkota) parts.push(kabkota);

        // Provinsi
        if (addr.state) parts.push(addr.state);

        // Kode pos
        if (addr.postcode) parts.push(addr.postcode);

        return parts.filter(Boolean).join(', ');
    }

    // ======================================================================
    // PENCARIAN WILAYAH (hingga desa/kelurahan/gang)
    // ======================================================================
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchResultsEl = document.getElementById('searchResults');
    let searchMarker = null;
    let lastSearchResults = [];

    function makeSearchIcon() {
        return L.divIcon({
            className: '',
            html: `<div class="search-loc-wrap"><div class="search-pin">📌</div></div>`,
            iconSize: [30, 40],
            iconAnchor: [15, 38],
            popupAnchor: [0, -34]
        });
    }

    // Label kategori singkat berdasarkan type/class Nominatim, agar mudah membedakan
    // hasil yang namanya mirip (mis. beberapa "Perumahan Griya Asri" di kota berbeda)
    function categoryLabel(result) {
        const map = {
            residential: 'Perumahan', neighbourhood: 'Lingkungan', suburb: 'Kelurahan/Suburb',
            village: 'Desa', hamlet: 'Dusun', town: 'Kota', city: 'Kota', county: 'Kabupaten',
            state: 'Provinsi', road: 'Jalan', house: 'Bangunan', building: 'Bangunan',
            administrative: 'Wilayah Administratif'
        };
        return map[result.type] || map[result.class] || result.type || result.class || '';
    }

    function hideSearchResults() {
        searchResultsEl.classList.remove('show');
        searchResultsEl.innerHTML = '';
    }

    function renderSearchResults(results) {
        lastSearchResults = results;
        if (!results.length) {
            searchResultsEl.innerHTML = `<div class="result-empty">Lokasi tidak ditemukan.</div>`;
            searchResultsEl.classList.add('show');
            return;
        }
        // Hanya tampilkan daftar pilihan jika ada lebih dari satu kandidat yang mirip
        if (results.length === 1) {
            hideSearchResults();
            selectSearchResult(results[0]);
            return;
        }
        searchResultsEl.innerHTML = results.map((r, i) => {
            const detail = buildDetailedAddress(r.address) || r.display_name;
            const cat = categoryLabel(r);
            return `<div class="result-item" data-idx="${i}">
                <span class="r-title">${r.namedetails?.name || r.display_name.split(',')[0]}</span>${cat ? `<span class="r-type">${cat}</span>` : ''}
                <div class="r-sub">${detail}</div>
            </div>`;
        }).join('');
        searchResultsEl.classList.add('show');
        searchResultsEl.querySelectorAll('.result-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.idx, 10);
                hideSearchResults();
                selectSearchResult(lastSearchResults[idx]);
            });
        });
    }

    function selectSearchResult(result) {
        const lat = parseFloat(result.lat);
        const lng = parseFloat(result.lon);
        if (isNaN(lat) || isNaN(lng)) return;
        map.setView([lat, lng], 18); // zoom tinggi untuk melihat detail gang/perumahan
        if (searchMarker) map.removeLayer(searchMarker);
        const detail = buildDetailedAddress(result.address) || result.display_name;
        searchMarker = L.marker([lat, lng], { icon: makeSearchIcon(), zIndexOffset: 900 }).addTo(map)
            .bindPopup(`<div class="addr-popup"><b>📌 Hasil Pencarian</b><div class="row">${detail}</div><span class="full">${result.display_name}</span></div>`)
            .openPopup();
        document.getElementById('gpsCoords').innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        document.getElementById('gpsStatus').innerText = 'Pencarian';
        showAddress(detail);
        searchInput.value = result.display_name.split(',')[0];
    }

    async function searchLocation(query) {
        if (!query.trim()) return;
        // Matikan Lokasi Saya agar peta tidak lompat-lompat kembali ke posisi GPS saat mencari wilayah lain
        if (isLocTracking) stopLocationTracking();
        // Nominatim: limit diperbesar & tanpa dedupe agar perumahan/kompleks dengan nama mirip tetap muncul semua
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8&addressdetails=1&namedetails=1&accept-language=id&dedupe=0`;
        try {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('loaderText').innerText = 'Mencari lokasi...';
            const data = await fetchWithProxy(url);
            renderSearchResults(data || []);
        } catch (e) {
            hideSearchResults();
            alert('Gagal mencari lokasi: ' + e.message);
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    searchBtn.addEventListener('click', () => searchLocation(searchInput.value));
    searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchLocation(searchInput.value); });
    // Segera matikan Lokasi Saya begitu pengguna mulai mengetik pencarian,
    // supaya watchPosition tidak terus menarik peta kembali ke posisi GPS.
    searchInput.addEventListener('input', () => {
        if (isLocTracking) stopLocationTracking();
        if (!searchInput.value.trim()) hideSearchResults();
    });
    searchInput.addEventListener('focus', () => {
        if (isLocTracking) stopLocationTracking();
    });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-box')) hideSearchResults();
    });

    // ======================================================================
    // LOKASI SAYA (GPS) - zoom ke lokasi + penanda jelas + alamat lengkap
    // ======================================================================
    const locBtn = document.getElementById('locBtn');
    let watchId = null;
    let myMarker = null;
    let isLocTracking = false;
    let addressTimer = null;
    let lastGeocodedLatLng = null;
    let geocodeInFlight = false;
    const gpsStatusEl = document.getElementById('gpsStatus');
    const gpsCoordsEl = document.getElementById('gpsCoords');
    const addrRowEl = document.getElementById('addrRow');
    const addrTextEl = document.getElementById('addrText');
    const copyAddrBtn = document.getElementById('copyAddrBtn');

    function makeMyLocIcon() {
        return L.divIcon({
            className: '',
            html: `<div class="my-loc-wrap"><div class="my-loc-pulse"></div><div class="my-loc-ring"></div></div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 17],
            popupAnchor: [0, -20]
        });
    }

    function showAddress(text) {
        if (!text) {
            addrRowEl.classList.remove('show');
            return;
        }
        addrTextEl.innerText = text;
        addrRowEl.classList.add('show');
    }

    function haversineMeters(a, b) {
        const R = 6371000;
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(b.lat - a.lat);
        const dLng = toRad(b.lng - a.lng);
        const lat1 = toRad(a.lat);
        const lat2 = toRad(b.lat);
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
    }

    async function reverseGeocodeAndUpdate(lat, lng, { openPopup = false } = {}) {
        if (geocodeInFlight) return;
        const point = { lat, lng };
        if (lastGeocodedLatLng && haversineMeters(lastGeocodedLatLng, point) < ADDRESS_MOVE_THRESHOLD_M && !openPopup) {
            return; // belum bergeser cukup jauh, hemat request
        }
        geocodeInFlight = true;
        if (myMarker) {
            myMarker.setPopupContent(`<div class="addr-popup"><b>📍 Lokasi Saya</b><div class="row loading">Mengambil alamat lengkap...</div></div>`);
            if (openPopup) myMarker.openPopup();
        }
        try {
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=id`;
            const data = await fetchWithProxy(url);
            const detail = buildDetailedAddress(data && data.address) || (data && data.display_name) || 'Alamat tidak ditemukan';
            const full = (data && data.display_name) || '';
            lastGeocodedLatLng = point;
            if (myMarker) {
                myMarker.setPopupContent(`<div class="addr-popup"><b>📍 Lokasi Saya</b><div class="row">${detail}</div>${full ? `<span class="full">${full}</span>` : ''}</div>`);
                if (openPopup) myMarker.openPopup();
            }
            showAddress(detail);
        } catch (e) {
            if (myMarker) {
                myMarker.setPopupContent(`<div class="addr-popup"><b>📍 Lokasi Saya</b><div class="row">Gagal mengambil alamat: ${e.message}</div></div>`);
            }
        } finally {
            geocodeInFlight = false;
        }
    }

    copyAddrBtn.addEventListener('click', () => {
        const text = addrTextEl.innerText;
        if (!text || text === '-') return;
        navigator.clipboard?.writeText(text).then(() => {
            copyAddrBtn.innerText = '✅';
            setTimeout(() => copyAddrBtn.innerText = '📋', 1200);
        }).catch(() => {});
    });

    // Matikan tracking GPS (dipakai tombol Lokasi Saya & otomatis saat pencarian aktif,
    // supaya peta tidak "lompat-lompat" kembali ke posisi GPS ketika sedang mencari wilayah lain)
    function stopLocationTracking() {
        if (watchId) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        if (addressTimer) {
            clearInterval(addressTimer);
            addressTimer = null;
        }
        isLocTracking = false;
        lastGeocodedLatLng = null;
        locBtn.classList.remove('active');
        locBtn.innerHTML = '📍 Lokasi Saya';
        if (myMarker) {
            map.removeLayer(myMarker);
            myMarker = null;
        }
        gpsStatusEl.innerText = 'Tidak aktif';
        gpsCoordsEl.innerText = '-';
        showAddress(null);
    }

    function toggleLocationTracking() {
        if (!navigator.geolocation) {
            alert('Geolokasi tidak didukung oleh browser ini.');
            return;
        }
        if (isLocTracking) {
            stopLocationTracking();
        } else {
            // Aktifkan
            locBtn.innerHTML = '⏳ Mendapatkan...';
            let firstFix = true;
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    if (!myMarker) {
                        myMarker = L.marker([lat, lng], {
                            icon: makeMyLocIcon(),
                            zIndexOffset: 1000
                        }).addTo(map)
                        .bindPopup(`<div class="addr-popup"><b>📍 Lokasi Saya</b><div class="row loading">Mengambil alamat lengkap...</div></div>`);
                    } else {
                        myMarker.setLatLng([lat, lng]);
                    }
                    // ZOOM ke lokasi dengan level zoom 18 untuk detail hingga gang
                    map.setView([lat, lng], 18);
                    if (!isLocTracking) {
                        isLocTracking = true;
                        locBtn.classList.add('active');
                        locBtn.innerHTML = '📍 Aktif';
                    }
                    gpsStatusEl.innerText = 'Aktif';
                    gpsCoordsEl.innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(pos.coords.accuracy || 0)}m)`;

                    // Alamat lengkap: langsung ambil saat fix pertama + buka popup penanda
                    if (firstFix) {
                        firstFix = false;
                        reverseGeocodeAndUpdate(lat, lng, { openPopup: true });
                        if (!addressTimer) {
                            addressTimer = setInterval(() => {
                                const p = myMarker.getLatLng();
                                reverseGeocodeAndUpdate(p.lat, p.lng);
                            }, ADDRESS_REFRESH_MS);
                        }
                    }
                },
                (err) => {
                    alert('Error GPS: ' + err.message);
                    locBtn.innerHTML = '📍 Lokasi Saya';
                    locBtn.classList.remove('active');
                    isLocTracking = false;
                    gpsStatusEl.innerText = 'Error';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
            );
            setTimeout(() => {
                if (!isLocTracking) {
                    locBtn.innerHTML = '📍 Lokasi Saya';
                }
            }, 10000);
        }
    }

    locBtn.addEventListener('click', toggleLocationTracking);

    // ======================================================================
    // FULLSCREEN
    // ======================================================================
    const btnFs = document.getElementById('btnFullscreen');
    btnFs.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
            btnFs.innerText = '⛶ Keluar';
        } else {
            document.exitFullscreen();
            btnFs.innerText = '⛶ Layar Penuh';
        }
    });
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            btnFs.innerText = '⛶ Layar Penuh';
        }
        setTimeout(() => map.invalidateSize(), 300);
    });

    // ======================================================================
    // INISIALISASI & RESIZE
    // ======================================================================
    window.addEventListener('resize', () => map.invalidateSize());

    console.log('Peta Interaktif siap digunakan. Layer aktif:', currentLayerKey);
</script>
</body>
</html>
