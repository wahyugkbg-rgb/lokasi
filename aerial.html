<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peta Interaktif — GPS & Navigasi</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg1:#04060d; --bg2:#0a1220; --bg3:#0d1b2e;
            --panel-bg:rgba(10,16,30,0.72);
            --panel-bg-solid:rgba(10,16,30,0.94);
            --panel-border:rgba(0,229,255,0.28);
            --panel-border-strong:rgba(0,229,255,0.55);
            --accent:#00e5ff;
            --accent2:#8a5cff;
            --accent3:#00ffb0;
            --warn:#ffb020;
            --danger:#ff4569;
            --text:#eaf5ff;
            --text-dim:#a9bcda;
            --glow-accent:0 0 14px rgba(0,229,255,0.55), 0 0 2px rgba(0,229,255,0.9);
            --glow-accent2:0 0 14px rgba(138,92,255,0.55);
            --glow-good:0 0 14px rgba(0,255,176,0.55);
            --radius:14px;
            --radius-sm:9px;
            --font-head:'Rajdhani', 'Segoe UI', sans-serif;
            --font-mono:'Share Tech Mono', 'Consolas', monospace;
        }
        body.sunlight-mode{
            --bg1:#f4f6f8; --bg2:#eef1f4; --bg3:#e7ecf1;
            --panel-bg:rgba(255,255,255,0.97);
            --panel-bg-solid:#ffffff;
            --panel-border:#0a0a0a;
            --panel-border-strong:#000000;
            --accent:#0057c7;
            --accent2:#7a1fb0;
            --accent3:#0a7d3a;
            --warn:#a35b00;
            --danger:#c40033;
            --text:#050608;
            --text-dim:#20242c;
            --glow-accent:none;
            --glow-accent2:none;
            --glow-good:none;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body{ height:100%; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(1200px 700px at 15% -10%, var(--bg3), transparent),
                        radial-gradient(1000px 600px at 110% 10%, rgba(138,92,255,0.10), transparent),
                        linear-gradient(160deg, var(--bg1), var(--bg2));
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            transition: background 0.4s ease, color 0.3s ease;
        }
        body.sunlight-mode{ background: var(--bg1); }

        /* ============================= HEADER ============================= */
        header {
            background: linear-gradient(90deg, rgba(10,16,30,0.92), rgba(13,27,46,0.92));
            backdrop-filter: blur(10px);
            padding: 9px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            box-shadow: 0 1px 0 rgba(0,229,255,0.15), 0 4px 18px rgba(0,0,0,0.35);
            z-index: 1000;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        body.sunlight-mode header{ background:#ffffff; box-shadow:0 2px 0 #000; }
        header::after{
            content:''; position:absolute; left:-40%; top:0; bottom:0; width:30%;
            background:linear-gradient(90deg, transparent, rgba(0,229,255,0.12), transparent);
            animation: headerSweep 6s linear infinite;
            pointer-events:none;
        }
        body.sunlight-mode header::after{ display:none; }
        @keyframes headerSweep{ 0%{ left:-40%; } 100%{ left:120%; } }

        .brand{ display:flex; align-items:center; gap:9px; }
        .brand-badge{
            width:34px; height:34px; border-radius:10px; flex-shrink:0;
            display:flex; align-items:center; justify-content:center; font-size:1.05rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: var(--glow-accent);
            position:relative;
        }
        .brand-badge .live-dot{
            position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
            background:var(--accent3); box-shadow:0 0 8px var(--accent3);
            animation: livePulse 1.6s ease-in-out infinite;
        }
        body.sunlight-mode .brand-badge .live-dot{ box-shadow:none; border:1px solid #000; }
        @keyframes livePulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:0.4; transform:scale(0.8);} }
        header h1 {
            font-family: var(--font-head); font-size: 1.12rem; font-weight:700;
            letter-spacing:0.5px; color:var(--text);
            text-shadow: 0 0 10px rgba(0,229,255,0.35);
        }
        body.sunlight-mode header h1{ text-shadow:none; }
        header h1 small{ display:block; font-size:0.6rem; font-weight:600; color:var(--accent); letter-spacing:2px; }

        .header-controls { display:flex; gap:8px; }
        .header-controls button {
            background:rgba(255,255,255,0.06); color:var(--text); border:1px solid var(--panel-border);
            padding:7px 11px; border-radius:var(--radius-sm); font-size:0.78rem; font-weight:600;
            cursor:pointer; transition:all 0.2s; letter-spacing:0.2px;
        }
        .header-controls button:active { transform:scale(0.95); }
        .header-controls button.on{
            background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#04060d;
            border-color:transparent; box-shadow:var(--glow-accent);
        }
        body.sunlight-mode .header-controls button{ background:#fff; border:2px solid #000; font-weight:700; }
        body.sunlight-mode .header-controls button.on{ background:#ffdd00; color:#000; }

        main {
            flex:1; position:relative; display:flex; flex-direction:column;
        }
        #map {
            flex:1; width:100%; background:#070b13; z-index:1;
        }

        /* ============================= KONTROL ATAS PETA ============================= */
        .map-controls {
            position:absolute; top:10px; left:10px; right:10px;
            z-index:500; display:flex; flex-wrap:wrap; gap:8px;
            pointer-events:none;
        }
        .map-controls > * { pointer-events:auto; }
        .glass{
            background:var(--panel-bg); backdrop-filter:blur(10px);
            border:1px solid var(--panel-border); border-radius:var(--radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.02);
        }
        body.sunlight-mode .glass{ box-shadow:0 3px 0 #000; border-width:2px; }

        .search-box {
            padding:7px 11px; display:flex; gap:6px; align-items:center;
            flex:1 1 200px; min-width:160px;
            position:relative;
        }
        .search-box .sicon{ color:var(--accent); font-size:0.95rem; flex-shrink:0; }
        .search-box input {
            background:transparent; border:none; color:var(--text);
            padding:4px 0; font-size:0.92rem; font-weight:600; outline:none; width:100%;
        }
        .search-box input::placeholder { color:var(--text-dim); font-weight:500; }
        .search-box button {
            background:linear-gradient(135deg, var(--accent), var(--accent2)); border:none; border-radius:7px;
            color:#04060d; padding:6px 13px; font-weight:700;
            cursor:pointer; font-size:0.78rem; flex-shrink:0; box-shadow:var(--glow-accent);
            letter-spacing:0.3px;
        }
        body.sunlight-mode .search-box button{ background:#ffdd00; color:#000; border:2px solid #000; box-shadow:none; }
        .search-box button:active{ transform:scale(0.94); }

        .search-results {
            position:absolute; top:calc(100% + 6px); left:0; right:0;
            background:var(--panel-bg-solid); backdrop-filter:blur(10px);
            border:1px solid var(--panel-border-strong); border-radius:var(--radius);
            max-height:280px; overflow-y:auto;
            display:none; z-index:900;
            box-shadow:0 10px 28px rgba(0,0,0,0.55);
        }
        .search-results.show { display:block; animation: dropIn 0.18s ease; }
        @keyframes dropIn{ from{ opacity:0; transform:translateY(-6px);} to{ opacity:1; transform:translateY(0);} }
        .search-results .result-item {
            padding:9px 11px; border-bottom:1px solid rgba(255,255,255,0.06);
            cursor:pointer; font-size:0.82rem; line-height:1.4;
        }
        body.sunlight-mode .search-results .result-item{ border-bottom:1px solid #ccc; }
        .search-results .result-item:last-child { border-bottom:none; }
        .search-results .result-item:active,
        .search-results .result-item.hover { background:rgba(0,229,255,0.10); }
        .search-results .result-item .r-title { color:var(--text); font-weight:700; }
        .search-results .result-item .r-type { color:var(--accent); font-size:0.68rem; margin-left:4px; font-weight:700; }
        .search-results .result-item .r-sub { color:var(--text-dim); font-size:0.74rem; margin-top:2px; font-weight:600; }
        .search-results .result-empty { padding:12px; color:var(--text-dim); font-size:0.82rem; text-align:center; font-weight:600; }

        .layer-control {
            display:flex; gap:4px;
            padding:4px;
            max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;
            scrollbar-width:none;
        }
        .layer-control::-webkit-scrollbar { display:none; }
        .layer-control button {
            background:transparent; border:1px solid transparent;
            color:var(--text-dim); padding:6px 11px; border-radius:8px;
            font-size:0.76rem; font-weight:700; cursor:pointer; transition:all 0.2s;
            white-space:nowrap; flex-shrink:0;
        }
        .layer-control button.active {
            background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#04060d;
            border-color:transparent; box-shadow:var(--glow-accent);
        }
        body.sunlight-mode .layer-control button.active{ background:#ffdd00; color:#000; }
        body.sunlight-mode .layer-control button{ color:#000; }
        .layer-control button:active { opacity:0.7; }

        .loc-btn {
            padding:8px 14px; font-size:0.8rem; font-weight:700;
            cursor:pointer; display:flex; align-items:center; gap:5px;
            flex-shrink:0; color:var(--text); border:1px solid var(--panel-border);
        }
        .loc-btn.active { border-color:var(--accent); color:#04060d; background:linear-gradient(135deg, var(--accent3), var(--accent)); box-shadow:var(--glow-good); }
        body.sunlight-mode .loc-btn.active{ background:#00e08a; color:#000; }

        /* ---- Chip Kompas ---- */
        .compass-chip{
            display:flex; align-items:center; gap:8px; padding:5px 10px; cursor:pointer;
            flex-shrink:0; user-select:none;
        }
        .compass-dial-wrap{ position:relative; width:38px; height:38px; flex-shrink:0; }
        .compass-dial-wrap svg{ width:100%; height:100%; transition: transform 0.15s linear; transform-origin:50% 50%; }
        .compass-dial .dial-ring{ fill:none; stroke:var(--accent); stroke-width:1.4; opacity:0.6; }
        .compass-dial text{ font-size:7px; font-weight:800; fill:var(--text); font-family:var(--font-head); }
        .compass-dial .dial-n{ fill:var(--danger); }
        .compass-pointer{
            position:absolute; top:1px; left:50%; transform:translateX(-50%);
            width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent;
            border-bottom:7px solid var(--accent3); filter:drop-shadow(0 0 3px rgba(0,255,176,0.8));
        }
        body.sunlight-mode .compass-pointer{ border-bottom-color:#c40033; filter:none; }
        .compass-text{ display:flex; flex-direction:column; line-height:1.15; }
        .compass-text #compassDeg{ font-family:var(--font-mono); font-size:0.86rem; font-weight:700; color:var(--accent); }
        .compass-text #compassDir{ font-size:0.66rem; font-weight:700; color:var(--text-dim); white-space:nowrap; }

        /* ---- Chip Cuaca ---- */
        .weather-box{ position:relative; flex-shrink:0; }
        .weather-toggle{
            background:transparent; border:none; color:var(--text); cursor:pointer;
            padding:8px 12px; font-size:0.8rem; font-weight:700; display:flex; align-items:center; gap:6px;
        }
        .weather-toggle .chev{ font-size:0.65rem; color:var(--text-dim); transition:transform 0.2s; }
        .weather-box.open .weather-toggle .chev{ transform:rotate(180deg); }
        .weather-panel{
            position:absolute; top:calc(100% + 6px); right:0; min-width:230px;
            background:var(--panel-bg-solid); border:1px solid var(--panel-border-strong); border-radius:var(--radius);
            padding:10px 12px; display:none; z-index:900; box-shadow:0 10px 28px rgba(0,0,0,0.55);
            font-size:0.8rem;
        }
        .weather-box.open .weather-panel{ display:block; animation: dropIn 0.18s ease; }
        .weather-panel .w-row{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px dashed rgba(255,255,255,0.1); font-weight:600; }
        body.sunlight-mode .weather-panel .w-row{ border-bottom:1px dashed #999; }
        .weather-panel .w-row:last-child{ border-bottom:none; }
        .weather-panel .w-row span:first-child{ color:var(--text-dim); }
        .weather-panel .w-row b{ color:var(--accent); font-weight:800; }
        .weather-panel .w-error{ color:var(--danger); font-weight:700; }
        .weather-panel .w-updated{ margin-top:6px; font-size:0.68rem; color:var(--text-dim); text-align:right; font-weight:600; }

        /* ============================= BOTTOM STACK ============================= */
        .bottom-stack{
            position:absolute; left:14px; right:14px; bottom:14px; z-index:600;
            display:flex; flex-direction:column; gap:8px; pointer-events:none; max-height:60%;
        }
        .bottom-stack > *{ pointer-events:auto; }
        @media (min-width:768px){ .bottom-stack{ max-width:380px; } }

        /* ---- Feed Transportasi (badge live) ---- */
        .transport-feed{ display:none; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; }
        .transport-feed.show{ display:flex; }
        .transport-badge{
            display:flex; align-items:center; gap:8px;
            background:var(--panel-bg); backdrop-filter:blur(10px);
            border:1px solid var(--panel-border-strong); border-radius:10px;
            padding:8px 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.4);
            animation: badgeIn 0.35s ease;
        }
        body.sunlight-mode .transport-badge{ border-width:2px; box-shadow:0 3px 0 #000; }
        @keyframes badgeIn{ from{ opacity:0; transform:translateY(10px) scale(0.97);} to{ opacity:1; transform:translateY(0) scale(1);} }
        .transport-badge .tb-icon{ font-size:1.15rem; flex-shrink:0; filter:drop-shadow(0 0 4px rgba(0,229,255,0.6)); }
        .transport-badge .tb-text{
            font-size:0.76rem; font-weight:800; letter-spacing:0.2px; color:var(--text);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            line-height:1.3;
        }
        body.sunlight-mode .transport-badge .tb-text{ text-shadow:none; }
        .transport-badge{ border-left:4px solid var(--accent); }
        .transport-badge.arrived{
            border-left:4px solid var(--accent3);
            box-shadow: 0 0 0 1px rgba(0,255,176,0.35), 0 6px 18px rgba(0,255,176,0.18);
            animation: badgeIn 0.35s ease, arrivedPulse 1.8s ease-in-out infinite;
        }
        body.sunlight-mode .transport-badge.arrived{ box-shadow:0 3px 0 #000; animation:badgeIn 0.35s ease; }
        @keyframes arrivedPulse{ 0%,100%{ box-shadow:0 0 0 1px rgba(0,255,176,0.35), 0 6px 18px rgba(0,255,176,0.18);} 50%{ box-shadow:0 0 0 1px rgba(0,255,176,0.7), 0 6px 26px rgba(0,255,176,0.4);} }

        /* ---- Info panel ---- */
        .info-panel {
            padding:10px 13px;
            font-size:0.82rem; color:var(--text-dim); max-width:100%;
            line-height:1.6; font-weight:600;
        }
        .info-panel .label { color:var(--text-dim); }
        .info-panel .value { color:var(--accent); font-weight:800; font-family:var(--font-mono); }
        .info-panel .addr-row {
            margin-top:6px; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.12);
            display:none;
        }
        body.sunlight-mode .info-panel .addr-row{ border-top:1px dashed #999; }
        .info-panel .addr-row.show { display:flex; align-items:flex-start; gap:6px; }
        .info-panel .addr-text {
            color:var(--text); font-size:0.8rem; flex:1; font-weight:700;
            display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
            overflow:hidden;
        }
        .info-panel .copy-btn {
            background:rgba(255,255,255,0.08); border:1px solid var(--panel-border); color:var(--text);
            border-radius:6px; padding:4px 7px; font-size:0.72rem;
            cursor:pointer; flex-shrink:0;
        }
        .info-panel .copy-btn:active { background:var(--accent); color:#04060d; }

        /* Loader */
        .loader {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            z-index:2000; text-align:center; display:none;
        }
        .spinner {
            border:4px solid rgba(255,255,255,0.12);
            border-left-color:var(--accent); border-radius:50%;
            width:42px; height:42px; animation:spin 0.9s linear infinite;
            margin:0 auto 10px; box-shadow:var(--glow-accent);
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        .loader p{ font-weight:700; font-size:0.85rem; text-shadow:0 0 10px rgba(0,229,255,0.4); }
        body.sunlight-mode .loader p{ text-shadow:none; background:#fff; padding:4px 10px; border-radius:6px; border:2px solid #000; }

        @media (min-width:768px) {
            .map-controls { flex-wrap:nowrap; }
            .search-box { flex:0 1 280px; }
        }
        @media (max-width:480px) {
            .map-controls { flex-direction:column; align-items:stretch; }
            .search-box { flex:1 1 auto; width:100%; min-width:0; }
            .layer-control { width:100%; }
            .loc-btn { width:100%; justify-content:center; }
            .compass-chip{ width:100%; justify-content:center; }
            .weather-box{ width:100%; }
            .weather-toggle{ width:100%; justify-content:center; }
            .weather-panel{ left:0; right:0; min-width:0; }
            .map-controls .layer-control button { padding:6px 10px; font-size:0.72rem; }
            .search-results { max-height:55vh; }
            .search-results .result-item { padding:10px 12px; font-size:0.85rem; }
            .search-results .result-item .r-sub { font-size:0.76rem; }
        }
        .search-results .result-item .r-title,
        .search-results .result-item .r-sub { word-break:break-word; }

        /* ================= PENANDA LOKASI SAYA (jelas & menonjol) ================= */
        .my-loc-wrap {
            position:relative; width:34px; height:34px;
            display:flex; align-items:center; justify-content:center;
        }
        .my-loc-pulse {
            position:absolute; width:34px; height:34px; border-radius:50%;
            background:rgba(0,229,255,0.40);
            animation:locPulse 1.8s ease-out infinite;
        }
        .my-loc-ring {
            position:absolute; width:20px; height:20px; border-radius:50%;
            background:radial-gradient(circle at 35% 30%, #7df9ff, #00b3d6 70%);
            border:3px solid #fff;
            box-shadow:0 0 12px rgba(0,229,255,0.95), 0 2px 4px rgba(0,0,0,0.5);
            z-index:2;
        }
        @keyframes locPulse {
            0% { transform:scale(0.4); opacity:1; }
            100% { transform:scale(2.4); opacity:0; }
        }
        /* Penanda hasil pencarian */
        .search-loc-wrap {
            position:relative; width:30px; height:40px;
        }
        .search-pin {
            position:absolute; top:0; left:0; width:30px; height:30px;
            display:flex; align-items:center; justify-content:center;
            font-size:26px; filter:drop-shadow(0 3px 3px rgba(0,0,0,0.6));
        }
        .addr-popup { font-size:0.84rem; line-height:1.5; max-width:260px; font-weight:600; }
        .addr-popup b { color:#0088b3; }
        .addr-popup .full { color:#555; font-size:0.75rem; margin-top:4px; display:block; font-weight:500; }
        .addr-popup .row { margin:1px 0; }
        .addr-popup .loading { color:#888; font-style:italic; }

        /* Enable-sensor toast (kompas) */
        .sensor-toast{
            position:absolute; left:50%; top:14px; transform:translateX(-50%) translateY(-16px);
            background:var(--panel-bg-solid); border:1px solid var(--panel-border-strong);
            border-radius:var(--radius); padding:10px 16px; z-index:1500; font-weight:700;
            font-size:0.82rem; box-shadow:0 10px 28px rgba(0,0,0,0.5); opacity:0; pointer-events:none;
            transition:all 0.25s ease; text-align:center;
        }
        .sensor-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <div class="brand-badge">🛰️<span class="live-dot"></span></div>
        <h1>Peta Interaktif<small>GPS · REAL-TIME NAV</small></h1>
    </div>
    <div class="header-controls">
        <button id="btnSunlight" title="Mode kontras tinggi untuk dibaca di bawah terik matahari">☀️ Mode Terik</button>
        <button id="btnFullscreen">⛶ Layar Penuh</button>
    </div>
</header>

<main>
    <div id="map"></div>

    <!-- Kontrol peta -->
    <div class="map-controls">
        <div class="search-box glass">
            <span class="sicon">🔎</span>
            <input type="text" id="searchInput" placeholder="Cari desa, kelurahan, gang, perumahan..." autocomplete="off" />
            <button id="searchBtn">Cari</button>
            <div class="search-results" id="searchResults"></div>
        </div>
        <div class="layer-control glass" id="layerControl">
            <button data-layer="osm" class="active">🗺️ Peta</button>
            <button data-layer="sat" title="Citra satelit polos">🛰️ Satelit</button>
            <button data-layer="aerial" title="Citra satelit + label jalan/nama tempat (Hybrid)">✈️ Udara</button>
            <button data-layer="aerialhq" title="Citra udara resolusi tinggi (Esri World Imagery Clarity)">🌆 Udara HQ</button>
            <button data-layer="terrain">⛰️ Medan</button>
            <button data-layer="hot">🏘️ Detail</button>
            <button data-layer="dark">🌙 Gelap</button>
        </div>

        <div class="compass-chip glass" id="compassChip" title="Arah kepala HP terhadap utara">
            <div class="compass-dial-wrap">
                <svg class="compass-dial" id="compassDial" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="17" class="dial-ring"/>
                    <text x="20" y="8" text-anchor="middle" class="dial-n">U</text>
                    <text x="20" y="36" text-anchor="middle">S</text>
                    <text x="35" y="23" text-anchor="middle">T</text>
                    <text x="5" y="23" text-anchor="middle">B</text>
                </svg>
                <div class="compass-pointer"></div>
            </div>
            <div class="compass-text">
                <span id="compassDeg">--°</span>
                <span id="compassDir">Tap aktifkan</span>
            </div>
        </div>

        <div class="weather-box glass" id="weatherBox">
            <button class="weather-toggle" id="weatherToggleBtn">🌤️ <span id="weatherSummary">Cuaca</span><span class="chev">▾</span></button>
            <div class="weather-panel" id="weatherPanel">
                <div class="w-row"><span>Menunggu lokasi…</span></div>
            </div>
        </div>

        <button class="loc-btn glass" id="locBtn">📍 Lokasi Saya</button>
    </div>

    <!-- Toast izin sensor kompas -->
    <div class="sensor-toast" id="sensorToast"></div>

    <!-- Tumpukan bawah: feed transportasi + info panel -->
    <div class="bottom-stack">
        <div class="transport-feed" id="transportFeed"></div>
        <div class="info-panel glass" id="infoPanel">
            <span class="label">Status GPS: </span><span class="value" id="gpsStatus">Tidak aktif</span><br>
            <span class="label">Koordinat: </span><span class="value" id="gpsCoords">-</span><br>
            <span class="label">Layar: </span><span class="value" id="wakeStatus">-</span>
            <div class="addr-row" id="addrRow">
                <span class="addr-text" id="addrText">-</span>
                <button class="copy-btn" id="copyAddrBtn">📋</button>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p id="loaderText">Memuat...</p>
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ======================================================================
    // KONFIGURASI
    // ======================================================================
    const MY_LAT = -6.2;
    const MY_LNG = 106.8;
    const FETCH_TIMEOUT_MS = 7000; // per percobaan koneksi (diturunkan agar pencarian tidak lama)
    const ADDRESS_REFRESH_MS = 10000; // cadangan: perbarui alamat tiap 10 detik jika diam di tempat (info tetap segar)
    const ADDRESS_MOVE_THRESHOLD_M = 12; // geocode ulang tiap kali bergeser > 12m, supaya terasa real time

    // Proxy pribadi (kosongkan jika tidak punya)
    const CUSTOM_PROXY_URL = 'https://odd-dew-de57.endangbogorkota.workers.dev/?url=';

    // ======================================================================
    // MODE TERIK (kontras tinggi agar mudah dibaca di bawah sinar matahari)
    // ======================================================================
    const btnSunlight = document.getElementById('btnSunlight');
    function applySunlightPref() {
        const on = localStorage.getItem('sunlightMode') === '1';
        document.body.classList.toggle('sunlight-mode', on);
        btnSunlight.classList.toggle('on', on);
    }
    btnSunlight.addEventListener('click', () => {
        const isOn = document.body.classList.toggle('sunlight-mode');
        btnSunlight.classList.toggle('on', isOn);
        localStorage.setItem('sunlightMode', isOn ? '1' : '0');
    });
    applySunlightPref();

    // ======================================================================
    // LAYAR TETAP MENYALA (Screen Wake Lock)
    // Mencegah HP masuk mode redup/kunci layar (screensaver) selama aplikasi
    // dibuka, memakai Wake Lock API bawaan browser (didukung Chrome/Android
    // versi modern, termasuk browser Chrome di Oppo A9). Wake Lock otomatis
    // dilepas oleh browser saat tab disembunyikan/minimize, jadi kita minta
    // ulang otomatis begitu tab terlihat kembali.
    // ======================================================================
    let wakeLock = null;
    const wakeStatusEl = document.getElementById('wakeStatus');

    async function requestWakeLock() {
        if (!('wakeLock' in navigator)) {
            if (wakeStatusEl) wakeStatusEl.innerText = 'Tidak didukung browser ini';
            return;
        }
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            if (wakeStatusEl) wakeStatusEl.innerText = '🔆 Tetap menyala';
            wakeLock.addEventListener('release', () => {
                wakeLock = null;
                if (wakeStatusEl && document.visibilityState === 'visible') {
                    wakeStatusEl.innerText = 'Nonaktif';
                }
            });
        } catch (err) {
            if (wakeStatusEl) wakeStatusEl.innerText = 'Gagal mengaktifkan';
        }
    }

    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !wakeLock) {
            requestWakeLock();
        }
    });

    // ======================================================================
    // INISIALISASI PETA
    // ======================================================================
    const map = L.map('map', { zoomControl: false }).setView([MY_LAT, MY_LNG], 4);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ======================================================================
    // REGISTRY LAYER (mudah ditambah: osm, satelit, udara, medan, dll)
    // ======================================================================
    const layerOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    });

    const layerSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics'
    });

    const layerAerialImg = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics'
    });
    const layerAerialLabels = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd',
        attribution: 'Labels © CARTO, © OpenStreetMap contributors'
    });
    const layerAerial = L.layerGroup([layerAerialImg, layerAerialLabels]);

    const layerAerialHQ = L.tileLayer('https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles © Esri — World Imagery (Clarity)'
    });

    const layerTerrain = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        maxZoom: 17,
        attribution: '© OpenTopoMap (CC-BY-SA), © OpenStreetMap contributors'
    });

    const layerHOT = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors, Tiles style by HOT'
    });

    const layerDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors, © CARTO'
    });

    const layers = {
        osm: layerOSM,
        sat: layerSat,
        aerial: layerAerial,
        aerialhq: layerAerialHQ,
        terrain: layerTerrain,
        hot: layerHOT,
        dark: layerDark
    };

    let currentLayerKey = 'osm';
    let currentLayer = layers[currentLayerKey];
    currentLayer.addTo(map);

    // ======================================================================
    // KONTROL LAYER
    // ======================================================================
    const layerControlEl = document.getElementById('layerControl');
    const layerButtons = layerControlEl.querySelectorAll('button');

    function switchLayer(key) {
        if (!layers[key] || key === currentLayerKey && map.hasLayer(currentLayer)) {
            if (key === currentLayerKey) return;
        }
        if (map.hasLayer(currentLayer)) {
            map.removeLayer(currentLayer);
        }
        currentLayerKey = layers[key] ? key : 'osm';
        currentLayer = layers[currentLayerKey];
        currentLayer.addTo(map);

        if (myMarker) myMarker.bringToFront();
        if (searchMarker) searchMarker.bringToFront();
    }

    layerButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            layerButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            switchLayer(this.dataset.layer);
        });
    });

    // ======================================================================
    // FUNGSI FETCH DENGAN PROXY (multi-strategy)
    // ======================================================================
    const proxyStrategies = [
        {
            name: 'Langsung (tanpa proxy)',
            build: (url) => url,
            parse: (res) => res.json()
        },
        ...(CUSTOM_PROXY_URL ? [{
            name: 'Proxy Pribadi',
            build: (url) => `${CUSTOM_PROXY_URL}${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        }] : []),
        {
            name: 'Corsfix',
            build: (url) => `https://proxy.corsfix.com/?${url}`,
            parse: (res) => res.json()
        },
        {
            name: 'CodeTabs',
            build: (url) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        },
        {
            name: 'AllOrigins (get)',
            build: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
            parse: async (res) => {
                const wrapper = await res.json();
                return JSON.parse(wrapper.contents);
            }
        },
        {
            name: 'AllOrigins (raw)',
            build: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        },
        {
            name: 'CorsProxy.io',
            build: (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        },
        {
            name: 'x2u CORS',
            build: (url) => `https://cors.x2u.in/${url}`,
            parse: (res) => res.json()
        }
    ];

    function fetchWithTimeout(url, signal, timeoutMs = FETCH_TIMEOUT_MS) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        if (signal) {
            signal.addEventListener('abort', () => controller.abort());
        }
        return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
    }

    async function fetchWithProxy(targetUrl) {
        const errors = [];
        const attempts = proxyStrategies.map(strategy => {
            const controller = new AbortController();
            const proxyUrl = strategy.build(targetUrl);
            const task = (async () => {
                const response = await fetchWithTimeout(proxyUrl, controller.signal);
                if (response.status === 429) throw new Error('Dibatasi sementara (429)');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await strategy.parse(response);
                if (Array.isArray(data)) return data;
                if (data && data.error) throw new Error(`API error: ${data.error}`);
                if (data == null) throw new Error('Respons kosong');
                return data;
            })().catch(e => {
                errors.push(`${strategy.name}: ${e.message}`);
                throw e;
            });
            task._controller = controller;
            return task;
        });

        try {
            const result = await Promise.any(attempts);
            attempts.forEach(t => { try { t._controller.abort(); } catch (_) {} });
            return result;
        } catch (aggregateError) {
            throw new Error('Semua metode koneksi gagal! ' + errors.slice(0, 3).join(' | '));
        }
    }

    // ======================================================================
    // UTIL: susun alamat lengkap hingga desa/dusun/gang dari hasil Nominatim
    // ======================================================================
    function buildDetailedAddress(addr) {
        if (!addr) return null;
        const parts = [];
        const jalan = addr.road || addr.pedestrian || addr.path || addr.footway;
        if (jalan) parts.push(jalan);
        if (addr.house_number) parts[parts.length - 1] = `${parts[parts.length - 1] || ''} No. ${addr.house_number}`.trim();

        if (addr.neighbourhood) parts.push(addr.neighbourhood);
        if (addr.quarter && addr.quarter !== addr.neighbourhood) parts.push(addr.quarter);

        if (addr.hamlet) parts.push(`Dusun ${addr.hamlet}`);

        const desa = addr.village || addr.suburb;
        if (desa) parts.push(desa);

        const kecamatan = addr.city_district || addr.subdistrict || addr.municipality;
        if (kecamatan) parts.push(`Kec. ${kecamatan}`);

        const kabkota = addr.county || addr.city || addr.town;
        if (kabkota) parts.push(kabkota);

        if (addr.state) parts.push(addr.state);

        if (addr.postcode) parts.push(addr.postcode);

        return parts.filter(Boolean).join(', ');
    }

    // ======================================================================
    // PENCARIAN WILAYAH (hingga desa/kelurahan/gang)
    // ======================================================================
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchResultsEl = document.getElementById('searchResults');
    let searchMarker = null;
    let lastSearchResults = [];

    function makeSearchIcon() {
        return L.divIcon({
            className: '',
            html: `<div class="search-loc-wrap"><div class="search-pin">📌</div></div>`,
            iconSize: [30, 40],
            iconAnchor: [15, 38],
            popupAnchor: [0, -34]
        });
    }

    function categoryLabel(result) {
        const map = {
            residential: 'Perumahan', neighbourhood: 'Lingkungan', suburb: 'Kelurahan/Suburb',
            village: 'Desa', hamlet: 'Dusun', town: 'Kota', city: 'Kota', county: 'Kabupaten',
            state: 'Provinsi', road: 'Jalan', house: 'Bangunan', building: 'Bangunan',
            administrative: 'Wilayah Administratif'
        };
        return map[result.type] || map[result.class] || result.type || result.class || '';
    }

    function photonToResult(feature) {
        const p = feature.properties || {};
        const coords = feature.geometry && feature.geometry.coordinates;
        if (!coords) return null;
        const [lon, lat] = coords;
        const address = {
            road: p.street,
            house_number: p.housenumber,
            neighbourhood: p.district,
            quarter: p.locality,
            hamlet: undefined,
            village: (p.osm_key === 'place') ? undefined : undefined,
            city_district: p.county,
            county: p.county,
            city: p.city,
            town: p.city,
            state: p.state,
            postcode: p.postcode,
            country: p.country
        };
        const display_name = [p.name, p.street, p.district, p.city, p.state, p.country]
            .filter((v, i, arr) => v && arr.indexOf(v) === i)
            .join(', ');
        return {
            lat: String(lat),
            lon: String(lon),
            display_name: display_name || 'Lokasi',
            address,
            type: p.osm_value,
            class: p.osm_key,
            namedetails: { name: p.name }
        };
    }

    function mergeSearchResults(lists) {
        const merged = [];
        lists.flat().forEach(r => {
            const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
            if (isNaN(lat) || isNaN(lon)) return;
            const isDup = merged.some(m => {
                const mLat = parseFloat(m.lat), mLon = parseFloat(m.lon);
                return haversineMeters({ lat, lng: lon }, { lat: mLat, lng: mLon }) < 30;
            });
            if (!isDup) merged.push(r);
        });
        return merged;
    }

    function hideSearchResults() {
        searchResultsEl.classList.remove('show');
        searchResultsEl.innerHTML = '';
    }

    function renderSearchResults(results) {
        lastSearchResults = results;
        if (!results.length) {
            searchResultsEl.innerHTML = `<div class="result-empty">Lokasi tidak ditemukan.</div>`;
            searchResultsEl.classList.add('show');
            return;
        }
        if (results.length === 1) {
            hideSearchResults();
            selectSearchResult(results[0]);
            return;
        }
        searchResultsEl.innerHTML = results.map((r, i) => {
            const detail = buildDetailedAddress(r.address) || r.display_name;
            const cat = categoryLabel(r);
            return `<div class="result-item" data-idx="${i}">
                <span class="r-title">${r.namedetails?.name || r.display_name.split(',')[0]}</span>${cat ? `<span class="r-type">${cat}</span>` : ''}
                <div class="r-sub">${detail}</div>
            </div>`;
        }).join('');
        searchResultsEl.classList.add('show');
        searchResultsEl.querySelectorAll('.result-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.idx, 10);
                hideSearchResults();
                selectSearchResult(lastSearchResults[idx]);
            });
        });
    }

    function selectSearchResult(result) {
        const lat = parseFloat(result.lat);
        const lng = parseFloat(result.lon);
        if (isNaN(lat) || isNaN(lng)) return;
        map.setView([lat, lng], 18);
        if (searchMarker) map.removeLayer(searchMarker);
        const detail = buildDetailedAddress(result.address) || result.display_name;
        searchMarker = L.marker([lat, lng], { icon: makeSearchIcon(), zIndexOffset: 900 }).addTo(map)
            .bindPopup(`<div class="addr-popup"><b>📌 Hasil Pencarian</b><div class="row">${detail}</div><span class="full">${result.display_name}</span></div>`)
            .openPopup();
        document.getElementById('gpsCoords').innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        document.getElementById('gpsStatus').innerText = 'Pencarian';
        showAddress(detail);
        searchInput.value = result.display_name.split(',')[0];
    }

    function nominatimUrl(q) {
        return `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=8&addressdetails=1&namedetails=1&accept-language=id&dedupe=0`;
    }

    async function searchLocation(query) {
        query = query.trim();
        if (!query) return;
        if (isLocTracking) stopLocationTracking();
        try {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('loaderText').innerText = 'Mencari lokasi (alamat, gang, perumahan)...';

            const photonUrl = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lang=id&limit=8&lat=${MY_LAT}&lon=${MY_LNG}`;

            const [nomRes, photonRes] = await Promise.allSettled([
                fetchWithProxy(nominatimUrl(query)),
                fetchWithProxy(photonUrl)
            ]);

            let results = [];
            if (nomRes.status === 'fulfilled' && Array.isArray(nomRes.value)) {
                results = results.concat(nomRes.value);
            }
            if (photonRes.status === 'fulfilled' && photonRes.value && Array.isArray(photonRes.value.features)) {
                results = results.concat(photonRes.value.features.map(photonToResult).filter(Boolean));
            }

            if (results.length === 0 && !/^(perumahan|komplek|kompleks|cluster|griya|bumi|villa)\b/i.test(query)) {
                try {
                    const retryData = await fetchWithProxy(nominatimUrl('Perumahan ' + query));
                    if (Array.isArray(retryData)) results = results.concat(retryData);
                } catch (_) { /* abaikan, hasil tetap dari percobaan pertama */ }
            }

            if (results.length === 0 && nomRes.status === 'rejected' && photonRes.status === 'rejected') {
                throw new Error('Semua sumber pencarian gagal dihubungi: ' + nomRes.reason.message);
            }

            renderSearchResults(mergeSearchResults([results]));
        } catch (e) {
            hideSearchResults();
            alert('Gagal mencari lokasi: ' + e.message);
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    searchBtn.addEventListener('click', () => searchLocation(searchInput.value));
    searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchLocation(searchInput.value); });
    searchInput.addEventListener('input', () => {
        if (isLocTracking) stopLocationTracking();
        if (!searchInput.value.trim()) hideSearchResults();
    });
    searchInput.addEventListener('focus', () => {
        if (isLocTracking) stopLocationTracking();
    });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-box')) hideSearchResults();
    });

    // ======================================================================
    // LOKASI SAYA (GPS) - zoom ke lokasi + penanda jelas + alamat lengkap
    // ======================================================================
    const locBtn = document.getElementById('locBtn');
    let watchId = null;
    let myMarker = null;
    let isLocTracking = false;
    let addressTimer = null;
    let lastGeocodedLatLng = null;
    let geocodeInFlight = false;
    const gpsStatusEl = document.getElementById('gpsStatus');
    const gpsCoordsEl = document.getElementById('gpsCoords');
    const addrRowEl = document.getElementById('addrRow');
    const addrTextEl = document.getElementById('addrText');
    const copyAddrBtn = document.getElementById('copyAddrBtn');

    function makeMyLocIcon() {
        return L.divIcon({
            className: '',
            html: `<div class="my-loc-wrap"><div class="my-loc-pulse"></div><div class="my-loc-ring"></div></div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 17],
            popupAnchor: [0, -20]
        });
    }

    function showAddress(text) {
        if (!text) {
            addrRowEl.classList.remove('show');
            return;
        }
        addrTextEl.innerText = text;
        addrRowEl.classList.add('show');
    }

    function haversineMeters(a, b) {
        const R = 6371000;
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(b.lat - a.lat);
        const dLng = toRad(b.lng - a.lng);
        const lat1 = toRad(a.lat);
        const lat2 = toRad(b.lat);
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
    }

    async function reverseGeocodeAndUpdate(lat, lng, { openPopup = false } = {}) {
        if (geocodeInFlight) return;
        const point = { lat, lng };
        if (lastGeocodedLatLng && haversineMeters(lastGeocodedLatLng, point) < ADDRESS_MOVE_THRESHOLD_M && !openPopup) {
            return;
        }
        geocodeInFlight = true;
        if (myMarker) {
            myMarker.setPopupContent(`<div class="addr-popup"><b>📍 Lokasi Saya</b><div class="row loading">Mengambil alamat lengkap...</div></div>`);
            if (openPopup) myMarker.openPopup();
        }
        try {
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=id`;
            const data = await fetchWithProxy(url);
            const detail = buildDetailedAddress(data && data.address) || (data && data.display_name) || 'Alamat tidak ditemukan';
            const full = (data && data.display_name) || '';
            lastGeocodedLatLng = point;
            if (myMarker) {
                myMarker.setPopupContent(`<div class="addr-popup"><b>📍 Lokasi Saya</b><div class="row">${detail}</div>${full ? `<span class="full">${full}</span>` : ''}</div>`);
                if (openPopup) myMarker.openPopup();
            }
            showAddress(detail);
        } catch (e) {
            if (myMarker) {
                myMarker.setPopupContent(`<div class="addr-popup"><b>📍 Lokasi Saya</b><div class="row">Gagal mengambil alamat: ${e.message}</div></div>`);
            }
        } finally {
            geocodeInFlight = false;
        }
    }

    copyAddrBtn.addEventListener('click', () => {
        const text = addrTextEl.innerText;
        if (!text || text === '-') return;
        navigator.clipboard?.writeText(text).then(() => {
            copyAddrBtn.innerText = '✅';
            setTimeout(() => copyAddrBtn.innerText = '📋', 1200);
        }).catch(() => {});
    });

    // ======================================================================
    // KOMPAS (arah kepala HP terhadap utara sebenarnya)
    // ======================================================================
    const compassChip = document.getElementById('compassChip');
    const compassDial = document.getElementById('compassDial');
    const compassDeg = document.getElementById('compassDeg');
    const compassDir = document.getElementById('compassDir');
    const sensorToast = document.getElementById('sensorToast');
    let compassActive = false;

    function showSensorToast(msg, ms = 2600) {
        sensorToast.innerText = msg;
        sensorToast.classList.add('show');
        clearTimeout(showSensorToast._t);
        showSensorToast._t = setTimeout(() => sensorToast.classList.remove('show'), ms);
    }

    function degToCompassDir(deg) {
        const dirs = ['Utara', 'Timur Laut', 'Timur', 'Tenggara', 'Selatan', 'Barat Daya', 'Barat', 'Barat Laut'];
        const idx = Math.round(deg / 45) % 8;
        return dirs[idx];
    }

    function updateCompassUI(heading) {
        heading = (heading % 360 + 360) % 360;
        compassDial.style.transform = `rotate(${-heading}deg)`;
        compassDeg.innerText = `${Math.round(heading).toString().padStart(3, '0')}°`;
        compassDir.innerText = degToCompassDir(heading);
    }

    function handleOrientation(e) {
        let heading;
        if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
            heading = e.webkitCompassHeading; // iOS: 0 = utara, searah jarum jam
        } else if (e.alpha != null) {
            heading = 360 - e.alpha; // Android: alpha berlawanan arah jarum jam dari utara
        } else {
            return;
        }
        compassActive = true;
        updateCompassUI(heading);
    }

    async function enableCompass() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res !== 'granted') { showSensorToast('Izin sensor arah ditolak.'); return; }
            } catch (e) { showSensorToast('Gagal meminta izin sensor: ' + e.message); return; }
        }
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        window.addEventListener('deviceorientation', handleOrientation, true);
        showSensorToast('🧭 Kompas aktif — pegang HP tegak untuk hasil terbaik.');
        setTimeout(() => {
            if (!compassActive) showSensorToast('Sensor kompas tidak terdeteksi di perangkat ini.');
        }, 2500);
    }

    compassChip.addEventListener('click', enableCompass);
    // Coba aktifkan otomatis di perangkat yang tidak butuh izin eksplisit (kebanyakan Android)
    if (!(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')) {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        window.addEventListener('deviceorientation', handleOrientation, true);
    }

    // ======================================================================
    // CUACA REAL-TIME (Open-Meteo, tanpa API key) — dapat show/hide
    // ======================================================================
    const WEATHER_REFRESH_MS = 5 * 60 * 1000;
    const WEATHER_MOVE_THRESHOLD_M = 300;
    let weatherTimer = null;
    let lastWeatherLatLng = null;
    const weatherBox = document.getElementById('weatherBox');
    const weatherToggleBtn = document.getElementById('weatherToggleBtn');
    const weatherPanel = document.getElementById('weatherPanel');
    const weatherSummary = document.getElementById('weatherSummary');

    function cloudCoverDesc(pct) {
        if (pct == null) return '-';
        if (pct < 15) return 'Cerah';
        if (pct < 40) return 'Cerah Berawan';
        if (pct < 70) return 'Berawan';
        if (pct < 90) return 'Mendung';
        return 'Mendung Tebal';
    }

    async function fetchWeather(lat, lng) {
        weatherPanel.innerHTML = `<div class="w-row"><span>Memuat data cuaca…</span></div>`;
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,cloud_cover,wind_speed_10m,wind_direction_10m&timezone=auto`;
            const res = await fetchWithTimeout(url, null, 9000);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            const c = data.current || {};
            const cond = cloudCoverDesc(c.cloud_cover);
            weatherSummary.innerText = `${c.temperature_2m != null ? Math.round(c.temperature_2m) + '°C' : 'Cuaca'} · ${cond}`;
            weatherPanel.innerHTML = `
                <div class="w-row"><span>🌡️ Suhu</span><b>${c.temperature_2m ?? '-'}°C</b></div>
                <div class="w-row"><span>💧 Kelembaban</span><b>${c.relative_humidity_2m ?? '-'}%</b></div>
                <div class="w-row"><span>☁️ Kondisi</span><b>${cond} (${c.cloud_cover ?? '-'}%)</b></div>
                <div class="w-row"><span>💨 Angin</span><b>${c.wind_speed_10m ?? '-'} km/j ${c.wind_direction_10m != null ? degToCompassDir(c.wind_direction_10m) : ''}</b></div>
                <div class="w-row"><span>⛰️ Ketinggian</span><b>${data.elevation != null ? Math.round(data.elevation) + ' m dpl' : '-'}</b></div>
                <div class="w-updated">Diperbarui ${new Date().toLocaleTimeString('id-ID')}</div>
            `;
        } catch (e) {
            weatherPanel.innerHTML = `<div class="w-row w-error">Gagal memuat cuaca: ${e.message}</div>`;
        }
    }

    function maybeFetchWeather(lat, lng, force = false) {
        if (!weatherBox.classList.contains('open')) return;
        const point = { lat, lng };
        if (!force && lastWeatherLatLng && haversineMeters(lastWeatherLatLng, point) < WEATHER_MOVE_THRESHOLD_M) return;
        lastWeatherLatLng = point;
        fetchWeather(lat, lng);
    }

    weatherToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const willOpen = !weatherBox.classList.contains('open');
        weatherBox.classList.toggle('open', willOpen);
        if (willOpen) {
            const p = myMarker ? myMarker.getLatLng() : { lat: MY_LAT, lng: MY_LNG };
            maybeFetchWeather(p.lat, p.lng, true);
        }
    });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.weather-box')) weatherBox.classList.remove('open');
    });

    // ======================================================================
    // DETEKSI TRANSPORTASI TERDEKAT SECARA REAL-TIME (Overpass/OpenStreetMap)
    // Memantau pergerakan GPS dan memunculkan pesan seperti:
    // "ANDA BERADA 700 METER DARI STASIUN JAYAKARTA" atau
    // "ANDA BERADA DI STASIUN JAYAKARTA" saat sudah sangat dekat/tiba.
    // Mencakup: stasiun kereta/komuter, MRT, LRT, terminal bus, terminal
    // taxi/angkot (halte), bandara, dan pelabuhan feri.
    // ======================================================================
    const TRANSPORT_RADIUS_M = 3000;
    const TRANSPORT_NOTIFY_M = 1200;
    const TRANSPORT_ARRIVED_M = 60;
    const TRANSPORT_CHECK_INTERVAL_MS = 45000;
    const TRANSPORT_MOVE_THRESHOLD_M = 250;
    let transportTimer = null;
    let lastTransportLatLng = null;
    let transportInFlight = false;
    const transportFeedEl = document.getElementById('transportFeed');

    const TRANSPORT_META = {
        railway_station: { icon: '🚆', label: 'Stasiun' },
        subway: { icon: '🚇', label: 'Stasiun MRT' },
        light_rail: { icon: '🚈', label: 'Stasiun LRT' },
        aerodrome: { icon: '✈️', label: 'Bandara' },
        bus_station: { icon: '🚌', label: 'Terminal Bus' },
        bus_stop: { icon: '🚏', label: 'Halte Bus/Angkot' },
        ferry_terminal: { icon: '⛴️', label: 'Pelabuhan Feri' },
        taxi: { icon: '🚕', label: 'Pangkalan Taxi' },
        terminal: { icon: '🚏', label: 'Terminal' }
    };

    function overpassQuery(lat, lon, radius) {
        const r = radius, rr = Math.min(radius, 800);
        return `[out:json][timeout:25];(
            node["railway"="station"](around:${r},${lat},${lon});
            node["railway"="halt"](around:${r},${lat},${lon});
            node["station"="subway"](around:${r},${lat},${lon});
            node["station"="light_rail"](around:${r},${lat},${lon});
            node["aeroway"="aerodrome"](around:${r},${lat},${lon});
            way["aeroway"="aerodrome"](around:${r},${lat},${lon});
            node["amenity"="bus_station"](around:${r},${lat},${lon});
            way["amenity"="bus_station"](around:${r},${lat},${lon});
            node["amenity"="ferry_terminal"](around:${r},${lat},${lon});
            node["amenity"="taxi"](around:${r},${lat},${lon});
            node["amenity"="terminal"](around:${r},${lat},${lon});
            node["highway"="bus_stop"](around:${rr},${lat},${lon});
        );out center 80;`;
    }

    function classifyElement(tags) {
        if (!tags) return null;
        if (tags.railway === 'station' || tags.railway === 'halt') return 'railway_station';
        if (tags.station === 'subway') return 'subway';
        if (tags.station === 'light_rail') return 'light_rail';
        if (tags.aeroway === 'aerodrome') return 'aerodrome';
        if (tags.amenity === 'bus_station') return 'bus_station';
        if (tags.amenity === 'ferry_terminal') return 'ferry_terminal';
        if (tags.amenity === 'taxi') return 'taxi';
        if (tags.amenity === 'terminal') return 'terminal';
        if (tags.highway === 'bus_stop') return 'bus_stop';
        return null;
    }

    function renderTransportFeed(list) {
        if (!list.length) {
            transportFeedEl.innerHTML = '';
            transportFeedEl.classList.remove('show');
            return;
        }
        transportFeedEl.classList.add('show');
        transportFeedEl.innerHTML = list.map(item => {
            const meta = TRANSPORT_META[item.cat];
            const arrived = item.dist <= TRANSPORT_ARRIVED_M;
            const text = arrived
                ? `ANDA BERADA DI ${item.name.toUpperCase()}`
                : `ANDA BERADA ${Math.round(item.dist)} METER DARI ${item.name.toUpperCase()}`;
            return `<div class="transport-badge ${arrived ? 'arrived' : ''}">
                <span class="tb-icon">${meta.icon}</span>
                <span class="tb-text">${text}</span>
            </div>`;
        }).join('');
    }

    async function checkNearbyTransport(lat, lng, force = false) {
        if (transportInFlight) return;
        const point = { lat, lng };
        if (!force && lastTransportLatLng && haversineMeters(lastTransportLatLng, point) < TRANSPORT_MOVE_THRESHOLD_M) return;
        transportInFlight = true;
        try {
            const q = overpassQuery(lat, lng, TRANSPORT_RADIUS_M);
            const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q);
            const res = await fetchWithTimeout(url, null, 16000);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            lastTransportLatLng = point;
            const elements = (data && data.elements) || [];
            const candidates = [];
            elements.forEach(el => {
                const cat = classifyElement(el.tags);
                if (!cat) return;
                const elat = el.lat ?? (el.center && el.center.lat);
                const elon = el.lon ?? (el.center && el.center.lon);
                if (elat == null || elon == null) return;
                const dist = haversineMeters(point, { lat: elat, lng: elon });
                if (dist > TRANSPORT_NOTIFY_M) return;
                const name = (el.tags && el.tags.name) || TRANSPORT_META[cat].label;
                candidates.push({ cat, name, dist });
            });
            const byCat = {};
            candidates.forEach(c => {
                if (!byCat[c.cat] || c.dist < byCat[c.cat].dist) byCat[c.cat] = c;
            });
            const list = Object.values(byCat).sort((a, b) => a.dist - b.dist).slice(0, 5);
            renderTransportFeed(list);
        } catch (e) {
            console.warn('Gagal memeriksa transportasi terdekat:', e.message);
        } finally {
            transportInFlight = false;
        }
    }

    function stopTransportTracking() {
        if (transportTimer) { clearInterval(transportTimer); transportTimer = null; }
        lastTransportLatLng = null;
        transportFeedEl.innerHTML = '';
        transportFeedEl.classList.remove('show');
    }

    // Matikan tracking GPS
    function stopLocationTracking() {
        if (watchId) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        if (addressTimer) {
            clearInterval(addressTimer);
            addressTimer = null;
        }
        if (weatherTimer) {
            clearInterval(weatherTimer);
            weatherTimer = null;
        }
        stopTransportTracking();
        isLocTracking = false;
        lastGeocodedLatLng = null;
        lastWeatherLatLng = null;
        locBtn.classList.remove('active');
        locBtn.innerHTML = '📍 Lokasi Saya';
        if (myMarker) {
            map.removeLayer(myMarker);
            myMarker = null;
        }
        gpsStatusEl.innerText = 'Tidak aktif';
        gpsCoordsEl.innerText = '-';
        showAddress(null);
    }

    function toggleLocationTracking() {
        if (!navigator.geolocation) {
            alert('Geolokasi tidak didukung oleh browser ini.');
            return;
        }
        if (isLocTracking) {
            stopLocationTracking();
        } else {
            locBtn.innerHTML = '⏳ Mendapatkan...';
            let firstFix = true;
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    if (!myMarker) {
                        myMarker = L.marker([lat, lng], {
                            icon: makeMyLocIcon(),
                            zIndexOffset: 1000
                        }).addTo(map)
                        .bindPopup(`<div class="addr-popup"><b>📍 Lokasi Saya</b><div class="row loading">Mengambil alamat lengkap...</div></div>`);
                    } else {
                        myMarker.setLatLng([lat, lng]);
                    }
                    map.setView([lat, lng], 18);
                    if (!isLocTracking) {
                        isLocTracking = true;
                        locBtn.classList.add('active');
                        locBtn.innerHTML = '📍 Aktif';
                    }
                    gpsStatusEl.innerText = 'Aktif';
                    gpsCoordsEl.innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(pos.coords.accuracy || 0)}m)`;

                    reverseGeocodeAndUpdate(lat, lng, { openPopup: firstFix });
                    checkNearbyTransport(lat, lng, firstFix);
                    maybeFetchWeather(lat, lng, firstFix);

                    if (firstFix) {
                        firstFix = false;
                        if (!addressTimer) {
                            addressTimer = setInterval(() => {
                                const p = myMarker.getLatLng();
                                reverseGeocodeAndUpdate(p.lat, p.lng);
                            }, ADDRESS_REFRESH_MS);
                        }
                        if (!transportTimer) {
                            transportTimer = setInterval(() => {
                                const p = myMarker.getLatLng();
                                checkNearbyTransport(p.lat, p.lng, true);
                            }, TRANSPORT_CHECK_INTERVAL_MS);
                        }
                        if (!weatherTimer) {
                            weatherTimer = setInterval(() => {
                                const p = myMarker.getLatLng();
                                maybeFetchWeather(p.lat, p.lng, true);
                            }, WEATHER_REFRESH_MS);
                        }
                    }
                },
                (err) => {
                    alert('Error GPS: ' + err.message);
                    locBtn.innerHTML = '📍 Lokasi Saya';
                    locBtn.classList.remove('active');
                    isLocTracking = false;
                    gpsStatusEl.innerText = 'Error';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
            );
            setTimeout(() => {
                if (!isLocTracking) {
                    locBtn.innerHTML = '📍 Lokasi Saya';
                }
            }, 10000);
        }
    }

    locBtn.addEventListener('click', toggleLocationTracking);

    // ======================================================================
    // FULLSCREEN
    // ======================================================================
    const btnFs = document.getElementById('btnFullscreen');
    btnFs.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
            btnFs.innerText = '⛶ Keluar';
        } else {
            document.exitFullscreen();
            btnFs.innerText = '⛶ Layar Penuh';
        }
    });
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            btnFs.innerText = '⛶ Layar Penuh';
        }
        setTimeout(() => map.invalidateSize(), 300);
    });

    // ======================================================================
    // INISIALISASI & RESIZE
    // ======================================================================
    window.addEventListener('resize', () => map.invalidateSize());

    console.log('Peta Interaktif siap digunakan. Layer aktif:', currentLayerKey);
</script>
</body>
</html>
