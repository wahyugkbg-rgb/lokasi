<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peta Interaktif - GPS & Pencarian</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        header {
            background: #1f1f1f;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 1000;
            flex-shrink: 0;
        }
        header h1 { font-size: 1.1rem; font-weight:600; color:#4db8ff; }
        .header-controls { display:flex; gap:8px; }
        .header-controls button {
            background:#333; color:#fff; border:1px solid #555;
            padding:6px 10px; border-radius:6px; font-size:0.8rem;
            cursor:pointer; transition:background 0.2s;
        }
        .header-controls button:active { background:#555; }
        main {
            flex:1; position:relative; display:flex; flex-direction:column;
        }
        #map {
            flex:1; width:100%; background:#0a0a0a; z-index:1;
        }

        /* Kontrol di atas peta */
        .map-controls {
            position:absolute; top:10px; left:10px; right:10px;
            z-index:500; display:flex; flex-wrap:wrap; gap:8px;
            pointer-events:none;
        }
        .map-controls > * { pointer-events:auto; }
        .search-box {
            background:rgba(20,20,20,0.85); backdrop-filter:blur(6px);
            border:1px solid #444; border-radius:8px;
            padding:6px 10px; display:flex; gap:6px; align-items:center;
            flex:1 1 200px; min-width:160px;
        }
        .search-box input {
            background:transparent; border:none; color:#fff;
            padding:4px 0; font-size:0.9rem; outline:none; width:100%;
        }
        .search-box input::placeholder { color:#888; }
        .search-box button {
            background:#4db8ff; border:none; border-radius:4px;
            color:#111; padding:4px 10px; font-weight:bold;
            cursor:pointer; font-size:0.8rem;
        }
        .layer-control {
            display:flex; gap:4px;
            background:rgba(20,20,20,0.85); backdrop-filter:blur(6px);
            border:1px solid #444; border-radius:8px; padding:4px;
        }
        .layer-control button {
            background:transparent; border:1px solid transparent;
            color:#ccc; padding:4px 10px; border-radius:4px;
            font-size:0.75rem; cursor:pointer; transition:all 0.2s;
        }
        .layer-control button.active {
            background:#4db8ff; color:#111; border-color:#4db8ff;
        }
        .layer-control button:active { opacity:0.7; }
        .loc-btn {
            background:rgba(20,20,20,0.85); backdrop-filter:blur(6px);
            border:1px solid #444; border-radius:8px;
            color:#fff; padding:6px 12px; font-size:0.8rem;
            cursor:pointer; display:flex; align-items:center; gap:4px;
        }
        .loc-btn.active { border-color:#4db8ff; color:#4db8ff; }

        /* Info panel */
        .info-panel {
            position:absolute; bottom:20px; left:20px;
            background:rgba(20,20,20,0.85); backdrop-filter:blur(6px);
            border:1px solid #444; border-radius:8px;
            padding:8px 12px; z-index:600;
            font-size:0.8rem; color:#aaa; max-width:300px;
        }
        .info-panel .label { color:#888; }
        .info-panel .value { color:#4db8ff; font-weight:bold; }

        /* Loader */
        .loader {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            z-index:2000; text-align:center; display:none;
        }
        .spinner {
            border:4px solid rgba(255,255,255,0.1);
            border-left-color:#4db8ff; border-radius:50%;
            width:40px; height:40px; animation:spin 1s linear infinite;
            margin:0 auto 10px;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

        @media (min-width:768px) {
            .map-controls { flex-wrap:nowrap; }
            .search-box { flex:0 1 280px; }
        }
        @media (max-width:480px) {
            .map-controls .layer-control button { padding:3px 6px; font-size:0.65rem; }
        }
        .leaflet-marker-icon.my-loc { filter:hue-rotate(180deg); }
    </style>
</head>
<body>

<header>
    <h1>🗺️ Peta Interaktif</h1>
    <div class="header-controls">
        <button id="btnFullscreen">⛶ Layar Penuh</button>
    </div>
</header>

<main>
    <div id="map"></div>

    <!-- Kontrol peta -->
    <div class="map-controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari desa, kelurahan, gang..." />
            <button id="searchBtn">Cari</button>
        </div>
        <div class="layer-control">
            <button data-layer="osm" class="active">Peta</button>
            <button data-layer="sat">Satelit</button>
            <button data-layer="terrain">Medan</button>
            <button data-layer="aerial">Udara</button>
        </div>
        <button class="loc-btn" id="locBtn">📍 Lokasi Saya</button>
    </div>

    <!-- Info panel -->
    <div class="info-panel" id="infoPanel">
        <span class="label">Status GPS: </span><span class="value" id="gpsStatus">Tidak aktif</span><br>
        <span class="label">Koordinat: </span><span class="value" id="gpsCoords">-</span>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p id="loaderText">Memuat...</p>
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ======================================================================
    // KONFIGURASI
    // ======================================================================
    const MY_LAT = -6.2;
    const MY_LNG = 106.8;
    const FETCH_TIMEOUT_MS = 12000;

    // Proxy pribadi (kosongkan jika tidak punya)
    const CUSTOM_PROXY_URL = 'https://odd-dew-de57.endangbogorkota.workers.dev/?url=';

    // ======================================================================
    // INISIALISASI PETA
    // ======================================================================
    const map = L.map('map', { zoomControl: false }).setView([MY_LAT, MY_LNG], 4);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Layer base
    const layerOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    });
    const layerSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '© ESRI'
    });
    const layerTerrain = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenTopoMap'
    });
    const layerAerial = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '© ESRI'
    }); // sama dengan satelit, tapi bisa diganti

    let currentLayer = layerOSM;
    currentLayer.addTo(map);

    // ======================================================================
    // KONTROL LAYER
    // ======================================================================
    const layerButtons = document.querySelectorAll('#layerControl button');
    layerButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            layerButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const layer = this.dataset.layer;
            map.removeLayer(currentLayer);
            switch(layer) {
                case 'osm': currentLayer = layerOSM; break;
                case 'sat': currentLayer = layerSat; break;
                case 'terrain': currentLayer = layerTerrain; break;
                case 'aerial': currentLayer = layerAerial; break;
                default: currentLayer = layerOSM;
            }
            currentLayer.addTo(map);
        });
    });

    // ======================================================================
    // FUNGSI FETCH DENGAN PROXY (multi-strategy)
    // ======================================================================
    const proxyStrategies = [
        ...(CUSTOM_PROXY_URL ? [{
            name: 'Proxy Pribadi',
            build: (url) => `${CUSTOM_PROXY_URL}${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        }] : []),
        {
            name: 'Corsfix',
            build: (url) => `https://proxy.corsfix.com/?${url}`,
            parse: (res) => res.json()
        },
        {
            name: 'CodeTabs',
            build: (url) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        },
        {
            name: 'AllOrigins (get)',
            build: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
            parse: async (res) => {
                const wrapper = await res.json();
                return JSON.parse(wrapper.contents);
            }
        },
        {
            name: 'AllOrigins (raw)',
            build: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        },
        {
            name: 'CorsProxy.io',
            build: (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
            parse: (res) => res.json()
        },
        {
            name: 'x2u CORS',
            build: (url) => `https://cors.x2u.in/${url}`,
            parse: (res) => res.json()
        },
        {
            name: 'Langsung (tanpa proxy)',
            build: (url) => url,
            parse: (res) => res.json()
        }
    ];

    function fetchWithTimeout(url, timeoutMs = FETCH_TIMEOUT_MS) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
    }

    async function fetchWithProxy(targetUrl) {
        let lastError = new Error('Semua metode koneksi gagal!');
        for (const strategy of proxyStrategies) {
            const proxyUrl = strategy.build(targetUrl);
            try {
                const response = await fetchWithTimeout(proxyUrl);
                if (response.status === 429) throw new Error('Dibatasi sementara (429)');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await strategy.parse(response);
                if (Array.isArray(data)) {
                    return data;
                }
                if (data && data.error) {
                    throw new Error(`API error: ${data.error}`);
                }
                return data;
            } catch (e) {
                lastError = new Error(`${strategy.name}: ${e.message}`);
            }
        }
        throw lastError;
    }

    // ======================================================================
    // PENCARIAN WILAYAH (hingga desa/kelurahan/gang)
    // ======================================================================
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    let searchMarker = null;

    async function searchLocation(query) {
        if (!query.trim()) return;
        // Nominatim dengan parameter detail tinggi
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&addressdetails=1&accept-language=id&zoom=18`;
        try {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('loaderText').innerText = 'Mencari lokasi...';
            const data = await fetchWithProxy(url);
            if (!data || !data.length) {
                alert('Lokasi tidak ditemukan.');
                return;
            }
            const result = data[0];
            const lat = parseFloat(result.lat);
            const lng = parseFloat(result.lon);
            if (!isNaN(lat) && !isNaN(lng)) {
                map.setView([lat, lng], 18); // zoom tinggi untuk melihat detail gang
                if (searchMarker) map.removeLayer(searchMarker);
                searchMarker = L.marker([lat, lng]).addTo(map)
                    .bindPopup(result.display_name).openPopup();
                document.getElementById('gpsCoords').innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                document.getElementById('gpsStatus').innerText = 'Pencarian';
            }
        } catch (e) {
            alert('Gagal mencari lokasi: ' + e.message);
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    searchBtn.addEventListener('click', () => searchLocation(searchInput.value));
    searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchLocation(searchInput.value); });

    // ======================================================================
    // LOKASI SAYA (GPS) - langsung zoom ke lokasi
    // ======================================================================
    const locBtn = document.getElementById('locBtn');
    let watchId = null;
    let myMarker = null;
    let isLocTracking = false;
    const gpsStatusEl = document.getElementById('gpsStatus');
    const gpsCoordsEl = document.getElementById('gpsCoords');

    function toggleLocationTracking() {
        if (!navigator.geolocation) {
            alert('Geolokasi tidak didukung oleh browser ini.');
            return;
        }
        if (isLocTracking) {
            // Matikan
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            isLocTracking = false;
            locBtn.classList.remove('active');
            locBtn.innerHTML = '📍 Lokasi Saya';
            if (myMarker) {
                map.removeLayer(myMarker);
                myMarker = null;
            }
            gpsStatusEl.innerText = 'Tidak aktif';
            gpsCoordsEl.innerText = '-';
        } else {
            // Aktifkan
            locBtn.innerHTML = '⏳ Mendapatkan...';
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    if (!myMarker) {
                        myMarker = L.marker([lat, lng], { 
                            icon: L.divIcon({ className: 'my-loc', html: '📍', iconSize: [24,24] })
                        }).addTo(map)
                        .bindPopup('Lokasi saya');
                    } else {
                        myMarker.setLatLng([lat, lng]);
                    }
                    // ZOOM ke lokasi dengan level zoom 18 untuk detail
                    map.setView([lat, lng], 18);
                    if (!isLocTracking) {
                        isLocTracking = true;
                        locBtn.classList.add('active');
                        locBtn.innerHTML = '📍 Aktif';
                    }
                    gpsStatusEl.innerText = 'Aktif';
                    gpsCoordsEl.innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                },
                (err) => {
                    alert('Error GPS: ' + err.message);
                    locBtn.innerHTML = '📍 Lokasi Saya';
                    locBtn.classList.remove('active');
                    isLocTracking = false;
                    gpsStatusEl.innerText = 'Error';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
            );
            setTimeout(() => {
                if (!isLocTracking) {
                    locBtn.innerHTML = '📍 Lokasi Saya';
                }
            }, 10000);
        }
    }

    locBtn.addEventListener('click', toggleLocationTracking);

    // ======================================================================
    // FULLSCREEN
    // ======================================================================
    const btnFs = document.getElementById('btnFullscreen');
    btnFs.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
            btnFs.innerText = '⛶ Keluar';
        } else {
            document.exitFullscreen();
            btnFs.innerText = '⛶ Layar Penuh';
        }
    });
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            btnFs.innerText = '⛶ Layar Penuh';
        }
        setTimeout(() => map.invalidateSize(), 300);
    });

    // ======================================================================
    // INISIALISASI & RESIZE
    // ======================================================================
    window.addEventListener('resize', () => map.invalidateSize());

    console.log('Peta Interaktif siap digunakan.');
</script>
</body>
</html>
