<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pemantau Satelit</title>
    
    <!-- Leaflet CSS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Fallback */
            height: 100dvh; /* Dynamic viewport height untuk HP */
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: #1f1f1f;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4db8ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        button:active {
            background-color: #555;
        }

        /* Main Content (Map & Info) */
        main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            width: 100%;
            background-color: #0a0a0a;
            z-index: 1;
        }

        /* Info Panel di atas peta */
        .info-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #333;
            z-index: 500;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #4db8ff;
        }

        .sat-select-container {
            grid-column: span 2;
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        select {
            flex: 1;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        /* Log Panel */
        .log-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #444;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .log-panel.show {
            transform: translateY(0);
        }

        .log-header {
            padding: 10px 15px;
            background: #1f1f1f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .log-title {
            font-size: 0.9rem;
            color: #ff9800;
        }

        .log-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            line-height: 1.4;
            color: #aaa;
        }

        .log-content .log-time {
            color: #4caf50;
            margin-right: 8px;
        }

        .log-content .log-error {
            color: #f44336;
        }

        /* Loading Overlay */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            text-align: center;
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #4db8ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mode Lanscape Adjustments */
        @media screen and (orientation: landscape) {
            .info-panel {
                top: 10px;
                left: 10px;
                right: auto;
                width: 280px; /* Lebar tetap di samping */
                padding: 10px;
            }
            
            .log-panel {
                height: 100%;
                width: 40%;
                max-width: 350px;
                left: auto;
                right: 0;
                transform: translateX(100%);
                border-top: none;
                border-left: 1px solid #444;
            }

            .log-panel.show {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🛰️ Pemantau Satelit</h1>
        <div class="controls">
            <button id="btnLog">📜 Log</button>
            <button id="btnFullscreen">⛶ Layar</button>
        </div>
    </header>

    <main>
        <!-- Peta -->
        <div id="map"></div>

        <!-- Panel Informasi -->
        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">Satelit</span>
                <span class="info-value" id="satName">ISS (ZARYA)</span>
            </div>
            <div class="info-item">
                <span class="info-label">Ketinggian</span>
                <span class="info-value" id="satAltitude">- km</span>
            </div>
            <div class="info-item">
                <span class="info-label">Kecepatan</span>
                <span class="info-value" id="satSpeed">- km/j</span>
            </div>
            <div class="info-item">
                <span class="info-label">Lokasi</span>
                <span class="info-value" id="satCoords">-, -</span>
            </div>
            <div class="sat-select-container">
                <select id="satSelect">
                    <option value="25544">ISS (Stasiun Luar Angkasa)</option>
                    <option value="20580">Hubble Space Telescope</option>
                    <option value="44713">Starlink-1007</option>
                    <option value="33591">NOAA 19 (Cuaca)</option>
                </select>
            </div>
        </div>

        <!-- Loading -->
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Mengambil data...</p>
        </div>

        <!-- Log Panel -->
        <div class="log-panel" id="logPanel">
            <div class="log-header">
                <span class="log-title">Log Sistem</span>
                <button id="btnCloseLog" style="padding: 5px 10px;">✖</button>
            </div>
            <div class="log-content" id="logContent"></div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Konfigurasi API
        const API_KEY = 'LDQR34-DDRFHW-YQ5HVD-5TKW';
        const SAT_ID = document.getElementById('satSelect').value;
        const MY_LAT = -6.2;  // Default Jakarta
        const MY_LNG = 106.8;
        const SECONDS = 2; // Prediksi 2 detik ke depan

        // Elemen UI
        const map = L.map('map', { zoomControl: false }).setView([MY_LAT, MY_LNG], 3);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO',
            maxZoom: 19
        }).addTo(map);

        // Tambahkan kontrol zoom manual di pojok kanan bawah
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let satelliteMarker = L.circleMarker([0, 0], {
            color: '#ff0000',
            fillColor: '#f03',
            fillOpacity: 0.5,
            radius: 8
        }).addTo(map);

        let pathLine = L.polyline([], { color: '#4db8ff', dashArray: '5, 5' }).addTo(map);
        let isFetching = false;

        // Fungsi Logging
        const logContent = document.getElementById('logContent');
        function addLog(message, isError = false) {
            const time = new Date().toLocaleTimeString('id-ID');
            const logClass = isError ? 'log-error' : '';
            logContent.innerHTML += `<div class="${logClass}"><span class="log-time">[${time}]</span>${message}</div>`;
            logContent.scrollTop = logContent.scrollHeight; // Auto scroll ke bawah
        }

        // Toggle Log
        const logPanel = document.getElementById('logPanel');
        document.getElementById('btnLog').addEventListener('click', () => {
            logPanel.classList.toggle('show');
            addLog('Panel log dibuka.');
        });
        document.getElementById('btnCloseLog').addEventListener('click', () => {
            logPanel.classList.remove('show');
        });

        // Fullscreen Toggle
        const btnFs = document.getElementById('btnFullscreen');
        btnFs.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    addLog('Error fullscreen: ' + err.message, true);
                });
                btnFs.innerText = '.btnExit';
            } else {
                document.exitFullscreen();
                btnFs.innerText = '⛶ Layar';
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                btnFs.innerText = '⛶ Layar';
                addLog('Keluar dari mode layar penuh.');
            } else {
                addLog('Masuk mode layar penuh.');
            }
            // Invalidate size untuk mereset peta saat layar berubah
            setTimeout(() => map.invalidateSize(), 300);
        });

        // Ganti Satelit
        document.getElementById('satSelect').addEventListener('change', (e) => {
            const selectedText = e.target.options[e.target.selectedIndex].text;
            document.getElementById('satName').innerText = selectedText;
            addLog(`Mengganti target ke: ${selectedText} (ID: ${e.target.value})`);
            pathLine.setLatLngs([]); // Bersihkan jalur lama
            fetchSatelliteData();
        });

        // Fungsi Fetch Data Satelit
        async function fetchSatelliteData() {
            if (isFetching) return;
            isFetching = true;
            
            const currentSatId = document.getElementById('satSelect').value;
            const url = `https://api.n2yo.com/rest/v1/satellite/positions/${currentSatId}/${MY_LAT}/${MY_LNG}/0/${SECONDS}/&apiKey=${API_KEY}`;
            
            document.getElementById('loader').style.display = 'block';

            try {
                addLog(`Menghubungi API N2YO untuk ID ${currentSatId}...`);
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.info && data.info.transactionscount !== undefined) {
                    addLog(`Data diterima. Transaksi tersisa: Tidak terbatas(atau tidak dilaporkan)`);
                }

                // Ambil posisi terkini (index 0)
                const pos = data.positions[0];
                const lat = pos.satlatitude;
                const lng = pos.satlongitude;
                const alt = pos.sataltitude;
                const speed = pos.satvelocity;

                // Update UI
                document.getElementById('satAltitude').innerText = `${alt.toFixed(2)} km`;
                document.getElementById('satSpeed').innerText = `${speed.toFixed(2)} km/j`;
                document.getElementById('satCoords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;

                // Update Peta
                satelliteMarker.setLatLng([lat, lng]);
                map.setView([lat, lng], 4);

                // Gambar jalur orbit (dari posisi sekarang ke prediksi)
                const pathCoords = data.positions.map(p => [p.satlatitude, p.satlongitude]);
                pathLine.setLatLngs(pathCoords);

                addLog(`Posisi diperbarui: Lat ${lat.toFixed(2)}, Lng ${lng.toFixed(2)}`);

            } catch (error) {
                addLog('Gagal mengambil data: ' + error.message, true);
                console.error('Error:', error);
            } finally {
                document.getElementById('loader').style.display = 'none';
                isFetching = false;
            }
        }

        // Inisialisasi
        addLog('Aplikasi Pemantau Satelit dimulai.');
        addLog('API Key dimuat.');
        fetchSatelliteData();

        // Set interval untuk update otomatis setiap 15 detik (N2YO memiliki rate limit)
        setInterval(fetchSatelliteData, 15000);
        addLog('Auto-update dijadwalkan setiap 15 detik.');

    </script>
</body>
</html>
