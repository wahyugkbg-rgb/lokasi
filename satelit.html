<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pemantau Satelit</title>
    
    <!-- Leaflet CSS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh; 
            height: 100dvh; 
            overflow: hidden;
        }

        header {
            background-color: #1f1f1f;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4db8ff;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        button:active {
            background-color: #555;
        }

        main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            width: 100%;
            background-color: #0a0a0a;
            z-index: 1;
        }

        .info-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #333;
            z-index: 500;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #4db8ff;
        }

        .sat-select-container {
            grid-column: span 2;
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        select {
            flex: 1;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .log-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #444;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .log-panel.show {
            transform: translateY(0);
        }

        .log-header {
            padding: 10px 15px;
            background: #1f1f1f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .log-title {
            font-size: 0.9rem;
            color: #ff9800;
        }

        .log-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            line-height: 1.4;
            color: #aaa;
        }

        .log-content .log-time {
            color: #4caf50;
            margin-right: 8px;
        }

        .log-content .log-error {
            color: #f44336;
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            text-align: center;
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #4db8ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media screen and (orientation: landscape) {
            .info-panel {
                top: 10px;
                left: 10px;
                right: auto;
                width: 280px; 
                padding: 10px;
            }
            
            .log-panel {
                height: 100%;
                width: 40%;
                max-width: 350px;
                left: auto;
                right: 0;
                transform: translateX(100%);
                border-top: none;
                border-left: 1px solid #444;
            }

            .log-panel.show {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🛰️ Pemantau Satelit</h1>
        <div class="controls">
            <button id="btnLog">📜 Log</button>
            <button id="btnFullscreen">⛶ Layar</button>
        </div>
    </header>

    <main>
        <div id="map"></div>

        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">Satelit</span>
                <span class="info-value" id="satName">ISS (ZARYA)</span>
            </div>
            <div class="info-item">
                <span class="info-label">Status</span>
                <span class="info-value" id="connStatus">⏳ Menghubungkan...</span>
            </div>
            <div class="info-item">
                <span class="info-label">Ketinggian</span>
                <span class="info-value" id="satAltitude">- km</span>
            </div>
            <div class="info-item">
                <span class="info-label">Kecepatan (estimasi)</span>
                <span class="info-value" id="satSpeed">- km/j</span>
            </div>
            <div class="info-item">
                <span class="info-label">Lokasi</span>
                <span class="info-value" id="satCoords">-, -</span>
            </div>
            <div class="info-item">
                <span class="info-label">Update Terakhir</span>
                <span class="info-value" id="lastUpdate">-</span>
            </div>
            <div class="sat-select-container">
                <select id="satSelect">
                    <option value="25544">ISS (Stasiun Luar Angkasa)</option>
                    <option value="20580">Hubble Space Telescope</option>
                    <option value="44713">Starlink-1007</option>
                    <option value="33591">NOAA 19 (Cuaca)</option>
                </select>
            </div>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p id="loaderText">Mengambil data...</p>
        </div>

        <div class="log-panel" id="logPanel">
            <div class="log-header">
                <span class="log-title">Log Sistem & Koneksi</span>
                <button id="btnCloseLog" style="padding: 5px 10px;">✖</button>
            </div>
            <div class="log-content" id="logContent"></div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Konfigurasi API
        const API_KEY = 'LDQR34-DDRFHW-YQ5HVD-5TKW';
        const MY_LAT = -6.2;  // Default Jakarta
        const MY_LNG = 106.8;
        const SECONDS = 2;
        const FETCH_TIMEOUT_MS = 12000; // batas waktu per percobaan proxy
        const NORMAL_INTERVAL_MS = 15000;

        // OPSIONAL: kalau Anda sudah punya proxy pribadi (misal Cloudflare Worker
        // gratis), isi URL-nya di sini. Proxy pribadi jauh lebih andal daripada
        // proxy publik karena tidak dibagi-pakai/diblokir orang lain.
        // Contoh: 'https://nama-worker-anda.workers.dev/?url='
        // Kosongkan ('') kalau belum punya — sistem tetap jalan pakai proxy publik.
        const CUSTOM_PROXY_URL = 'https://odd-dew-de57.endangbogorkota.workers.dev/?url='; 

        // Elemen UI
        const map = L.map('map', { zoomControl: false }).setView([MY_LAT, MY_LNG], 3);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO',
            maxZoom: 19
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let satelliteMarker = L.circleMarker([0, 0], {
            color: '#ff0000',
            fillColor: '#f03',
            fillOpacity: 0.5,
            radius: 8
        }).addTo(map);

        let pathLine = L.polyline([], { color: '#4db8ff', dashArray: '5, 5' }).addTo(map);
        let isFetching = false;
        let hasCenteredMap = false;
        let lastKnownGood = null;
        let lastUpdateTime = null;
        let consecutiveFailures = 0;
        let retryTimeoutId = null;

        const logContent = document.getElementById('logContent');
        function addLog(message, isError = false) {
            const time = new Date().toLocaleTimeString('id-ID');
            const logClass = isError ? 'log-error' : '';
            logContent.innerHTML += `<div class="${logClass}"><span class="log-time">[${time}]</span>${message}</div>`;
            logContent.scrollTop = logContent.scrollHeight; 
        }

        function setStatus(state, detail) {
            const el = document.getElementById('connStatus');
            if (state === 'live') {
                el.innerText = '🟢 Live';
                el.style.color = '#4caf50';
            } else if (state === 'retrying') {
                el.innerText = `🟡 Menyambung ulang${detail ? ' (' + detail + ')' : ''}...`;
                el.style.color = '#ff9800';
            } else if (state === 'offline') {
                el.innerText = '🔴 Offline (pakai data terakhir)';
                el.style.color = '#f44336';
            } else {
                el.innerText = '⏳ Menghubungkan...';
                el.style.color = '#4db8ff';
            }
        }

        function updateLastUpdateLabel() {
            const el = document.getElementById('lastUpdate');
            el.innerText = lastUpdateTime ? lastUpdateTime.toLocaleTimeString('id-ID') : '-';
        }

        const logPanel = document.getElementById('logPanel');
        document.getElementById('btnLog').addEventListener('click', () => {
            logPanel.classList.toggle('show');
        });
        document.getElementById('btnCloseLog').addEventListener('click', () => {
            logPanel.classList.remove('show');
        });

        const btnFs = document.getElementById('btnFullscreen');
        btnFs.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    addLog('Error fullscreen: ' + err.message, true);
                });
                btnFs.innerText = '️ Exit';
            } else {
                document.exitFullscreen();
                btnFs.innerText = '⛶ Layar';
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                btnFs.innerText = '⛶ Layar';
            }
            setTimeout(() => map.invalidateSize(), 300);
        });

        document.getElementById('satSelect').addEventListener('change', (e) => {
            const selectedText = e.target.options[e.target.selectedIndex].text;
            document.getElementById('satName').innerText = selectedText;
            addLog(`Mengganti target ke: ${selectedText}`);
            pathLine.setLatLngs([]);
            hasCenteredMap = false;
            lastKnownGood = null;
            lastUpdateTime = null;
            consecutiveFailures = 0;
            document.getElementById('satAltitude').innerText = '- km';
            document.getElementById('satSpeed').innerText = '- km/j';
            document.getElementById('satCoords').innerText = '-, -';
            updateLastUpdateLabel();
            setStatus('connecting');
            if (retryTimeoutId) { clearTimeout(retryTimeoutId); retryTimeoutId = null; }
            fetchSatelliteData();
        });

        // ==========================================================
        // SISTEM FETCH AGRESIF DENGAN CORS PROXY FALLBACK (multi-layer)
        // ==========================================================
        // Setiap strategi punya cara membangun URL proxy sendiri dan cara
        // membaca hasilnya sendiri (beberapa proxy membungkus respons asli
        // di dalam field JSON seperti "contents").
        const proxyStrategies = [
            ...(CUSTOM_PROXY_URL ? [{
                name: 'Proxy Pribadi',
                build: (url) => `${CUSTOM_PROXY_URL}${encodeURIComponent(url)}`,
                parse: (res) => res.json()
            }] : []),
            {
                name: 'Corsfix',
                build: (url) => `https://proxy.corsfix.com/?${url}`,
                parse: (res) => res.json()
            },
            {
                name: 'CodeTabs',
                build: (url) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
                parse: (res) => res.json()
            },
            {
                name: 'AllOrigins (get)',
                build: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                parse: async (res) => {
                    const wrapper = await res.json();
                    return JSON.parse(wrapper.contents);
                }
            },
            {
                name: 'AllOrigins (raw)',
                build: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                parse: (res) => res.json()
            },
            {
                name: 'CorsProxy.io',
                build: (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
                parse: (res) => res.json()
            },
            {
                name: 'x2u CORS',
                build: (url) => `https://cors.x2u.in/${url}`,
                parse: (res) => res.json()
            },
            {
                name: 'Langsung (tanpa proxy)',
                build: (url) => url,
                parse: (res) => res.json()
            }
        ];

        function fetchWithTimeout(url, timeoutMs) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
        }

        // N2YO TIDAK menyediakan kecepatan satelit secara langsung di endpoint
        // "positions". Kecepatan di sini dihitung sendiri dari data REAL yang
        // dikirim N2YO: jarak tempuh antara 2 titik posisi berurutan (yang
        // benar-benar dihitung N2YO dari TLE terbaru), dibagi selisih waktunya.
        // Ini bukan data sintetik/rekaan — murni turunan matematis dari data asli.
        function haversineDistanceKm(lat1, lon1, lat2, lon2, radiusKm) {
            const toRad = (d) => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon / 2) ** 2;
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return radiusKm * c;
        }

        function computeSpeedKmh(positions) {
            if (!Array.isArray(positions) || positions.length < 2) return null;
            const p0 = positions[0];
            const p1 = positions[1];
            const dt = p1.timestamp - p0.timestamp; // detik
            if (!dt || dt <= 0) return null;

            const avgAlt = ((p0.sataltitude || 0) + (p1.sataltitude || 0)) / 2;
            const orbitRadiusKm = 6371 + avgAlt; // jari-jari bumi + ketinggian orbit
            const groundDist = haversineDistanceKm(p0.satlatitude, p0.satlongitude, p1.satlatitude, p1.satlongitude, orbitRadiusKm);
            const altDiff = (p1.sataltitude || 0) - (p0.sataltitude || 0);
            const totalDistKm = Math.sqrt(groundDist ** 2 + altDiff ** 2);

            return (totalDistKm / dt) * 3600; // km/jam
        }

        async function aggressiveFetch(targetUrl) {
            let lastError = new Error('Semua metode koneksi gagal!');

            for (const strategy of proxyStrategies) {
                const proxyUrl = strategy.build(targetUrl);

                try {
                    document.getElementById('loaderText').innerText = `Mencoba ${strategy.name}...`;
                    setStatus('retrying', strategy.name);
                    addLog(`Mencoba koneksi via ${strategy.name}...`);

                    const response = await fetchWithTimeout(proxyUrl, FETCH_TIMEOUT_MS);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await strategy.parse(response);

                    if (data && data.error) {
                        // N2YO mengembalikan HTTP 200 tapi berisi pesan error
                        // (misal API key tidak valid / kuota habis)
                        throw new Error(`API N2YO: ${typeof data.error === 'string' ? data.error : JSON.stringify(data.error)}`);
                    }
                    if (!data || !Array.isArray(data.positions) || data.positions.length === 0) {
                        throw new Error('Format respons tidak dikenali (bukan data satelit)');
                    }
                    // Catatan: endpoint "positions" N2YO TIDAK menyediakan field
                    // kecepatan (satvelocity) sama sekali — hanya field di bawah ini
                    // yang benar-benar ada, jadi validasi hanya untuk field yang nyata.
                    const isValidPoint = (p) =>
                        typeof p.satlatitude === 'number' && Number.isFinite(p.satlatitude) &&
                        typeof p.satlongitude === 'number' && Number.isFinite(p.satlongitude) &&
                        typeof p.sataltitude === 'number' && Number.isFinite(p.sataltitude);

                    const validPositions = data.positions.filter(isValidPoint);
                    if (validPositions.length === 0) {
                        throw new Error('Tidak ada titik posisi valid dalam respons (semua field kosong/rusak)');
                    }
                    // Pakai hanya titik-titik yang valid untuk sisa aplikasi,
                    // supaya satu titik rusak tidak bisa merusak seluruh render peta.
                    data.positions = validPositions;

                    addLog(`✅ Sukses via ${strategy.name}!`);
                    return data;

                } catch (error) {
                    const msg = error.name === 'AbortError' ? `Timeout (>${FETCH_TIMEOUT_MS / 1000}s)` : error.message;
                    addLog(`❌ Gagal via ${strategy.name}: ${msg}`, true);
                    lastError = new Error(`${strategy.name}: ${msg}`);
                    // Lanjut ke strategi berikutnya
                }
            }
            throw lastError;
        }

        async function fetchSatelliteData() {
            if (isFetching) return;
            isFetching = true;
            if (retryTimeoutId) { clearTimeout(retryTimeoutId); retryTimeoutId = null; }

            const currentSatId = document.getElementById('satSelect').value;
            const targetUrl = `https://api.n2yo.com/rest/v1/satellite/positions/${currentSatId}/${MY_LAT}/${MY_LNG}/0/${SECONDS}/&apiKey=${API_KEY}`;

            document.getElementById('loader').style.display = 'block';

            try {
                const data = await aggressiveFetch(targetUrl);

                // Data dari server sudah valid di titik ini — tandai koneksi
                // sukses SEKARANG, sebelum menyentuh DOM/peta. Dengan begini,
                // kalau ada masalah saat merender (mis. isu Leaflet), itu tidak
                // akan dianggap sebagai kegagalan koneksi dan memicu retry.
                lastUpdateTime = new Date();
                consecutiveFailures = 0;
                setStatus('live');
                updateLastUpdateLabel();

                try {
                    const pos = data.positions[0];
                    const lat = pos.satlatitude;
                    const lng = pos.satlongitude;
                    const alt = pos.sataltitude;
                    const speed = computeSpeedKmh(data.positions); // dihitung dari data real, N2YO tidak menyediakan field ini langsung

                    document.getElementById('satAltitude').innerText = `${alt.toFixed(2)} km`;
                    document.getElementById('satSpeed').innerText = (speed !== null) ? `${speed.toFixed(2)} km/j` : '- km/j';
                    document.getElementById('satCoords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;

                    satelliteMarker.setLatLng([lat, lng]);
                    if (!hasCenteredMap) {
                        map.setView([lat, lng], 4);
                        hasCenteredMap = true;
                    } else {
                        // Geser peta tanpa memaksa reset zoom tiap update,
                        // supaya tidak "kacau" saat pengguna sedang menjelajah peta.
                        map.panTo([lat, lng], { animate: true });
                    }

                    const pathCoords = data.positions.map(p => [p.satlatitude, p.satlongitude]);
                    pathLine.setLatLngs(pathCoords);

                    lastKnownGood = { lat, lng, alt, speed };
                } catch (renderError) {
                    // Data real sudah didapat & status sudah "live" — ini cuma
                    // gagal saat MENAMPILKAN, bukan gagal koneksi. Dicatat saja.
                    addLog(`⚠️ Data diterima, tapi gagal ditampilkan: ${renderError.message}`, true);
                }

            } catch (error) {
                consecutiveFailures++;
                addLog(`FATAL (percobaan ke-${consecutiveFailures}): ${error.message}`, true);
                setStatus('offline');
                // JANGAN tampilkan data sintetik/palsu — biarkan nilai terakhir
                // yang valid tetap tampil, tandai lewat status & waktu update.

                // Retry lebih agresif saat gagal total, dengan backoff bertahap,
                // dibatasi maksimum sama dengan interval normal.
                const delay = Math.min(4000 * consecutiveFailures, NORMAL_INTERVAL_MS);
                retryTimeoutId = setTimeout(fetchSatelliteData, delay);

            } finally {
                document.getElementById('loader').style.display = 'none';
                isFetching = false;
            }
        }

        async function runNetworkSelfTest() {
            // Endpoint publik yang dipastikan mendukung CORS (Access-Control-Allow-Origin: *).
            // Kalau permintaan LANGSUNG ke sini saja sudah gagal, berarti masalahnya
            // BUKAN di proxy/N2YO, tapi di level browser/jaringan/hosting halaman ini
            // (misalnya dibuka sebagai file lokal / file://, atau diblokir firewall).
            try {
                const res = await fetchWithTimeout('https://api.github.com', 8000);
                if (res.ok) {
                    addLog('🧪 Tes jaringan: OK — koneksi internet & fetch() browser berfungsi normal.');
                    return true;
                }
                addLog(`🧪 Tes jaringan: respons tidak normal (HTTP ${res.status}).`, true);
                return false;
            } catch (err) {
                const reason = err.name === 'AbortError' ? 'timeout' : err.message;
                addLog(`🧪 Tes jaringan: GAGAL (${reason}). Kemungkinan halaman ini dibuka sebagai file lokal (file://), tidak ada internet, atau ada firewall/ekstensi yang memblokir fetch().`, true);
                return false;
            }
        }

        const SCRIPT_VERSION = '2026-08-15-r3 (fix: kecepatan dihitung real-time, filter posisi tidak valid)';

        // Inisialisasi
        addLog(`🔖 Versi skrip: ${SCRIPT_VERSION}`);
        addLog('Aplikasi dimulai. Menyiapkan terobosan CORS multi-layer...');
        addLog('ℹ️ N2YO tidak menyediakan field kecepatan langsung; kecepatan dihitung dari selisih 2 titik posisi real-time.');
        updateLastUpdateLabel();
        runNetworkSelfTest();
        fetchSatelliteData();
        setInterval(fetchSatelliteData, NORMAL_INTERVAL_MS);
    </script>
</body>
</html>
