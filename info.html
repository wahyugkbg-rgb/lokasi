<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ BNPB Data Hub - Futuristik</title>
    <style>
        /* ==============================
           STYLE FUTURISTIK NEON & GLASSMORPHISM
           ============================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 20%, #0b0c1e, #05060f);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Animasi background bergerak perlahan */
            animation: bgPulse 15s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* Kotak utama dengan efek kaca (Glassmorphism) */
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 35px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 180, 255, 0.05);
            transition: all 0.3s ease;
        }

        /* Header dengan gradien neon */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 0 15px #00e5ff);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00e5ff, #a855f7, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 200, 0.08);
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 200, 0.15);
            font-size: 0.75rem;
            color: #b0e0ff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 15px #22c55e;
            animation: dotPulse 1.5s infinite;
        }

        .status-dot.warning {
            background: #eab308;
            box-shadow: 0 0 15px #eab308;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Alat pencarian & refresh */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 12px 22px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .search-box:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 300;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #00e5ff, #0077ff);
            border: none;
            padding: 0 30px;
            border-radius: 60px;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.2);
        }

        .btn-refresh:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 35px rgba(0, 229, 255, 0.4);
        }

        .btn-refresh:active {
            transform: scale(0.95);
        }

        /* Info bar */
        .info-bar {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            border-left: 3px solid #00e5ff;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .info-bar strong {
            color: #fff;
        }

        /* Tabel Futuristik */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 600px;
        }

        thead {
            background: rgba(0, 229, 255, 0.06);
            border-bottom: 2px solid rgba(0, 229, 255, 0.15);
        }

        th {
            text-align: left;
            padding: 18px 20px;
            color: #a0d8ff;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 16px 20px;
            color: rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        tr {
            transition: 0.2s;
        }

        tbody tr:hover {
            background: rgba(0, 229, 255, 0.05);
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.02);
            transform: scale(1.002);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .badge-instansi {
            background: rgba(168, 85, 247, 0.15);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.1);
            display: inline-block;
        }

        .badge-tanggal {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.7rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 25px;
        }

        /* Loading state */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            gap: 15px;
            color: rgba(255, 255, 255, 0.5);
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(0, 229, 255, 0.1);
            border-top: 3px solid #00e5ff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Notifikasi */
        .notification {
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        .notif-info {
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.15);
            color: #a0f0ff;
        }

        .notif-warning {
            background: rgba(234, 179, 8, 0.08);
            border: 1px solid rgba(234, 179, 8, 0.15);
            color: #fde047;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 20px; }
            h1 { font-size: 1.4rem; }
            .header-left .logo-icon { font-size: 1.8rem; }
            .btn-refresh { padding: 0 20px; }
        }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <span class="logo-icon">🛰️</span>
            <h1>BNPB Data Hub</h1>
        </div>
        <div class="status-badge" id="statusBadge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Memuat...</span>
        </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Cari dataset berdasarkan nama..." oninput="filterTable()">
        <button class="btn-refresh" onclick="refreshData()">
            <span>⟳</span> Refresh Data
        </button>
    </div>

    <!-- NOTIFIKASI -->
    <div id="notificationArea"></div>

    <!-- TABEL DATA -->
    <div class="table-wrapper" id="tableWrapper">
        <div class="loader" id="loadingIndicator">
            <div class="spinner"></div>
            <span>Menghubungi server BNPB...</span>
        </div>
        <div id="tableContainer" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Dataset</th>
                        <th>Instansi</th>
                        <th>Terakhir Update</th>
                    </tr>
                </thead>
                <tbody id="dataBody">
                    <!-- Data akan diisi oleh JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        ⚡ Sumber: Satu Data Bencana Indonesia (data.bnpb.go.id) • Teknologi CORS Proxy & Fallback
    </div>
</div>

<script>
    // ============================================================
    // 1. DATA SIMULASI (FALLBACK) - TETAP TAMPIL MEWAH
    // ============================================================
    const sampleData = [
        { title: "Rekapitulasi Kejadian Bencana Alam 2025", org: "BNPB", date: "2026-02-10" },
        { title: "Peta Risiko Bencana Tsunami Wilayah Sumatera", org: "BNPB", date: "2026-01-28" },
        { title: "Data Korban Jiwa Gempa Bumi 2024-2025", org: "BNPB", date: "2026-01-15" },
        { title: "Inventarisasi Infrastruktur Terdampak Banjir", org: "Kementerian PUPR", date: "2025-12-20" },
        { title: "Status Siaga Darurat Bencana per Provinsi", org: "BNPB", date: "2025-12-10" },
        { title: "Data Pengungsi Akibat Bencana Hidrometeorologi", org: "BNPB", date: "2025-11-25" },
        { title: "Peta Kerentanan Sosial Ekonomi Bencana", org: "Bappenas", date: "2025-11-05" },
        { title: "Dokumen Rencana Kontinjensi Bencana 2026", org: "BNPB", date: "2025-10-18" },
        { title: "Data Kerusakan Rumah Akibat Gempa (per Kabupaten)", org: "BNPB", date: "2025-10-01" },
        { title: "Informasi Lokasi Titik Evakuasi Bencana", org: "BNPB", date: "2025-09-15" },
        { title: "Monitoring Debit Air Sungai & Potensi Banjir", org: "Kementerian PUPR", date: "2025-09-02" },
        { title: "Data Kejadian Kebakaran Hutan dan Lahan", org: "KLHK", date: "2025-08-20" },
    ];

    // ============================================================
    // 2. VARIABEL GLOBAL
    // ============================================================
    let currentData = []; // Menyimpan data yang sedang ditampilkan (asli atau sample)
    let isLiveData = false;

    // ============================================================
    // 3. FUNGSI UTAMA AMBIL DATA (DENGAN 2 PROXY + FALLBACK)
    // ============================================================
    async function fetchData() {
        // Tampilkan loading
        document.getElementById('loadingIndicator').style.display = 'flex';
        document.getElementById('tableContainer').style.display = 'none';
        clearNotification();

        const bnpbUrl = 'https://data.bnpb.go.id/api/3/action/package_search?q=*:*&rows=15&sort=metadata_modified desc';
        
        // Daftar proxy yang dicoba secara bergantian
        const proxies = [
            `https://corsproxy.io/?${encodeURIComponent(bnpbUrl)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(bnpbUrl)}`
        ];

        let lastError = null;

        for (let proxyUrl of proxies) {
            try {
                const response = await fetch(proxyUrl, {
                    signal: AbortSignal.timeout(8000) // Timeout 8 detik
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const json = await response.json();
                
                // Validasi struktur data BNPB
                if (json && json.result && json.result.results && json.result.results.length > 0) {
                    // Data asli ditemukan!
                    const raw = json.result.results;
                    const mapped = raw.map(item => ({
                        title: item.title || 'Tanpa Judul',
                        org: item.organization ? item.organization.title : 'BNPB',
                        date: item.metadata_modified ? item.metadata_modified.split('T')[0] : '-'
                    }));
                    currentData = mapped;
                    isLiveData = true;
                    renderTable(mapped);
                    setStatus('live', 'Data Langsung dari BNPB');
                    showNotification('✅ Berhasil mengambil data real-time dari server BNPB!', 'info');
                    return; // Keluar dari fungsi karena berhasil
                }

            } catch (err) {
                lastError = err;
                console.warn('Proxy gagal:', proxyUrl, err.message);
                // Lanjut ke proxy berikutnya
            }
        }

        // ============================================================
        // Jika semua proxy gagal, GUNAKAN DATA SIMULASI (FALLBACK)
        // ============================================================
        console.warn('Semua proxy gagal, menggunakan data simulasi.', lastError);
        currentData = sampleData;
        isLiveData = false;
        renderTable(sampleData);
        setStatus('warning', 'Mode Simulasi (Offline)');
        showNotification('⚠️ Gagal terhubung ke server BNPB. Menampilkan data simulasi. Klik "Refresh Data" untuk mencoba lagi.', 'warning');
    }

    // ============================================================
    // 4. RENDER TABEL
    // ============================================================
    function renderTable(dataArray) {
        const tbody = document.getElementById('dataBody');
        if (!dataArray || dataArray.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 40px; color: #666;">Tidak ada data ditemukan.</td></tr>`;
        } else {
            let html = '';
            dataArray.forEach((item, index) => {
                const title = item.title || 'Tidak ada judul';
                const org = item.org || 'BNPB';
                const date = item.date || '-';
                html += `
                    <tr>
                        <td style="font-weight:600; color:rgba(255,255,255,0.3);">${String(index + 1).padStart(2, '0')}</td>
                        <td><strong>${title}</strong></td>
                        <td><span class="badge-instansi">${org}</span></td>
                        <td class="badge-tanggal">${date}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // Sembunyikan loader, tampilkan tabel
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('tableContainer').style.display = 'block';
    }

    // ============================================================
    // 5. FUNGSI FILTER PENCARIAN
    // ============================================================
    function filterTable() {
        const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
        let filtered = [];
        
        if (keyword === '') {
            filtered = currentData;
        } else {
            filtered = currentData.filter(item => 
                (item.title || '').toLowerCase().includes(keyword) || 
                (item.org || '').toLowerCase().includes(keyword)
            );
        }
        renderTable(filtered);
    }

    // ============================================================
    // 6. FUNGSI REFRESH
    // ============================================================
    async function refreshData() {
        document.getElementById('searchInput').value = '';
        await fetchData();
    }

    // ============================================================
    // 7. UI HELPERS (Status, Notifikasi)
    // ============================================================
    function setStatus(type, text) {
        const dot = document.getElementById('statusDot');
        const txt = document.getElementById('statusText');
        txt.textContent = text;
        if (type === 'live') {
            dot.className = 'status-dot';
        } else {
            dot.className = 'status-dot warning';
        }
    }

    function showNotification(msg, type = 'info') {
        const area = document.getElementById('notificationArea');
        const className = type === 'info' ? 'notif-info' : 'notif-warning';
        area.innerHTML = `<div class="notification ${className}">${msg}</div>`;
    }

    function clearNotification() {
        document.getElementById('notificationArea').innerHTML = '';
    }

    // ============================================================
    // 8. JALANKAN SAAT HALAMAN DIMUAT
    // ============================================================
    window.onload = function() {
        fetchData();
    };

    // Ekspos fungsi filter ke global untuk HTML onclick/oninput
    window.filterTable = filterTable;
    window.refreshData = refreshData;

</script>

</body>
</html>
