<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔥 Dashboard Pemantauan Kebakaran Nasional - Real Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <style>
        :root {
            --bg-body-1: #fff9ef;
            --bg-body-2: #fef3e0;
            --surface: #ffffff;
            --surface-alt: #fff8ec;
            --border: #ecdfc3;
            --border-soft: #f4ead2;
            --ink: #241c10;
            --ink-soft: #5b5240;
            --ink-muted: #8a806c;
            --gold: #b4720f;
            --gold-light: #e8a53b;
            --gold-deep: #8a560a;
            --fire: #d6421f;
            --fire-2: #f2761f;
            --success: #17874a;
            --success-bg: #e8f8ef;
            --danger: #c22626;
            --danger-bg: #fdecec;
            --info: #1d5fbf;
            --info-bg: #eaf2fd;
            --shadow-sm: 0 1px 3px rgba(120, 72, 8, 0.08);
            --shadow-md: 0 6px 20px rgba(120, 72, 8, 0.10);
            --shadow-lg: 0 14px 38px rgba(120, 72, 8, 0.16);
            --radius: 14px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
        }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, var(--bg-body-1) 0%, var(--bg-body-2) 45%, #fff 100%);
            color: var(--ink);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: appFadeIn 0.5s ease both;
        }
        @keyframes appFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        ::selection {
            background: var(--gold-light);
            color: #241c10;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(120deg, #2a1608 0%, #4a2210 35%, #7a3510 70%, #a8480f 100%);
            background-size: 220% 220%;
            animation: headerShimmer 12s ease infinite;
            padding: 12px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold-light);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 20;
        }
        @keyframes headerShimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff8ec;
        }
        .header h1 .flame {
            display: inline-block;
            animation: flameFlicker 2.4s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 160, 60, 0.8));
        }
        @keyframes flameFlicker {
            0%,
            100% {
                transform: scale(1) rotate(-2deg);
            }
            25% {
                transform: scale(1.08) rotate(2deg);
            }
            50% {
                transform: scale(0.96) rotate(-1deg);
            }
            75% {
                transform: scale(1.05) rotate(1deg);
            }
        }
        .header h1 span.brand {
            background: linear-gradient(90deg, #ffd489, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 13px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff3e0;
            font-weight: 600;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
        .last-update {
            color: #f1dcbf;
            font-weight: 500;
        }
        .limit-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 3px 10px 3px 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .limit-control label {
            color: #f1dcbf;
            font-weight: 500;
            font-size: 12px;
        }
        .limit-control select {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 4px 6px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .limit-control select option {
            background: #3a1f0e;
            color: #fff;
        }
        .btn-refresh {
            background: linear-gradient(120deg, var(--fire-2), var(--gold));
            border: none;
            color: #fff;
            padding: 7px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 12px rgba(180, 80, 10, 0.35);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }
        .btn-refresh:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(180, 80, 10, 0.45);
            filter: brightness(1.06);
        }
        .btn-refresh:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-refresh:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .btn-refresh.spinning::before {
            content: '⟳ ';
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== MAIN LAYOUT ===== */
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .map-container {
            flex: 1;
            position: relative;
            background: var(--surface-alt);
        }
        #map {
            width: 100%;
            height: 100%;
            background: var(--surface-alt);
        }
        .map-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            box-shadow: inset 0 0 40px rgba(120, 72, 8, 0.08);
            z-index: 5;
        }

        /* ===== LEGEND ===== */
        .map-legend {
            position: absolute;
            bottom: 30px;
            right: 12px;
            background: rgba(255, 251, 240, 0.92);
            backdrop-filter: blur(6px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: var(--shadow-md);
            z-index: 10;
            font-size: 12px;
            min-width: 170px;
            pointer-events: none;
        }
        .map-legend .legend-title {
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 6px;
            font-size: 12px;
            letter-spacing: 0.3px;
        }
        .map-legend .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            color: var(--ink-soft);
        }
        .map-legend .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.7);
            flex-shrink: 0;
        }
        .map-legend .legend-dot.square {
            border-radius: 3px;
            width: 14px;
            height: 14px;
        }
        .map-legend .legend-label {
            font-weight: 500;
            font-size: 11.5px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 420px;
            min-width: 340px;
            max-width: 45vw;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: -8px 0 24px rgba(120, 72, 8, 0.06);
        }
        .sidebar-tabs {
            display: flex;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-tabs button {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--ink-muted);
            padding: 10px 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .sidebar-tabs button.active {
            color: var(--gold-deep);
            border-bottom-color: var(--fire-2);
            background: var(--surface);
        }
        .sidebar-tabs button:hover {
            background: #fff2da;
            color: var(--gold-deep);
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
        }
        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar-content::-webkit-scrollbar-track {
            background: var(--surface-alt);
        }
        .sidebar-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        .sidebar-content::-webkit-scrollbar-thumb:hover {
            background: var(--gold-light);
        }

        /* ===== EVENT CARD ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .event-item {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-left-width: 5px;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
            cursor: default;
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.35s ease both;
        }
        .event-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .event-item .title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--ink);
            font-family: 'Poppins', sans-serif;
        }
        .event-item .meta {
            font-size: 12px;
            color: var(--ink-muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }
        .event-item .meta .loc {
            color: var(--info);
            font-weight: 600;
        }
        .event-item .meta .time {
            color: #7c4fbf;
            font-weight: 500;
        }
        .event-item .meta .source {
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 10.5px;
        }
        .event-item .meta .source-bnpb {
            color: #b45309;
            background: #fef3c7;
        }
        .event-item .meta .source-bmkg {
            color: #1d5fbf;
            background: #eaf2fd;
        }
        .event-item .meta .source-nasa {
            color: #8b2f97;
            background: #f3e8f7;
        }
        .event-item .meta .source-gfw {
            color: #0b7a4b;
            background: #e6f7ed;
        }
        .event-item .meta .source-bnpb-kej {
            color: #b45309;
            background: #fef3c7;
        }
        .event-item .meta .source-other {
            color: var(--ink-muted);
            background: var(--surface-alt);
        }
        .event-item .badge-provinsi {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(120deg, var(--fire), var(--fire-2));
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(214, 66, 31, 0.3);
        }
        .event-item .badge-kabkota {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--info-bg);
            color: var(--info);
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 700;
        }
        .event-item .badge-conf {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 700;
        }
        .event-item .badge-unknown {
            display: inline-flex;
            align-items: center;
            font-style: italic;
            color: var(--ink-muted);
            font-size: 10.5px;
        }
        .event-item .desc {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 6px;
            line-height: 1.5;
            background: var(--surface-alt);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-soft);
        }
        .event-item .catatan {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 6px;
            line-height: 1.5;
        }
        .event-item .catatan b {
            color: var(--gold-deep);
        }
        .event-item .detail-bnpb {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 4px;
            background: #fef9ee;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #f4e8d0;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
        }
        .event-item .detail-bnpb .bnpb-item {
            display: flex;
            align-items: baseline;
            gap: 3px;
        }
        .event-item .detail-bnpb .bnpb-item .bnpb-label {
            font-weight: 600;
            color: var(--ink-muted);
            font-size: 11px;
        }
        .event-item .detail-bnpb .bnpb-item .bnpb-value {
            font-weight: 700;
            color: var(--ink);
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--ink-muted);
        }
        .empty-state .emoji {
            font-size: 38px;
            display: block;
            margin-bottom: 12px;
            animation: flameFlicker 2.4s ease-in-out infinite;
        }
        .empty-state p {
            font-weight: 500;
        }

        /* ===== REKAP ===== */
        .rekap-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.4s ease both;
            transition: box-shadow 0.18s ease, transform 0.18s ease;
        }
        .rekap-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .rekap-card .rekap-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .rekap-card .rekap-prov {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rekap-card .rekap-total {
            font-weight: 800;
            font-size: 14px;
            color: #fff;
            background: linear-gradient(120deg, var(--fire), var(--gold));
            padding: 2px 10px;
            border-radius: 14px;
        }
        .rekap-bar-track {
            background: var(--surface-alt);
            height: 8px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--border-soft);
            margin-bottom: 8px;
        }
        .rekap-bar-fill {
            height: 100%;
            border-radius: 5px;
            background: linear-gradient(90deg, var(--gold-light), var(--fire-2));
            width: 0%;
            transition: width 0.9s cubic-bezier(.22, .9, .3, 1.4);
        }
        .rekap-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 4px;
        }
        .rekap-chip {
            background: var(--surface-alt);
            border: 1px solid var(--border-soft);
            color: var(--ink-soft);
            font-size: 10.5px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 8px;
        }
        .rekap-src-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--ink-muted);
            padding: 2px 0;
        }
        .rekap-label {
            font-size: 10.5px;
            font-weight: 700;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin: 8px 0 3px;
        }

        /* ===== LOG ===== */
        .log-container {
            background: #221709;
            border-top: 2px solid var(--gold-light);
            max-height: 110px;
            overflow-y: auto;
            padding: 6px 14px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: #d8c9a8;
            flex-shrink: 0;
        }
        .log-container::-webkit-scrollbar {
            width: 4px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #4a3210;
            border-radius: 10px;
        }
        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #33240e;
            animation: fadeInUp 0.25s ease both;
        }
        .log-entry .log-time {
            color: #a08757;
            margin-right: 10px;
        }
        .log-entry .log-ok {
            color: #6ee79a;
        }
        .log-entry .log-err {
            color: #ff8a7a;
        }
        .log-entry .log-info {
            color: #7cb8ff;
        }

        @media (max-width: 820px) {
            .sidebar {
                width: 100%;
                min-width: unset;
                max-width: 100%;
                border-left: none;
                border-top: 1px solid var(--border);
                max-height: 48vh;
            }
            .main {
                flex-direction: column-reverse;
            }
            .header h1 {
                font-size: 17px;
            }
            .header-right {
                font-size: 12px;
            }
            .limit-control {
                padding: 2px 8px 2px 10px;
            }
            .limit-control select {
                font-size: 12px;
                padding: 2px 4px;
            }
            .map-legend {
                bottom: 14px;
                right: 8px;
                padding: 8px 10px;
                font-size: 10.5px;
                min-width: 140px;
            }
        }
        @media (max-width: 480px) {
            .header {
                padding: 8px 10px;
            }
            .header h1 {
                font-size: 14px;
            }
            .btn-refresh {
                padding: 4px 11px;
                font-size: 11px;
            }
            .sidebar-content {
                padding: 8px 8px;
            }
            .event-item {
                padding: 10px 10px;
            }
            .map-legend {
                display: none;
            }
            .header-right .limit-control label {
                display: none;
            }
        }

        .leaflet-control-attribution {
            background: rgba(255, 251, 240, 0.9) !important;
            color: var(--ink-muted) !important;
            font-size: 10px !important;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px !important;
            box-shadow: var(--shadow-lg) !important;
        }
        .leaflet-popup-content {
            color: var(--ink);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            line-height: 1.55;
            min-width: 200px;
        }
        .leaflet-popup-content strong {
            color: var(--fire);
            font-family: 'Poppins', sans-serif;
        }
        .leaflet-popup-content .provinsi-popup {
            font-weight: 700;
            color: var(--gold-deep);
        }
        .leaflet-popup-content .catatan-popup {
            display: block;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px dashed var(--border);
            color: var(--ink-soft);
            font-size: 11.5px;
        }
        .leaflet-popup-content .src-badge-popup {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1><span class="flame">🔥</span> <span class="brand">Pantau</span>&nbsp;Kebakaran Nasional</h1>
        <div class="header-right">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText">Aktif</span>
            </div>
            <span class="last-update" id="lastUpdateLabel">⏱️ --:--:--</span>
            <div class="limit-control">
                <label for="limitSelect">📋</label>
                <select id="limitSelect">
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200" selected>200</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                    <option value="all">ALL</option>
                </select>
            </div>
            <button class="btn-refresh" id="refreshBtn">⟳ Refresh</button>
        </div>
    </header>

    <div class="main">
        <div class="map-container">
            <div id="map"></div>
            <!-- Legend -->
            <div class="map-legend" id="mapLegend">
                <div class="legend-title">📌 Sumber Data</div>
                <div class="legend-row"><span class="legend-dot" style="background:#b45309;"></span><span class="legend-label">BNPB Karhutla</span></div>
                <div class="legend-row"><span class="legend-dot" style="background:#1d5fbf;"></span><span class="legend-label">BMKG Hotspot</span></div>
                <div class="legend-row"><span class="legend-dot" style="background:#8b2f97;"></span><span class="legend-label">NASA FIRMS</span></div>
                <div class="legend-row"><span class="legend-dot" style="background:#0b7a4b;"></span><span class="legend-label">GFW GLAD</span></div>
                <div class="legend-row"><span class="legend-dot" style="background:#c07a1a;"></span><span class="legend-label">BNPB Kejadian</span></div>
            </div>
        </div>
        <div class="sidebar">
            <div class="sidebar-tabs">
                <button class="active" data-tab="list">📋 Daftar Kejadian</button>
                <button data-tab="rekap">🗂️ Rekap Wilayah</button>
                <button data-tab="stats">📊 Statistik</button>
            </div>
            <div class="sidebar-content" id="sidebarContent"></div>
        </div>
    </div>

    <div class="log-container" id="logContainer">
        <div class="log-entry"><span class="log-time">[INIT]</span> <span class="log-info">Dashboard siap. Mengambil data dari berbagai sumber online...</span></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const mapElement = document.getElementById('map');
            const sidebarContent = document.getElementById('sidebarContent');
            const logContainer = document.getElementById('logContainer');
            const statusText = document.getElementById('statusText');
            const lastUpdateLabel = document.getElementById('lastUpdateLabel');
            const refreshBtn = document.getElementById('refreshBtn');
            const limitSelect = document.getElementById('limitSelect');

            // ---------- Leaflet map ----------
            const map = L.map(mapElement, {
                center: [-2.5, 118.0],
                zoom: 5,
                zoomControl: true,
                fadeAnimation: true,
                attributionControl: true
            });
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
                subdomains: 'abcd',
                maxZoom: 19,
                minZoom: 3
            }).addTo(map);
            const markerGroup = L.layerGroup().addTo(map);

            // ---------- state ----------
            let allEvents = [];
            let currentTab = 'list';
            let isRefreshing = false;

            // ---------- helpers ----------
            function logMessage(msg, type = 'info') {
                const time = new Date().toLocaleTimeString('id-ID');
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                let cls = 'log-info';
                if (type === 'ok') cls = 'log-ok';
                else if (type === 'err') cls = 'log-err';
                entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span>`;
                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
                while (logContainer.children.length > 80) logContainer.removeChild(logContainer.firstChild);
            }

            function setStatus(online, msg) {
                const dot = document.querySelector('.status-dot');
                if (online) { dot.style.background = '#4ade80';
                    statusText.textContent = msg || 'Aktif'; } else { dot.style.background = '#f87171';
                    statusText.textContent = msg || 'Gangguan'; }
            }

            function updateTimestamp() {
                lastUpdateLabel.textContent = '⏱️ ' + new Date().toLocaleTimeString('id-ID');
            }

            function escHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function getLimit() {
                const val = limitSelect.value;
                if (val === 'all') return 999999;
                return parseInt(val, 10) || 200;
            }

            // ---------- Provinsi BBOX (offline fallback) ----------
            const PROVINCE_BBOX = [
                { name: 'DKI Jakarta', latMin: -6.40, latMax: -5.90, lngMin: 106.65, lngMax: 107.05 },
                { name: 'DI Yogyakarta', latMin: -8.30, latMax: -7.50, lngMin: 110.00, lngMax: 110.80 },
                { name: 'Gorontalo', latMin: 0.00, latMax: 1.20, lngMin: 121.00, lngMax: 123.70 },
                { name: 'Banten', latMin: -7.10, latMax: -5.70, lngMin: 105.00, lngMax: 106.65 },
                { name: 'Bali', latMin: -8.90, latMax: -8.00, lngMin: 114.40, lngMax: 115.80 },
                { name: 'Kepulauan Bangka Belitung', latMin: -4.00, latMax: -1.00, lngMin: 105.50, lngMax: 108.50 },
                { name: 'Kepulauan Riau', latMin: -1.00, latMax: 5.00, lngMin: 103.30, lngMax: 109.70 },
                { name: 'Aceh', latMin: 2.00, latMax: 6.00, lngMin: 95.00, lngMax: 98.30 },
                { name: 'Sumatera Utara', latMin: -0.50, latMax: 4.50, lngMin: 97.00, lngMax: 100.50 },
                { name: 'Sumatera Barat', latMin: -3.50, latMax: 0.50, lngMin: 98.50, lngMax: 101.80 },
                { name: 'Riau', latMin: -1.50, latMax: 2.50, lngMin: 100.00, lngMax: 103.30 },
                { name: 'Jambi', latMin: -3.00, latMax: 0.50, lngMin: 101.00, lngMax: 104.50 },
                { name: 'Sumatera Selatan', latMin: -5.00, latMax: -1.00, lngMin: 102.00, lngMax: 106.00 },
                { name: 'Bengkulu', latMin: -5.50, latMax: -2.00, lngMin: 101.00, lngMax: 103.50 },
                { name: 'Lampung', latMin: -6.00, latMax: -3.40, lngMin: 103.50, lngMax: 106.00 },
                { name: 'Jawa Barat', latMin: -7.80, latMax: -5.90, lngMin: 106.00, lngMax: 108.90 },
                { name: 'Jawa Tengah', latMin: -8.20, latMax: -5.90, lngMin: 108.50, lngMax: 111.50 },
                { name: 'Jawa Timur', latMin: -8.80, latMax: -5.50, lngMin: 111.00, lngMax: 114.50 },
                { name: 'Nusa Tenggara Barat', latMin: -9.20, latMax: -8.00, lngMin: 115.80, lngMax: 119.40 },
                { name: 'Nusa Tenggara Timur', latMin: -11.00, latMax: -8.00, lngMin: 118.90, lngMax: 125.50 },
                { name: 'Kalimantan Barat', latMin: -3.20, latMax: 2.00, lngMin: 108.00, lngMax: 112.00 },
                { name: 'Kalimantan Tengah', latMin: -4.00, latMax: 0.50, lngMin: 110.80, lngMax: 115.50 },
                { name: 'Kalimantan Selatan', latMin: -4.50, latMax: -1.00, lngMin: 114.30, lngMax: 116.50 },
                { name: 'Kalimantan Utara', latMin: 1.50, latMax: 4.50, lngMin: 115.00, lngMax: 118.50 },
                { name: 'Kalimantan Timur', latMin: -3.00, latMax: 3.00, lngMin: 115.00, lngMax: 119.50 },
                { name: 'Sulawesi Utara', latMin: 0.00, latMax: 5.50, lngMin: 122.50, lngMax: 127.00 },
                { name: 'Sulawesi Tengah', latMin: -3.50, latMax: 1.50, lngMin: 119.00, lngMax: 124.50 },
                { name: 'Sulawesi Barat', latMin: -3.70, latMax: -0.50, lngMin: 118.50, lngMax: 119.80 },
                { name: 'Sulawesi Selatan', latMin: -8.00, latMax: -1.80, lngMin: 118.50, lngMax: 121.80 },
                { name: 'Sulawesi Tenggara', latMin: -6.20, latMax: -2.80, lngMin: 120.50, lngMax: 124.00 },
                { name: 'Maluku Utara', latMin: -1.00, latMax: 3.50, lngMin: 124.00, lngMax: 129.50 },
                { name: 'Maluku', latMin: -8.50, latMax: -2.00, lngMin: 125.50, lngMax: 135.00 },
                { name: 'Papua Barat', latMin: -4.50, latMax: 0.50, lngMin: 130.00, lngMax: 135.50 },
                { name: 'Papua', latMin: -9.50, latMax: -1.50, lngMin: 134.00, lngMax: 141.50 }
            ];

            function estimateProvinceFromCoords(lat, lng) {
                if (isNaN(lat) || isNaN(lng)) return '';
                for (const p of PROVINCE_BBOX) {
                    if (lat >= p.latMin && lat <= p.latMax && lng >= p.lngMin && lng <= p.lngMax) return p.name;
                }
                return '';
            }

            // ---------- Wilayah Indonesia API ----------
            const WILAYAH_API_BASE = 'https://ihsaninh.github.io/wilayah-indonesia';
            let regencyProvinceMap = {};
            let regencyMapReady = false;
            let regencyMapPromise = null;

            function normalizeRegencyName(str) {
                if (!str) return '';
                return String(str)
                    .toUpperCase()
                    .replace(/^KABUPATEN\s+ADM\.?\s+/, '')
                    .replace(/^KAB\.?\s+ADM\.?\s+/, '')
                    .replace(/^KOTA\s+ADM\.?\s+/, '')
                    .replace(/^KABUPATEN\s+/, '')
                    .replace(/^KAB\.?\s+/, '')
                    .replace(/^KOTA\s+/, '')
                    .replace(/^ADMINISTRASI\s+/, '')
                    .replace(/[^A-Z\s]/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            async function loadRegencyProvinceMap() {
                if (regencyMapPromise) return regencyMapPromise;
                regencyMapPromise = (async () => {
                    try {
                        logMessage('📡 Memuat basis data wilayah (ihsaninh/wilayah-indonesia)...', 'info');
                        const provResp = await fetchWithProxy(`${WILAYAH_API_BASE}/provinces.json`, { headers: { 'Accept': 'application/json' } });
                        if (!provResp.ok) throw new Error(`HTTP ${provResp.status}`);
                        const provinces = await provResp.json();
                        if (!Array.isArray(provinces) || provinces.length === 0) throw new Error('Format provinces.json tidak sesuai / kosong');

                        const regencyResults = await Promise.allSettled(
                            provinces.map(async (p) => {
                                const pid = p.id;
                                const pname = (p.value || p.name || '').toString().trim();
                                const url = `${WILAYAH_API_BASE}/${pid}/regencies.json`;
                                const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                                const regs = await resp.json();
                                return { pname, regs: Array.isArray(regs) ? regs : [] };
                            })
                        );

                        const newMap = {};
                        let totalRegency = 0;
                        let provinceOk = 0;
                        for (const r of regencyResults) {
                            if (r.status === 'fulfilled') {
                                provinceOk++;
                                const { pname, regs } = r.value;
                                if (!pname) continue;
                                for (const reg of regs) {
                                    const rawName = (reg.value || reg.name || '').toString().trim();
                                    if (!rawName) continue;
                                    const type = (reg.type || '').toString().trim();
                                    const keyBare = normalizeRegencyName(rawName);
                                    const keyWithType = normalizeRegencyName(`${type} ${rawName}`);
                                    if (keyBare) newMap[keyBare] = pname;
                                    if (keyWithType) newMap[keyWithType] = pname;
                                    totalRegency++;
                                }
                            }
                        }

                        if (totalRegency > 0) {
                            regencyProvinceMap = newMap;
                            regencyMapReady = true;
                            logMessage(`✅ Basis data wilayah dimuat: ${provinceOk}/${provinces.length} provinsi, ${totalRegency} kab/kota.`, 'ok');
                        } else {
                            throw new Error('Tidak ada data kab/kota yang berhasil dimuat');
                        }
                    } catch (e) {
                        regencyMapReady = false;
                        logMessage(`⚠️ Gagal memuat API wilayah-indonesia (${e.message}). Provinsi akan memakai data sumber asli / estimasi koordinat sebagai cadangan.`,
                        'err');
                    }
                })();
                return regencyMapPromise;
            }

            function resolveProvinceFromKabkota(kabkota) {
                if (!kabkota || !regencyMapReady) return '';
                const key = normalizeRegencyName(kabkota);
                if (!key) return '';
                if (regencyProvinceMap[key]) return regencyProvinceMap[key];
                let best = '';
                let bestLen = 0;
                for (const k in regencyProvinceMap) {
                    if (k.length < 4) continue;
                    if (key.includes(k) && k.length > bestLen) { best = regencyProvinceMap[k];
                        bestLen = k.length; } else if (k.includes(key) && key.length > bestLen) { best = regencyProvinceMap[k];
                        bestLen = key.length; }
                }
                return best;
            }

            // ---------- Dynamic description (exclude keys) ----------
            function isMeaningfulValue(v) {
                if (v === null || v === undefined) return false;
                const s = String(v).trim();
                if (s === '' || s === '-' || s === '0' || s.toLowerCase() === 'null' || s.toLowerCase() === 'nan' || s
                    .toLowerCase() === 'undefined') return false;
                return true;
            }

            function prettifyKey(key) {
                return String(key)
                    .replace(/_/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim()
                    .replace(/\b\w/g, c => c.toUpperCase());
            }

            function buildDynamicDescription(rec, excludeKeys = []) {
                if (!rec || typeof rec !== 'object') return '';
                const excl = new Set(['_id', 'id', 'latitude', 'longitude', 'lat', 'lon', 'lng']
                    .concat(excludeKeys.map(k => k.toLowerCase())));
                const parts = [];
                for (const [k, v] of Object.entries(rec)) {
                    if (excl.has(String(k).toLowerCase())) continue;
                    if (!isMeaningfulValue(v)) continue;
                    parts.push(`${prettifyKey(k)}: ${v}`);
                }
                return parts.join(' | ');
            }

            // ---------- Confidence ----------
            function getConfidenceInfo(conf) {
                if (conf === undefined || conf === null || conf === '' || conf === '-') return null;
                const num = parseFloat(conf);
                if (!isNaN(num) && String(conf).match(/^-?\d+(\.\d+)?$/)) {
                    if (num >= 80) return { label: 'Tinggi', cls: 'high', desc: 'Tingkat keyakinan deteksi tinggi — kemungkinan besar merupakan titik api aktif.' };
                    if (num >= 50) return { label: 'Sedang', cls: 'mid', desc: 'Tingkat keyakinan deteksi sedang — disarankan verifikasi lebih lanjut.' };
                    return { label: 'Rendah', cls: 'low', desc: 'Tingkat keyakinan deteksi rendah — berpotensi bukan titik api aktif (mis. panas dari objek lain).' };
                }
                const str = String(conf).toLowerCase();
                if (str.includes('high') || str === 'h') return { label: 'Tinggi', cls: 'high', desc: 'Tingkat keyakinan deteksi tinggi.' };
                if (str.includes('nominal') || str.includes('medium') || str === 'n') return { label: 'Sedang', cls: 'mid',
                    desc: 'Tingkat keyakinan deteksi sedang.' };
                if (str.includes('low') || str === 'l') return { label: 'Rendah', cls: 'low', desc: 'Tingkat keyakinan deteksi rendah.' };
                return { label: String(conf), cls: 'mid', desc: '' };
            }

            function confColor(cls) {
                if (cls === 'high') return { bg: 'var(--danger-bg)', fg: 'var(--danger)' };
                if (cls === 'low') return { bg: 'var(--info-bg)', fg: 'var(--info)' };
                return { bg: '#fff3d6', fg: 'var(--gold-deep)' };
            }

            // ---------- Catatan ----------
            function buildCatatan(ev) {
                const src = ev.source || '';
                if (src.includes('BNPB Open Data')) {
                    return 'Data resmi BNPB mencatat indikasi Kebakaran Hutan dan Lahan (Karhutla) di wilayah ini berdasarkan rekapitulasi bencana nasional.';
                }
                if (src.includes('BNPB Data Kejadian')) {
                    return 'Kejadian bencana tercatat langsung dalam basis data resmi Badan Nasional Penanggulangan Bencana (BNPB).';
                }
                if (src.includes('BMKG')) {
                    return 'Titik panas (hotspot) terdeteksi oleh satelit pemantau BMKG. Hotspot menandakan area dengan suhu permukaan tinggi yang berpotensi sebagai titik kebakaran hutan/lahan aktif, bukan kepastian mutlak.';
                }
                if (src.includes('NASA FIRMS')) {
                    return 'Titik panas terdeteksi oleh satelit MODIS (NASA FIRMS) melalui sensor termal. Data bersifat near real-time dan digunakan secara global untuk pemantauan kebakaran.';
                }
                if (src.includes('Global Forest Watch')) {
                    return 'Peringatan GLAD Alert dari Global Forest Watch mengindikasikan potensi hilangnya tutupan hutan, yang dapat disebabkan oleh kebakaran maupun pembukaan lahan.';
                }
                return 'Kejadian kebakaran terpantau dari sumber data terbuka.';
            }

            // ---------- Fetch with timeout ----------
            async function fetchWithTimeout(url, options = {}, timeout = 9000, retries = 0) {
                let lastError;
                for (let attempt = 0; attempt <= retries; attempt++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), timeout);
                        const response = await fetch(url, { ...options, signal: controller.signal });
                        clearTimeout(timeoutId);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response;
                    } catch (err) {
                        lastError = err;
                        if (attempt < retries) await new Promise(r => setTimeout(r, 500));
                    }
                }
                throw lastError;
            }

            const PROXIES = [
                'https://corsproxy.io/?',
                'https://api.allorigins.win/raw?url=',
                'https://api.codetabs.com/v1/proxy?quest='
            ];

            async function fetchWithProxy(url, options = {}) {
                for (const proxy of PROXIES) {
                    try {
                        const proxiedUrl = proxy + encodeURIComponent(url);
                        const resp = await fetchWithTimeout(proxiedUrl, options, 8000, 0);
                        if (resp.ok) return resp;
                    } catch (e) { /* lanjut */ }
                }
                return await fetchWithTimeout(url, options, 8000, 0);
            }

            // ---------- SOURCE MARKER COLORS ----------
            const SOURCE_COLORS = {
                'BNPB Open Data': '#b45309',
                'BMKG Hotspot': '#1d5fbf',
                'NASA FIRMS (MODIS)': '#8b2f97',
                'Global Forest Watch': '#0b7a4b',
                'BNPB Data Kejadian': '#c07a1a',
            };

            function getSourceColor(src) {
                for (const [key, color] of Object.entries(SOURCE_COLORS)) {
                    if (src && src.includes(key)) return color;
                }
                return '#b4720f';
            }

            function getSourceLabel(src) {
                if (!src) return 'other';
                if (src.includes('BNPB Open Data')) return 'bnpb';
                if (src.includes('BMKG')) return 'bmkg';
                if (src.includes('NASA')) return 'nasa';
                if (src.includes('Global Forest')) return 'gfw';
                if (src.includes('BNPB Data Kejadian')) return 'bnpb-kej';
                return 'other';
            }

            function getSourceBadgeClass(src) {
                const label = getSourceLabel(src);
                return `source-${label}`;
            }

            // ---------- Format BNPB detail dengan angka bulat ----------
            function formatBnpbDetail(rec) {
                if (!rec || typeof rec !== 'object') return null;
                const fields = [
                    { key: 'GELOMBANG PASANG DAN ABRASI', label: 'Gelombang Pasang & Abrasi' },
                    { key: 'KEBAKARAN HUTAN DAN LAHAN', label: 'Kebakaran Hutan & Lahan' },
                    { key: 'KEKERINGAN', label: 'Kekeringan' },
                    { key: 'TSUNAMI', label: 'Tsunami' },
                ];
                const parts = [];
                for (const f of fields) {
                    let val = rec[f.key];
                    if (val === undefined || val === null || val === '') continue;
                    // Ubah ke angka bulat
                    let num = parseFloat(val);
                    let display;
                    if (!isNaN(num)) {
                        display = String(Math.round(num));
                    } else {
                        display = String(val);
                    }
                    if (display === '0' || display === '-') display = '—';
                    parts.push({ label: f.label, value: display, raw: val });
                }
                return parts;
            }

            // ---------- RENDER: List ----------
            function renderList(events) {
                if (!events || events.length === 0) {
                    sidebarContent.innerHTML = `<div class="empty-state"><span class="emoji">🔍</span><p>Belum ada data kebakaran yang terpantau dari sumber online.</p><p style="font-size:12px;margin-top:6px;">Coba refresh atau periksa koneksi.</p></div>`;
                    return;
                }
                const sorted = [...events].sort((a, b) => (b.timestamp ? new Date(b.timestamp).getTime() : 0) - (a.timestamp ?
                    new Date(a.timestamp).getTime() : 0));
                let html = '';
                let i = 0;
                for (const ev of sorted) {
                    const confInfo = getConfidenceInfo(ev.confidence);
                    const confColors = confInfo ? confColor(confInfo.cls) : null;
                    const catatan = buildCatatan(ev);
                    const delay = Math.min(i, 25) * 0.025;
                    const srcColor = getSourceColor(ev.source);
                    const srcBadge = getSourceBadgeClass(ev.source);
                    const sourceLabel = ev.source || 'tidak diketahui';

                    // BNPB detail
                    let bnpbHtml = '';
                    if (ev._bnpbRaw) {
                        const parts = formatBnpbDetail(ev._bnpbRaw);
                        if (parts && parts.length > 0) {
                            bnpbHtml = `<div class="detail-bnpb">` +
                                parts.map(p =>
                                    `<span class="bnpb-item"><span class="bnpb-label">${escHtml(p.label)}</span> <span class="bnpb-value">${escHtml(p.value)}</span></span>`
                                ).join('') +
                                `</div>`;
                        }
                    }

                    // Lokasi: hanya sekali
                    const locationDisplay = ev.location || ev.kabkota || 'Lokasi tidak diketahui';

                    html += `
                        <div class="event-item" style="animation-delay:${delay}s;border-left-color:${srcColor};">
                            <div class="title">${escHtml(ev.title || 'Kejadian kebakaran')}</div>
                            <div class="meta">
                                <span class="loc">📍 ${escHtml(locationDisplay)}</span>
                                ${ev.province ? `<span class="badge-provinsi">🏛️ ${escHtml(ev.province)}</span>` : ''}
                                ${ev.kabkota && ev.kabkota !== locationDisplay ? `<span class="badge-kabkota">🏙️ ${escHtml(ev.kabkota)}</span>` : ''}
                                ${confInfo ? `<span class="badge-conf" style="background:${confColors.bg};color:${confColors.fg};">🎯 ${escHtml(confInfo.label)}</span>` : ''}
                            </div>
                            <div class="meta">
                                <span class="time">🕒 ${ev.timestamp ? new Date(ev.timestamp).toLocaleString('id-ID') : '--'}</span>
                                <span class="source ${srcBadge}">📡 ${escHtml(sourceLabel)}</span>
                            </div>
                            ${bnpbHtml}
                            <div class="catatan"><b>Catatan:</b> ${escHtml(catatan)}${confInfo && confInfo.desc ? ' ' + escHtml(confInfo.desc) : ''}</div>
                            ${ev.description ? `<div class="desc">${escHtml(ev.description)}</div>` : ''}
                        </div>
                    `;
                    i++;
                }
                sidebarContent.innerHTML = html;
            }

            // ---------- RENDER: Rekap ----------
            function renderRekap(events) {
                if (!events || events.length === 0) {
                    sidebarContent.innerHTML = `<div class="empty-state"><span class="emoji">🗂️</span><p>Belum ada data rekapitulasi wilayah.</p></div>`;
                    return;
                }
                const grouped = {};
                for (const ev of events) {
                    const prov = ev.province && ev.province.trim() ? ev.province.trim() : 'Provinsi belum teridentifikasi';
                    if (!grouped[prov]) grouped[prov] = { total: 0, kabkota: new Set(), sources: {}, latest: 0 };
                    grouped[prov].total++;
                    if (ev.kabkota) grouped[prov].kabkota.add(ev.kabkota);
                    const src = ev.source || 'Tidak diketahui';
                    grouped[prov].sources[src] = (grouped[prov].sources[src] || 0) + 1;
                    const ts = ev.timestamp ? new Date(ev.timestamp).getTime() : 0;
                    if (ts > grouped[prov].latest) grouped[prov].latest = ts;
                }
                const entries = Object.entries(grouped).sort((a, b) => b[1].total - a[1].total);
                const maxTotal = entries.length ? entries[0][1].total : 1;

                let html = `<div style="margin-bottom:12px;">
                    <div style="font-family:'Poppins',sans-serif;font-size:20px;font-weight:800;color:var(--ink);">${entries.length}</div>
                    <div style="color:var(--ink-muted);font-size:12px;font-weight:600;">Provinsi/wilayah terdampak kejadian kebakaran</div>
                </div>`;

                for (const [prov, data] of entries) {
                    const pct = Math.round((data.total / maxTotal) * 100);
                    const kabList = [...data.kabkota];
                    const shownKab = kabList.slice(0, 6);
                    const moreKab = kabList.length - shownKab.length;
                    const srcSorted = Object.entries(data.sources).sort((a, b) => b[1] - a[1]);
                    html += `
                        <div class="rekap-card">
                            <div class="rekap-head">
                                <span class="rekap-prov">🏛️ ${escHtml(prov)}</span>
                                <span class="rekap-total">${data.total}</span>
                            </div>
                            <div class="rekap-bar-track"><div class="rekap-bar-fill" data-pct="${pct}" style="width:0%;"></div></div>
                            ${kabList.length ? `
                                <div class="rekap-label">Kabupaten/Kota Terdampak (${kabList.length})</div>
                                <div class="rekap-chips">
                                    ${shownKab.map(k => `<span class="rekap-chip">${escHtml(k)}</span>`).join('')}
                                    ${moreKab > 0 ? `<span class="rekap-chip">+${moreKab} lainnya</span>` : ''}
                                </div>
                            ` : `<div class="rekap-label" style="color:var(--ink-muted);font-style:italic;">Data kabupaten/kota belum tersedia dari sumber</div>`}
                            <div class="rekap-label">Sumber Data</div>
                            ${srcSorted.map(([s, c]) => `<div class="rekap-src-row"><span>${escHtml(s)}</span><span>${c} kejadian</span></div>`).join('')}
                        </div>
                    `;
                }
                sidebarContent.innerHTML = html;
                requestAnimationFrame(() => {
                    document.querySelectorAll('.rekap-bar-fill').forEach(el => {
                        el.style.width = el.dataset.pct + '%';
                    });
                });
            }

            // ---------- RENDER: Stats ----------
            function renderStats(events) {
                if (!events || events.length === 0) {
                    sidebarContent.innerHTML = `<div class="empty-state"><span class="emoji">📊</span><p>Belum ada data untuk ditampilkan.</p></div>`;
                    return;
                }
                const provCount = {};
                let total = 0;
                let unknown = 0;
                for (const ev of events) {
                    total++;
                    let p = ev.province ? ev.province.trim() : '';
                    if (!p) { p = 'Provinsi belum teridentifikasi';
                        unknown++; }
                    provCount[p] = (provCount[p] || 0) + 1;
                }
                const sortedProv = Object.entries(provCount).sort((a, b) => b[1] - a[1]);

                let html = `
                    <div style="margin-bottom:14px;">
                        <div style="font-family:'Poppins',sans-serif;font-size:22px;font-weight:800;color:var(--ink);">${total}</div>
                        <div style="color:var(--ink-muted);font-size:13px;font-weight:600;">Total kejadian terpantau</div>
                        ${unknown > 0 ? `<div style="color:var(--gold-deep);font-size:12px;margin-top:6px;background:#fff3d6;padding:4px 10px;border-radius:8px;display:inline-block;">⚠️ ${unknown} data belum teridentifikasi provinsinya</div>` : ''}
                    </div>
                    <div class="rekap-label" style="margin-top:0;">📍 Berdasarkan Provinsi</div>
                `;
                for (const [prov, count] of sortedProv) {
                    const pct = Math.round((count / total) * 100);
                    html += `
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                            <span style="width:120px;font-size:12px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escHtml(prov)}">${escHtml(prov)}</span>
                            <div class="rekap-bar-track" style="flex:1;margin-bottom:0;"><div class="rekap-bar-fill" data-pct="${pct}" style="width:0%;"></div></div>
                            <span style="font-size:12px;color:var(--ink-muted);min-width:28px;text-align:right;font-weight:600;">${count}</span>
                        </div>
                    `;
                }
                const srcCount = {};
                const confCount = { Tinggi: 0, Sedang: 0, Rendah: 0 };
                for (const ev of events) {
                    const s = ev.source || 'tidak diketahui';
                    srcCount[s] = (srcCount[s] || 0) + 1;
                    const ci = getConfidenceInfo(ev.confidence);
                    if (ci && confCount[ci.label] !== undefined) confCount[ci.label]++;
                }
                const sortedSrc = Object.entries(srcCount).sort((a, b) => b[1] - a[1]);
                html += `<div class="rekap-label">📡 Sumber Data</div>`;
                for (const [src, count] of sortedSrc) {
                    html +=
                        `<div class="rekap-src-row" style="border-bottom:1px solid var(--border-soft);padding:4px 0;"><span style="color:var(--ink-soft);font-weight:600;">${escHtml(src)}</span><span style="color:var(--ink-muted);">${count}</span></div>`;
                }
                if (confCount.Tinggi + confCount.Sedang + confCount.Rendah > 0) {
                    html += `<div class="rekap-label">🎯 Tingkat Keyakinan Deteksi</div>`;
                    html += `<div class="rekap-src-row"><span style="color:var(--danger);font-weight:600;">🔴 Tinggi</span><span>${confCount.Tinggi}</span></div>`;
                    html += `<div class="rekap-src-row"><span style="color:var(--gold-deep);font-weight:600;">🟡 Sedang</span><span>${confCount.Sedang}</span></div>`;
                    html += `<div class="rekap-src-row"><span style="color:var(--info);font-weight:600;">🔵 Rendah</span><span>${confCount.Rendah}</span></div>`;
                }
                sidebarContent.innerHTML = html;
                requestAnimationFrame(() => {
                    document.querySelectorAll('.rekap-bar-fill').forEach(el => { el.style.width = el.dataset.pct + '%'; });
                });
            }

            // ---------- UPDATE MAP with source-specific markers ----------
            function updateMap(events) {
                markerGroup.clearLayers();
                if (!events || events.length === 0) return;

                // Ikon SVG untuk setiap sumber
                function makeIcon(color, shape = 'circle') {
                    const svg = shape === 'square' ?
                        `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"><rect x="1" y="1" width="16" height="16" rx="3" fill="${color}" stroke="#fff" stroke-width="2"/></svg>` :
                        `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="${color}" stroke="#fff" stroke-width="2"/></svg>`;
                    return L.icon({
                        iconUrl: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                        iconSize: [18, 18],
                        iconAnchor: [9, 9],
                        popupAnchor: [0, -12],
                    });
                }

                for (const ev of events) {
                    if (!ev.lat || !ev.lng) continue;
                    const lat = parseFloat(ev.lat);
                    const lng = parseFloat(ev.lng);
                    if (isNaN(lat) || isNaN(lng)) continue;

                    const src = ev.source || '';
                    const color = getSourceColor(src);
                    // BNPB Karhutla pakai kotak, sisanya lingkaran
                    const shape = (src && src.includes('BNPB Open Data')) ? 'square' : 'circle';
                    const icon = makeIcon(color, shape);

                    const catatan = buildCatatan(ev);
                    const popupContent = `
                        <strong>${escHtml(ev.title || 'Kebakaran')}</strong><br>
                        📍 ${escHtml(ev.location || ev.kabkota || '')}<br>
                        ${ev.province ? `<span class="provinsi-popup">🏛️ ${escHtml(ev.province)}</span>` : ''}
                        ${ev.kabkota && ev.kabkota !== ev.location ? `<br>🏙️ ${escHtml(ev.kabkota)}` : ''}
                        <br>🕒 ${ev.timestamp ? new Date(ev.timestamp).toLocaleString('id-ID') : '--'}
                        <br><span class="src-badge-popup" style="background:${color}20;color:${color};border:1px solid ${color}40;">📡 ${escHtml(src || 'tidak diketahui')}</span>
                        <span class="catatan-popup">${escHtml(catatan)}</span>
                    `;

                    const marker = L.marker([lat, lng], { icon }).bindPopup(popupContent);
                    markerGroup.addLayer(marker);
                }
            }

            // ---------- SWITCH TAB ----------
            function switchTab(tab) {
                currentTab = tab;
                document.querySelectorAll('.sidebar-tabs button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tab);
                });
                if (tab === 'list') renderList(allEvents);
                else if (tab === 'rekap') renderRekap(allEvents);
                else renderStats(allEvents);
            }

            // ---------- DATA SOURCES ----------
            async function fetchBNPBKarhutla(limit) {
                const out = [];
                try {
                    logMessage('📡 BNPB Karhutla...', 'info');
                    const url =
                        `https://data.bnpb.go.id/ne/api/3/action/datastore_search?resource_id=353da3aa-9ada-42aa-a5c2-e653d52ffd9c&limit=${limit}`;
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.success && json.result && json.result.records) {
                            const records = json.result.records;
                            for (const rec of records) {
                                const kab = rec['Nama Kabupaten/Kota'] || '';
                                const prov = rec['Provinsi'] || '';
                                const lat = rec['Latitude'];
                                const lng = rec['Longitude'];
                                const fire = rec['KEBAKARAN HUTAN DAN LAHAN'];
                                if (fire && fire !== '0' && fire !== '-' && fire !== '') {
                                    const dynamicDesc = buildDynamicDescription(rec, ['nama kabupaten/kota', 'provinsi']);
                                    const obj = {
                                        title: `Karhutla - ${kab}`,
                                        location: kab || 'Indonesia',
                                        province: prov,
                                        kabkota: kab,
                                        lat: lat,
                                        lng: lng,
                                        timestamp: new Date().toISOString(),
                                        source: 'BNPB Open Data',
                                        description: dynamicDesc || `Data BNPB: ${fire}`,
                                        _bnpbRaw: rec,
                                    };
                                    out.push(obj);
                                }
                            }
                            logMessage(`✅ BNPB Karhutla: ${records.length} record.`, 'ok');
                        } else {
                            logMessage('⚠️ BNPB Karhutla: tidak ada records.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ BNPB Karhutla: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ BNPB Karhutla error: ${e.message}`, 'err');
                }
                return out;
            }

            async function fetchBMKGHotspot(limit) {
                const out = [];
                try {
                    logMessage('📡 BMKG Hotspot...', 'info');
                    const url = 'https://data.bmkg.go.id/DataMKG/MEWS/hotspot/hotspot.json';
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.data && Array.isArray(json.data)) {
                            const items = json.data.slice(0, limit);
                            for (const item of items) {
                                const lat = parseFloat(item.lat);
                                const lng = parseFloat(item.lon);
                                if (isNaN(lat) || isNaN(lng)) continue;
                                const prov = item.provinsi || estimateProvinceFromCoords(lat, lng);
                                const dynamicDesc = buildDynamicDescription(item, ['provinsi', 'kabupaten']);
                                out.push({
                                    title: `Hotspot (BMKG) - ${item.kecamatan || ''}`,
                                    location: `${item.kabupaten || ''}, ${item.provinsi || ''}`,
                                    province: prov,
                                    kabkota: item.kabupaten || '',
                                    lat: lat,
                                    lng: lng,
                                    timestamp: item.tanggal ? new Date(item.tanggal).toISOString() : new Date()
                                        .toISOString(),
                                    source: 'BMKG Hotspot',
                                    description: dynamicDesc || `Confidence: ${item.confidence || '-'} | Kecamatan: ${item.kecamatan || ''}`,
                                    confidence: item.confidence
                                });
                            }
                            logMessage(`✅ BMKG Hotspot: ${items.length} titik.`, 'ok');
                        } else {
                            logMessage('⚠️ BMKG Hotspot: data tidak sesuai format.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ BMKG Hotspot: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ BMKG Hotspot error: ${e.message}`, 'err');
                }
                return out;
            }

            async function fetchNASAFirms(limit) {
                const out = [];
                try {
                    logMessage('📡 NASA FIRMS (MODIS)...', 'info');
                    const url =
                        'https://firms.modaps.eosdis.nasa.gov/api/country/csv/7daea73d6a1e3eba1f1089e3018b1c0e/MODIS_NRT/IDN/1';
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'text/csv' } });
                    if (resp.ok) {
                        const text = await resp.text();
                        const lines = text.split('\n').filter(line => line.trim() !== '');
                        if (lines.length > 1) {
                            const header = lines[0].split(',');
                            const latIdx = header.indexOf('latitude');
                            const lngIdx = header.indexOf('longitude');
                            const dateIdx = header.indexOf('acq_date');
                            const timeIdx = header.indexOf('acq_time');
                            const confIdx = header.indexOf('confidence');
                            let count = 0;
                            const maxItems = Math.min(limit, 500);
                            for (let i = 1; i < lines.length && count < maxItems; i++) {
                                const cols = lines[i].split(',');
                                const lat = parseFloat(cols[latIdx]);
                                const lng = parseFloat(cols[lngIdx]);
                                if (isNaN(lat) || isNaN(lng)) continue;
                                const date = cols[dateIdx] || '';
                                const time = cols[timeIdx] || '';
                                const conf = cols[confIdx] || '';
                                const timestamp = date ? new Date(date).toISOString() : new Date().toISOString();
                                const prov = estimateProvinceFromCoords(lat, lng);
                                const rowObj = {};
                                header.forEach((h, idx) => { if (h) rowObj[h] = cols[idx]; });
                                const dynamicDesc = buildDynamicDescription(rowObj, ['latitude', 'longitude']);
                                out.push({
                                    title: `Hotspot (NASA MODIS) - ${conf} confidence`,
                                    location: `${lat.toFixed(4)}, ${lng.toFixed(4)}`,
                                    province: prov,
                                    kabkota: '',
                                    lat: lat,
                                    lng: lng,
                                    timestamp: timestamp,
                                    source: 'NASA FIRMS (MODIS)',
                                    description: dynamicDesc || `Confidence: ${conf} | Waktu: ${time} | Tanggal: ${date}`,
                                    confidence: conf
                                });
                                count++;
                            }
                            logMessage(`✅ NASA FIRMS: ${count} hotspot.`, 'ok');
                        } else {
                            logMessage('⚠️ NASA FIRMS: data kosong.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ NASA FIRMS: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ NASA FIRMS error: ${e.message}`, 'err');
                }
                return out;
            }

            async function fetchGFW(limit) {
                const out = [];
                try {
                    logMessage('📡 Global Forest Watch (GLAD)...', 'info');
                    const url = `https://api.globalforestwatch.org/v1/glad-alerts/latest?limit=${Math.min(limit, 100)}`;
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.data && Array.isArray(json.data)) {
                            const items = json.data.slice(0, limit);
                            for (const item of items) {
                                const lat = parseFloat(item.latitude);
                                const lng = parseFloat(item.longitude);
                                if (isNaN(lat) || isNaN(lng)) continue;
                                const prov = estimateProvinceFromCoords(lat, lng);
                                const dynamicDesc = buildDynamicDescription(item, ['latitude', 'longitude']);
                                out.push({
                                    title: `GLAD Alert (GFW) - ${item.confidence || ''}`,
                                    location: `${lat.toFixed(4)}, ${lng.toFixed(4)}`,
                                    province: prov,
                                    kabkota: '',
                                    lat: lat,
                                    lng: lng,
                                    timestamp: item.alert_date ? new Date(item.alert_date).toISOString() : new Date()
                                        .toISOString(),
                                    source: 'Global Forest Watch',
                                    description: dynamicDesc || `Confidence: ${item.confidence || '-'}`,
                                    confidence: item.confidence
                                });
                            }
                            logMessage(`✅ GFW: ${items.length} alert.`, 'ok');
                        } else {
                            logMessage('⚠️ GFW: data tidak sesuai format.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ GFW: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ GFW error: ${e.message}`, 'err');
                }
                return out;
            }

            async function fetchBNPBKejadian(limit) {
                const out = [];
                try {
                    logMessage('📡 BNPB Data Kejadian...', 'info');
                    const url =
                        `https://data.bnpb.go.id/ne/api/3/action/datastore_search?resource_id=3c76f12f-30e6-465c-b7e7-81b13a5f2950&limit=${limit}`;
                    const resp = await fetchWithProxy(url, { headers: { 'Accept': 'application/json' } });
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.success && json.result && json.result.records) {
                            const records = json.result.records;
                            for (const rec of records) {
                                const jenis = rec['Jenis Bencana'] || '';
                                if (jenis.toLowerCase().includes('kebakaran') || jenis.toLowerCase().includes(
                                    'karhutla')) {
                                    const kab = rec['Kabupaten/Kota'] || '';
                                    const prov = rec['Provinsi'] || '';
                                    const lat = rec['Latitude'];
                                    const lng = rec['Longitude'];
                                    if (lat && lng) {
                                        const dynamicDesc = buildDynamicDescription(rec, ['kabupaten/kota', 'provinsi',
                                            'jenis bencana', 'tanggal'
                                        ]);
                                        out.push({
                                            title: `Kejadian: ${jenis}`,
                                            location: kab || 'Indonesia',
                                            province: prov,
                                            kabkota: kab,
                                            lat: lat,
                                            lng: lng,
                                            timestamp: rec['Tanggal'] || new Date().toISOString(),
                                            source: 'BNPB Data Kejadian',
                                            description: dynamicDesc || `Keterangan: ${rec['Keterangan'] || ''}`,
                                            _bnpbRaw: rec,
                                        });
                                    }
                                }
                            }
                            logMessage(`✅ BNPB Kejadian: ${records.length} record.`, 'ok');
                        } else {
                            logMessage('⚠️ BNPB Kejadian: tidak ada records.', 'err');
                        }
                    } else {
                        logMessage(`⚠️ BNPB Kejadian: HTTP ${resp.status}`, 'err');
                    }
                } catch (e) {
                    logMessage(`❌ BNPB Kejadian error: ${e.message}`, 'err');
                }
                return out;
            }

            // ---------- FETCH ALL ----------
            async function fetchAllData() {
                if (isRefreshing) return;
                isRefreshing = true;
                refreshBtn.disabled = true;
                refreshBtn.classList.add('spinning');
                setStatus(true, 'Mengambil data...');
                logMessage('🔄 Memulai pengambilan data dari berbagai sumber online (paralel)...', 'info');

                const limit = getLimit();
                logMessage(`📋 Batas per sumber: ${limit === 999999 ? 'ALL' : limit}`, 'info');

                const results = await Promise.allSettled([
                    fetchBNPBKarhutla(limit),
                    fetchBMKGHotspot(limit),
                    fetchNASAFirms(limit),
                    fetchGFW(limit),
                    fetchBNPBKejadian(limit),
                    loadRegencyProvinceMap()
                ]);

                let combined = [];
                for (const r of results) {
                    if (r.status === 'fulfilled' && Array.isArray(r.value)) combined = combined.concat(r.value);
                }

                // Koreksi provinsi dari kab/kota
                if (regencyMapReady) {
                    for (const ev of combined) {
                        if (ev.kabkota) {
                            const resolved = resolveProvinceFromKabkota(ev.kabkota);
                            if (resolved) ev.province = resolved;
                        }
                    }
                    logMessage('🗺️ Provinsi disesuaikan berdasarkan kabupaten/kota via API wilayah-indonesia.', 'ok');
                }

                // Deduplikasi
                const unique = [];
                const seen = new Set();
                for (const ev of combined) {
                    if (!ev.province) ev.province = '';
                    if (!ev.kabkota) ev.kabkota = '';
                    const key = `${ev.lat},${ev.lng},${ev.timestamp}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(ev);
                    }
                }

                if (unique.length === 0) {
                    logMessage('⚠️ Tidak ada data dari semua sumber.', 'err');
                    setStatus(false, 'Tidak ada data');
                } else {
                    logMessage(`✅ Total ${unique.length} kejadian berhasil dikumpulkan.`, 'ok');
                    setStatus(true, `${unique.length} kejadian`);
                }

                allEvents = unique;
                updateMap(allEvents);
                updateTimestamp();
                if (currentTab === 'list') renderList(allEvents);
                else if (currentTab === 'rekap') renderRekap(allEvents);
                else renderStats(allEvents);

                isRefreshing = false;
                refreshBtn.disabled = false;
                refreshBtn.classList.remove('spinning');
            }

            // ---------- INIT ----------
            function init() {
                document.querySelectorAll('.sidebar-tabs button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        switchTab(this.dataset.tab);
                    });
                });
                refreshBtn.addEventListener('click', function() {
                    fetchAllData();
                });
                limitSelect.addEventListener('change', function() {
                    fetchAllData();
                });
                // Auto-refresh setiap 60 detik
                setInterval(fetchAllData, 60000);
                fetchAllData();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
