<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ NUSANTARA MONITOR – Real‑time Dashboard</title>
    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #070b14;
            color: #e2eaf2;
            min-height: 100vh;
            padding: 16px 24px;
            background-image: radial-gradient(circle at 10% 20%, #132435 0%, #070b14 80%);
            animation: bgPulse 16s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* ----- HEADER ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding: 14px 28px;
            background: rgba(8, 18, 38, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 200, 255, 0.15);
            border-radius: 50px;
            box-shadow: 0 8px 40px rgba(0, 120, 255, 0.06);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #8cf0ff, #3b82f6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header .badge {
            display: flex;
            gap: 28px;
            align-items: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .badge .live {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .live .dot {
            width: 12px;
            height: 12px;
            background: #22d3ee;
            border-radius: 50%;
            box-shadow: 0 0 16px #22d3ee;
            animation: blink 1.4s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }

        /* ----- GRID ----- */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 28px;
            margin-bottom: 24px;
        }

        @media (max-width: 1024px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 720px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: rgba(10, 22, 44, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(80, 180, 255, 0.08);
            border-radius: 32px;
            padding: 20px 24px 28px;
            box-shadow: 0 20px 60px -16px rgba(0, 0, 0, 0.8);
            transition: transform 0.2s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 200, 255, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-header h2 {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 0.2px;
            color: #c8d8e8;
        }
        .card-header .icon {
            font-size: 2rem;
            opacity: 0.7;
        }
        .card-header .update-time {
            font-size: 0.75rem;
            color: #6b7f94;
            background: rgba(255,255,255,0.04);
            padding: 4px 14px;
            border-radius: 40px;
        }

        /* ----- TABEL KERETA ----- */
        .table-wrap {
            overflow-x: auto;
            margin-top: 6px;
            flex: 1;
        }

        .train-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 500px;
        }

        .train-table th {
            text-align: left;
            padding: 10px 8px 6px 0;
            color: #6b8fa8;
            font-weight: 500;
            letter-spacing: 0.3px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .train-table td {
            padding: 10px 8px 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            vertical-align: middle;
        }

        .train-table tr:last-child td {
            border-bottom: none;
        }

        .station-name {
            font-weight: 500;
            color: #e8f0f8;
        }
        .line-badge {
            display: inline-block;
            background: rgba(0, 180, 255, 0.12);
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #7fc9ff;
            border: 1px solid rgba(0, 180, 255, 0.15);
        }
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .status-badge.active {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }
        .status-badge.inactive {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.15);
        }
        .status-badge.unknown {
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.15);
        }
        .schedule-time {
            font-weight: 500;
            color: #b8d0e0;
            font-feature-settings: "tnum";
        }
        .position-info {
            font-size: 0.8rem;
            color: #8aa3b8;
        }
        .no-data {
            color: #f87171;
            padding: 12px 0;
            text-align: center;
        }

        /* ----- AIR & VOLCANO ----- */
        .card-body {
            max-height: 420px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #1a3a5f transparent;
            flex: 1;
        }
        .card-body::-webkit-scrollbar {
            width: 4px;
        }
        .card-body::-webkit-scrollbar-thumb {
            background: #1a3a5f;
            border-radius: 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.95rem;
            align-items: center;
            gap: 12px;
        }
        .item:last-child {
            border-bottom: none;
        }
        .item .label {
            color: #b0c4d8;
            flex: 1;
        }
        .item .value {
            font-weight: 500;
            text-align: right;
            white-space: nowrap;
        }
        .status-normal { color: #4ade80; }
        .status-waspada { color: #fbbf24; }
        .status-siaga { color: #fb923c; }
        .status-awas { color: #f87171; }

        .water-level {
            font-size: 1.4rem;
            font-weight: 600;
            margin-right: 4px;
        }

        /* ----- SCHEDULE EXTRA (KA) ----- */
        .schedule-extra {
            margin-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 14px;
        }
        .schedule-extra h3 {
            font-size: 0.9rem;
            color: #7fc9ff;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 8px;
        }
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 6px 16px;
        }
        .schedule-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 4px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.04);
        }
        .schedule-item .s-station {
            color: #b0c4d8;
        }
        .schedule-item .s-time {
            color: #8cf0ff;
            font-weight: 500;
        }
        .schedule-item .s-time.na {
            color: #6b7f94;
        }

        /* ----- FOOTER ----- */
        .footer {
            text-align: center;
            color: #475569;
            font-size: 0.8rem;
            padding: 24px 0 8px;
            border-top: 1px solid rgba(255,255,255,0.03);
            margin-top: 12px;
        }
        #statusMessage {
            color: #94a3b8;
        }

        /* shimmer */
        .shimmer {
            background: linear-gradient(90deg, #1a2a3a 25%, #2a3a4a 50%, #1a2a3a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite;
            border-radius: 6px;
            height: 1.2em;
            width: 80%;
            margin: 6px 0;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- HEADER -->
    <header class="header">
        <h1>⬡ NUSANTARA MONITOR</h1>
        <div class="badge">
            <span class="live"><span class="dot"></span> LIVE</span>
            <span>⏱️ <span id="lastUpdateTime">--</span></span>
        </div>
    </header>

    <!-- GRID -->
    <div class="grid">
        <!-- CARD 1: KERETA (dengan jadwal tambahan) -->
        <div class="card" id="trainCard" style="grid-column: 1 / -1;">
            <div class="card-header">
                <h2>🚆 Commuter Line – Status &amp; Jadwal</h2>
                <span class="update-time" id="trainTime">--</span>
            </div>
            <div class="table-wrap" id="trainBody">
                <div class="shimmer"></div><div class="shimmer" style="width:70%"></div>
                <div class="shimmer"></div><div class="shimmer" style="width:90%"></div>
            </div>
            <!-- Tempat untuk jadwal tambahan -->
            <div id="scheduleExtra" class="schedule-extra" style="display:none;">
                <h3>⏱️ Jadwal Keberangkatan Real‑time (stasiun terpilih)</h3>
                <div class="schedule-grid" id="scheduleGrid"></div>
            </div>
        </div>

        <!-- CARD 2: AIR -->
        <div class="card" id="waterCard">
            <div class="card-header">
                <h2>🌊 Tinggi Muka Air</h2>
                <span class="update-time" id="waterTime">--</span>
            </div>
            <div class="card-body" id="waterBody">
                <div class="shimmer"></div><div class="shimmer" style="width:55%"></div>
                <div class="shimmer"></div><div class="shimmer" style="width:65%"></div>
            </div>
        </div>

        <!-- CARD 3: GUNUNG -->
        <div class="card" id="volcanoCard">
            <div class="card-header">
                <h2>🌋 Status Gunung Api</h2>
                <span class="update-time" id="volcanoTime">--</span>
            </div>
            <div class="card-body" id="volcanoBody">
                <div class="shimmer"></div><div class="shimmer" style="width:50%"></div>
                <div class="shimmer"></div><div class="shimmer" style="width:75%"></div>
            </div>
        </div>
    </div>

    <footer class="footer">
        Data real‑time dari sumber resmi &nbsp;·&nbsp;
        <span id="statusMessage">⏳ memuat…</span>
    </footer>
</div>

<script>
    (function() {
        'use strict';

        // ----- KONFIGURASI -----
        const REFRESH_MS = 60000; // 1 menit
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        // ----- DOM refs -----
        const trainBody = document.getElementById('trainBody');
        const waterBody = document.getElementById('waterBody');
        const volcanoBody = document.getElementById('volcanoBody');
        const trainTime = document.getElementById('trainTime');
        const waterTime = document.getElementById('waterTime');
        const volcanoTime = document.getElementById('volcanoTime');
        const lastUpdateTime = document.getElementById('lastUpdateTime');
        const statusMsg = document.getElementById('statusMessage');
        const scheduleExtra = document.getElementById('scheduleExtra');
        const scheduleGrid = document.getElementById('scheduleGrid');

        // ----- helpers -----
        function formatTime(d) {
            return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function setStatus(msg, isError = false) {
            statusMsg.textContent = msg;
            statusMsg.style.color = isError ? '#f87171' : '#94a3b8';
        }

        function setCardTime(el, d) {
            if (el) el.textContent = formatTime(d);
        }

        // ============================================================
        //  1. KERETA – data stasiun + upaya jadwal real‑time
        // ============================================================
        async function fetchTrains() {
            try {
                // 1a. Data stasiun (tetap dari comuline)
                const url = 'https://api.comuline.com/v1/station';
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const json = await resp.json();
                if (!json.data || !Array.isArray(json.data)) throw new Error('Format data tidak dikenal');

                const stations = json.data.slice(0, 20);

                let html = `
                    <table class="train-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nama Stasiun</th>
                                <th>Jalur</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                stations.forEach((s, idx) => {
                    const name = s.name || s.id || 'Tidak diketahui';
                    let line = s.metadata?.line || s.line || '-';
                    const active = s.metadata?.active;
                    let statusClass = 'status-badge unknown';
                    let statusText = 'Tidak diketahui';
                    if (active === true) {
                        statusClass = 'status-badge active';
                        statusText = '🟢 Aktif';
                    } else if (active === false) {
                        statusClass = 'status-badge inactive';
                        statusText = '🔴 Tutup';
                    }

                    html += `
                        <tr>
                            <td>${idx+1}</td>
                            <td class="station-name">${name}</td>
                            <td><span class="line-badge">${line}</span></td>
                            <td><span class="${statusClass}">${statusText}</span></td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                    <div style="margin-top:12px; font-size:0.75rem; color:#475569; text-align:right;">
                        Sumber: api.comuline.com · diperbarui setiap 60 detik
                    </div>
                `;

                trainBody.innerHTML = html;
                setCardTime(trainTime, new Date());

                // 1b. Upaya ambil jadwal real‑time dari endpoint /schedule (jika tersedia)
                await fetchTrainSchedule();

                setStatus('✅ Kereta & jadwal OK');
            } catch (err) {
                trainBody.innerHTML = `
                    <div class="no-data">
                        ⚠️ Gagal memuat data stasiun<br>
                        <span style="font-size:0.85rem; color:#6b7f94;">${err.message}</span>
                        <br><br>
                        💡 Sumber: api.comuline.com (publik)
                    </div>
                `;
                setStatus('❌ Gagal kereta', true);
                // tetap coba jadwal meskipun stasiun gagal
                await fetchTrainSchedule();
            }
        }

        // Fungsi tambahan untuk mengambil jadwal dari comuline (jika ada)
        async function fetchTrainSchedule() {
            try {
                // Coba endpoint /schedule (tidak resmi, tetapi mungkin ada)
                const url = 'https://api.comuline.com/v1/schedule';
                const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
                if (!resp.ok) throw new Error('Schedule endpoint tidak tersedia');
                const json = await resp.json();

                // Asumsikan response memiliki array jadwal: misal [{ station, departures: [...] }]
                if (!json.data || !Array.isArray(json.data)) throw new Error('Format jadwal tidak dikenal');

                // Tampilkan 3-4 stasiun pertama dengan jadwal
                const scheduleData = json.data.slice(0, 4);
                let gridHtml = '';
                scheduleData.forEach(item => {
                    const st = item.station || item.name || 'Stasiun';
                    const times = item.departures || item.times || [];
                    let timeDisplay = times.length ? times.slice(0, 3).join(' · ') : '—';
                    gridHtml += `
                        <div class="schedule-item">
                            <span class="s-station">${st}</span>
                            <span class="s-time">${timeDisplay}</span>
                        </div>
                    `;
                });

                if (gridHtml) {
                    scheduleGrid.innerHTML = gridHtml;
                    scheduleExtra.style.display = 'block';
                } else {
                    scheduleExtra.style.display = 'none';
                }
            } catch (e) {
                // Gagal ambil jadwal – sembunyikan bagian ekstra
                scheduleExtra.style.display = 'none';
                console.warn('Jadwal tidak tersedia dari comuline:', e.message);
            }
        }

        // ============================================================
        //  2. TINGGI MUKA AIR – scraping lebih akurat dari Posko Banjir
        // ============================================================
        async function fetchWaterLevel() {
            try {
                const target = 'https://poskobanjir.dsdadki.web.id/';
                const proxyUrl = CORS_PROXY + encodeURIComponent(target);
                const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(15000) });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const html = await resp.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Cari semua tabel, ambil yang memiliki kolom lokasi dan tinggi
                const tables = doc.querySelectorAll('table');
                let items = [];
                for (const table of tables) {
                    const rows = table.querySelectorAll('tr');
                    // Cek header untuk menentukan apakah ini tabel data
                    let headerRow = rows[0];
                    if (!headerRow) continue;
                    const headers = headerRow.querySelectorAll('th, td');
                    const headerTexts = Array.from(headers).map(th => th.textContent.trim().toLowerCase());
                    // Cari indeks kolom yang mengandung 'lokasi', 'tinggi', 'status'
                    let idxLokasi = -1, idxTinggi = -1, idxStatus = -1, idxSungai = -1;
                    headerTexts.forEach((text, i) => {
                        if (text.includes('lokasi') || text.includes('pos')) idxLokasi = i;
                        else if (text.includes('tinggi') || text.includes('muka')) idxTinggi = i;
                        else if (text.includes('status')) idxStatus = i;
                        else if (text.includes('sungai') || text.includes('wilayah')) idxSungai = i;
                    });
                    if (idxLokasi === -1 || idxTinggi === -1) continue; // bukan tabel yang diinginkan

                    // Ambil data baris
                    for (let i = 1; i < rows.length; i++) {
                        const cells = rows[i].querySelectorAll('td');
                        if (cells.length < Math.max(idxLokasi, idxTinggi) + 1) continue;
                        const lokasi = cells[idxLokasi]?.textContent.trim() || '';
                        const sungai = (idxSungai !== -1) ? (cells[idxSungai]?.textContent.trim() || '') : '';
                        const tinggi = cells[idxTinggi]?.textContent.trim() || '';
                        const status = (idxStatus !== -1) ? (cells[idxStatus]?.textContent.trim() || '') : '';
                        if (lokasi && tinggi) {
                            items.push({ lokasi, sungai, tinggi, status });
                        }
                    }
                    if (items.length > 0) break; // ambil dari tabel pertama yang cocok
                }

                if (items.length === 0) {
                    // Fallback ke metode lama (cari semua td)
                    const allRows = doc.querySelectorAll('table tr');
                    allRows.forEach(tr => {
                        const tds = tr.querySelectorAll('td');
                        if (tds.length >= 4) {
                            const loc = tds[0]?.textContent.trim() || '';
                            const sungai = tds[1]?.textContent.trim() || '';
                            const tinggi = tds[2]?.textContent.trim() || '';
                            const status = tds[5]?.textContent.trim() || '';
                            if (loc && tinggi) items.push({ lokasi: loc, sungai, tinggi, status });
                        }
                    });
                }

                if (items.length === 0) {
                    throw new Error('Tidak ada data tabel – mungkin website berubah');
                }

                const show = items.slice(0, 10);
                let htmlOut = '';
                show.forEach(it => {
                    const statusLower = it.status.toLowerCase();
                    let statusClass = 'status-normal';
                    let statusLabel = it.status || 'Normal';
                    if (statusLower.includes('siaga')) statusClass = 'status-siaga';
                    else if (statusLower.includes('waspada')) statusClass = 'status-waspada';
                    else if (statusLower.includes('awas')) statusClass = 'status-awas';

                    htmlOut += `
                        <div class="item">
                            <span class="label">${it.lokasi} ${it.sungai ? `<span style="color:#6b7f94;font-size:0.8rem;">${it.sungai}</span>` : ''}</span>
                            <span class="value">
                                <span class="water-level">${it.tinggi}</span> cm
                                <span class="${statusClass}">${statusLabel}</span>
                            </span>
                        </div>
                    `;
                });

                htmlOut += `
                    <div style="margin-top:10px; font-size:0.75rem; color:#475569;">
                        Sumber: poskobanjir.dsdadki.web.id (Dinas SDA DKI Jakarta)
                    </div>
                `;

                waterBody.innerHTML = htmlOut;
                setCardTime(waterTime, new Date());
                setStatus('✅ Air OK');
            } catch (err) {
                waterBody.innerHTML = `
                    <div style="color:#f87171; padding:12px;">
                        ⚠️ Gagal memuat tinggi air<br>
                        <span style="font-size:0.85rem; color:#6b7f94;">${err.message}</span>
                        <br><br>
                        💡 Sumber: poskobanjir.dsdadki.web.id
                    </div>
                `;
                setStatus('❌ Gagal air', true);
            }
        }

        // ============================================================
        //  3. GUNUNG API – scraping tabel dari MAGMA Indonesia
        // ============================================================
        async function fetchVolcanoes() {
            try {
                const target = 'https://magma.vsi.esdm.go.id/';
                const proxyUrl = CORS_PROXY + encodeURIComponent(target);
                const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(15000) });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const html = await resp.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Cari tabel dengan data gunung api
                const tables = doc.querySelectorAll('table');
                let volcanoData = [];
                for (const table of tables) {
                    const rows = table.querySelectorAll('tr');
                    if (rows.length < 2) continue;
                    // Cek header
                    const headerRow = rows[0];
                    const headers = headerRow.querySelectorAll('th, td');
                    const headerTexts = Array.from(headers).map(th => th.textContent.trim().toLowerCase());
                    let idxNama = -1, idxLevel = -1, idxStatus = -1;
                    headerTexts.forEach((text, i) => {
                        if (text.includes('gunung') || text.includes('nama')) idxNama = i;
                        else if (text.includes('level') || text.includes('status')) idxLevel = i;
                        else if (text.includes('keterangan') || text.includes('aktivitas')) idxStatus = i;
                    });
                    if (idxNama === -1 || idxLevel === -1) continue;

                    // Ambil data baris
                    for (let i = 1; i < rows.length; i++) {
                        const cells = rows[i].querySelectorAll('td');
                        if (cells.length < Math.max(idxNama, idxLevel) + 1) continue;
                        const nama = cells[idxNama]?.textContent.trim() || '';
                        const level = cells[idxLevel]?.textContent.trim() || '';
                        const keterangan = (idxStatus !== -1) ? (cells[idxStatus]?.textContent.trim() || '') : '';
                        if (nama && level) {
                            volcanoData.push({ nama, level, keterangan });
                        }
                    }
                    if (volcanoData.length > 0) break;
                }

                // Fallback: cari teks yang mengandung "Gunung" dan level
                if (volcanoData.length === 0) {
                    const bodyText = doc.body?.innerText || '';
                    const lines = bodyText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    let found = [];
                    for (let line of lines) {
                        if (line.match(/gunung|merapi|semeru|level|siaga|waspada|awas|normal/i)) {
                            if (!found.some(ex => ex === line)) {
                                found.push(line);
                            }
                        }
                        if (found.length >= 15) break;
                    }
                    // Konversi ke format item
                    found.forEach(line => {
                        let level = 'Normal';
                        const lower = line.toLowerCase();
                        if (lower.includes('awas')) level = 'AWAS';
                        else if (lower.includes('siaga')) level = 'SIAGA';
                        else if (lower.includes('waspada')) level = 'WASPADA';
                        volcanoData.push({ nama: line.slice(0, 60), level, keterangan: '' });
                    });
                }

                if (volcanoData.length === 0) {
                    throw new Error('Tidak ditemukan data gunung – mungkin website berubah');
                }

                let htmlOut = '';
                volcanoData.slice(0, 12).forEach(v => {
                    let statusClass = 'status-normal';
                    let statusText = v.level || 'Normal';
                    const lower = statusText.toLowerCase();
                    if (lower.includes('awas')) statusClass = 'status-awas';
                    else if (lower.includes('siaga')) statusClass = 'status-siaga';
                    else if (lower.includes('waspada')) statusClass = 'status-waspada';

                    const displayNama = v.nama.length > 50 ? v.nama.slice(0, 50) + '…' : v.nama;
                    htmlOut += `
                        <div class="item">
                            <span class="label">${displayNama}</span>
                            <span class="value ${statusClass}">${statusText}</span>
                        </div>
                    `;
                });

                htmlOut += `
                    <div style="margin-top:10px; font-size:0.75rem; color:#475569;">
                        Sumber: magma.vsi.esdm.go.id (PVMBG)
                    </div>
                `;

                volcanoBody.innerHTML = htmlOut;
                setCardTime(volcanoTime, new Date());
                setStatus('✅ Gunung OK');
            } catch (err) {
                volcanoBody.innerHTML = `
                    <div style="color:#f87171; padding:12px;">
                        ⚠️ Gagal memuat status gunung<br>
                        <span style="font-size:0.85rem; color:#6b7f94;">${err.message}</span>
                        <br><br>
                        💡 Sumber: magma.vsi.esdm.go.id
                    </div>
                `;
                setStatus('❌ Gagal gunung', true);
            }
        }

        // ============================================================
        //  UPDATE SEMUA
        // ============================================================
        async function refreshAll() {
            const start = Date.now();
            setStatus('⏳ memperbarui…');

            await Promise.allSettled([
                fetchTrains(),
                fetchWaterLevel(),
                fetchVolcanoes()
            ]);

            const elapsed = ((Date.now() - start) / 1000).toFixed(1);
            lastUpdateTime.textContent = formatTime(new Date()) + ` (${elapsed}s)`;
            setStatus(`✅ diperbarui ${formatTime(new Date())}`);
        }

        // ============================================================
        //  START
        // ============================================================
        refreshAll();
        setInterval(refreshAll, REFRESH_MS);

        console.log('🚀 NUSANTARA MONITOR aktif – refresh setiap 60 detik');
        console.log('📡 Sumber: api.comuline.com | poskobanjir.dsdadki.web.id | magma.vsi.esdm.go.id');
    })();
</script>
